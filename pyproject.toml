[project]
name = "attest"
version = "0.1.0"
description = "Settlement reconciliation as constrained optimization"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "matplotlib>=3.8"]

[tool.mypy]
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 96
target-version = "py311"
