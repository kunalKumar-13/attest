<!doctype html><meta charset=utf-8>
<title>ATTEST 10 · A — Financial terminal</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>
/* ===================================================== PROTOTYPE A
   THE CASE IS THE OBJECT. THE INSTRUMENT IS THE ROOM.

   The autopsy measured 343px of vertical chrome, 38% of the viewport,
   repeated identically on seven lenses. Here the case turns 90 degrees:
   written once into a rail, never re-rendered, and the instrument gets
   the whole remaining rectangle at full height. */

:root{
  --type-display:34px; --type-title:20px; --type-data:15px;
  --type-body:13px; --type-label:11px; --type-micro:10px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-5:20px; --sp-6:24px; --sp-7:32px; --sp-8:40px;
  --r-sm:4px; --r-lg:8px;
  --micro:130ms cubic-bezier(.2,0,0,1);
  --standard:200ms cubic-bezier(.2,0,0,1);
  --spatial:300ms cubic-bezier(.16,1,.3,1);
  --bg:#fbfbfc; --rail:#f3f5f7; --sur:#fff; --sur2:#f7f8fa;
  --line:#e4e8ec; --line2:#ccd3da;
  --ink:#0f1419; --dim:#4e5764; --dim2:#6b7684; --dim3:#8b95a3;
  --flow:#12795a; --stop:#c0392b; --hold:#9a6a10; --cool:#1565d8;
  --s:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
  --m:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --s-PROVEN:#12795a; --s-AMBIGUOUS:#9a6a10; --s-CONTRADICTED:#c0392b;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c0f13; --rail:#11161c; --sur:#0f141a; --sur2:#161c24;
  --line:#1c232c; --line2:#2b343f;
  --ink:#e9edf2; --dim:#a3adba; --dim2:#8390a0; --dim3:#66717f;
  --flow:#43b98a; --stop:#ef6a55; --hold:#dda63f; --cool:#5b9ff5;
  --s-PROVEN:#43b98a; --s-AMBIGUOUS:#dda63f; --s-CONTRADICTED:#ef6a55;}}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:var(--type-body)/1.5 var(--s);
  -webkit-font-smoothing:antialiased;overflow:hidden}
.num{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button{font:inherit;color:inherit;background:0;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--cool);outline-offset:2px}

/* ---------------------------------------------------------- the frame */
#app{display:grid;grid-template-columns:296px minmax(0,1fr);height:100vh}
#app>*{min-width:0}

/* ------------------------------------------------------------ the rail */
.p-subject{background:var(--rail);border-right:1px solid var(--line);
  overflow-y:auto;display:flex;flex-direction:column}
.a-case{padding:var(--sp-5) var(--sp-5) var(--sp-3);display:flex;
  flex-direction:column;gap:var(--sp-3)}
.a-id{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap}
.a-id-n{font-size:var(--type-title);font-weight:600;letter-spacing:-.02em;
  line-height:1.1}
.a-verdict{font-size:9px;letter-spacing:.12em;padding:2px 5px;border-radius:var(--r-sm);
  border:1px solid currentColor}
.s-PROVEN{color:var(--s-PROVEN)} .s-AMBIGUOUS{color:var(--s-AMBIGUOUS)}
.s-CONTRADICTED{color:var(--s-CONTRADICTED)}
.a-amt{font-size:var(--type-display);line-height:1;font-weight:500;
  letter-spacing:-.035em}
.a-amt-k{font-size:var(--type-micro);letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim3);margin-top:calc(var(--sp-3) * -1 + 2px)}

/* the spine, vertical, in the rail — and it is a control */
.a-spine{display:flex;flex-direction:column;gap:2px;padding-top:var(--sp-2);
  border-top:1px solid var(--line)}
.a-st{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:var(--sp-2);
  align-items:center;padding:3px var(--sp-1);border-radius:var(--r-sm);
  transition:background var(--micro)}
.a-st:hover{background:var(--sur)}
.a-st-k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim3)}
.a-st-bar{height:9px;background:var(--sur);border-radius:2px;overflow:hidden;
  border:1px solid var(--line)}
.a-st-bar i{display:block;height:100%;background:var(--flow);
  transition:width var(--standard)}
.a-st.stop .a-st-bar i{background:var(--stop)}
.a-st.s-not_reached{opacity:.5}
.a-st.s-not_reached .a-st-bar i{background:var(--line2)}
.a-st-v{font-size:var(--type-micro);color:var(--dim)}
.a-st.stop .a-st-v{color:var(--stop)}
.a-st.stop .a-st-k{color:var(--stop)}

.a-stop{font-size:var(--type-micro);color:var(--dim2);line-height:1.45}
.a-stop b{color:var(--stop);letter-spacing:.06em}
.a-k{display:block;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim3);padding-bottom:2px}
.a-why{display:block;padding-top:2px}
.a-slot:empty{display:none}
.a-slot{border-top:1px solid var(--line);padding-top:var(--sp-3)}
.a-pair{display:flex;flex-direction:column;gap:1px}
.a-pair b{font-size:var(--type-data)}
.a-pair i{font-style:normal;font-size:var(--type-body);color:var(--stop)}
.a-next-w{font-size:var(--type-body);line-height:1.4}
.a-next-v{font-size:var(--type-data);color:var(--flow);padding-top:2px}
.a-next-v em{font-style:normal;font-size:9px;letter-spacing:.1em;color:var(--dim3);
  padding-left:var(--sp-2);font-family:var(--s)}

/* instruments at the rail's foot */
.p-lenses{margin-top:auto;border-top:1px solid var(--line);padding:var(--sp-2)}
.a-inst{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.a-inst button{padding:5px var(--sp-2);border-radius:var(--r-sm);
  font-size:var(--type-micro);letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim2);transition:background var(--micro),color var(--micro)}
.a-inst button:hover{background:var(--sur);color:var(--ink)}
.a-inst button.on{background:var(--ink);color:var(--bg);font-weight:600}

/* ------------------------------------------------------------ the room */
#workspace{position:relative;overflow:hidden;display:grid;
  grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
#workspace.has-ctx{grid-template-columns:minmax(0,1fr) minmax(0,380px)}
#w-spine{display:none}          /* the spine lives in the rail */
.w-main{overflow-y:auto;padding:var(--sp-6) var(--sp-7);min-width:0;
  overflow-anchor:none}
.w-ctx{overflow-y:auto;border-left:1px solid var(--line);background:var(--sur2);
  min-width:0}
.w-ctx:empty,#workspace:not(.has-ctx) .w-ctx{display:none}

.a-blk{padding-bottom:var(--sp-7)}
.a-blk h2{font-size:var(--type-title);font-weight:600;letter-spacing:-.015em;
  padding-bottom:var(--sp-4);line-height:1.25;max-width:56ch}

/* control: the flow at full width */
.a-flow{display:flex;flex-direction:column;gap:var(--sp-2)}
.a-fl{display:grid;grid-template-columns:96px minmax(0,1fr) 132px;
  gap:var(--sp-4);align-items:center}
.a-fl-k{font-size:var(--type-label);letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim3)}
.a-fl-track{height:20px;background:var(--sur2);border-radius:var(--r-sm);
  border:1px solid var(--line);overflow:hidden}
.a-fl-track i{display:block;height:100%;background:var(--flow);
  transition:width var(--standard)}
.a-fl.stop .a-fl-track i{background:var(--stop)}
.a-fl-v{font-family:var(--m);font-variant-numeric:tabular-nums;
  font-size:var(--type-data);text-align:right}
.a-fl-d{grid-column:2/4;font-size:var(--type-micro);color:var(--dim2);
  padding-bottom:var(--sp-2)}

.a-acts{display:flex;flex-direction:column}
.a-act{display:grid;grid-template-columns:78px minmax(0,1fr) 148px;
  gap:var(--sp-4);align-items:baseline;padding:var(--sp-3) var(--sp-2);
  border-top:1px solid var(--line);border-radius:var(--r-sm);
  transition:background var(--micro)}
.a-act:hover{background:var(--sur2)}
.a-act.sel{background:var(--sur2);box-shadow:inset 3px 0 0 var(--cool)}
.a-act-k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim3)}
.k-systemic .a-act-k{color:var(--flow)} .k-rerun .a-act-k{color:var(--cool)}
.k-per_item .a-act-k{color:var(--hold)}
.a-act-w{font-size:var(--type-body);line-height:1.4}
.a-act-v{font-size:var(--type-title);text-align:right;grid-column:3;grid-row:1}
.a-act-e{grid-column:3;grid-row:2;text-align:right;font-size:var(--type-micro);
  color:var(--dim3)}

.a-checks{display:flex;flex-direction:column}
.a-chk{display:grid;grid-template-columns:18px 168px minmax(0,1fr);gap:var(--sp-3);
  padding:var(--sp-2) 0;border-top:1px solid var(--line);align-items:baseline}
.a-chk-m{color:var(--dim3)} .a-chk.ok .a-chk-m{color:var(--flow)}
.a-chk-n{font-size:var(--type-body)}
.a-chk-d{font-size:var(--type-micro);color:var(--dim2)}

/* evidence: compression then explanations */
.a-band{display:flex;flex-direction:column;gap:var(--sp-2);padding-bottom:var(--sp-5)}
.a-bd{display:grid;grid-template-columns:104px minmax(0,1.1fr) minmax(0,1fr);
  gap:var(--sp-4);align-items:center}
.a-bd b{text-align:right;font-size:var(--type-data);color:var(--dim)}
.a-bd i{height:14px;border-radius:2px;background:var(--line2);display:block;
  transition:width var(--standard)}
.a-bd i.conv{background:var(--hold);opacity:.6} .a-bd i.det{background:var(--dim3)}
.a-bd em{font-style:normal;font-size:var(--type-micro);color:var(--dim2)}
.a-tag{font-size:8px;letter-spacing:.09em;border:1px solid var(--line2);
  border-radius:2px;padding:0 3px;margin-left:var(--sp-1);color:var(--dim3)}
.a-bd.keep i{background:var(--flow);height:20px}
.a-bd.keep b{font-size:var(--type-title);color:var(--flow)}

.a-exps{display:flex;flex-direction:column}
.a-exp{display:grid;grid-template-columns:24px minmax(0,1fr) 160px 128px;
  gap:var(--sp-4);align-items:center;padding:var(--sp-3) var(--sp-2);
  border-top:1px solid var(--line);border-radius:var(--r-sm);
  transition:background var(--micro)}
.a-exp:hover{background:var(--sur2)}
.a-exp.sel{background:var(--sur2);box-shadow:inset 3px 0 0 var(--cool)}
.a-exp-l{font-size:var(--type-data);font-weight:600}
.a-exp-b{display:flex;height:16px;border-radius:2px;overflow:hidden;background:var(--sur2)}
.a-exp-b .sh{background:var(--line2)} .a-exp-b .uq{background:var(--stop)}
.a-exp-n{font-size:var(--type-micro);color:var(--dim3)}
.a-exp-n em{font-style:normal;padding:0 var(--sp-2) 0 3px;font-family:var(--s)}
.a-exp-n b{color:var(--stop);font-size:var(--type-body)}
.a-exp-v{text-align:right;font-size:var(--type-body)}
.a-verdict-line{display:flex;flex-direction:column;gap:var(--sp-1);
  padding-top:var(--sp-4);font-size:var(--type-body);color:var(--dim)}
.a-verdict-line b{font-size:var(--type-data);color:var(--ink)}
.a-verdict-line .hot b{color:var(--stop)}

/* investigate: four beats */
.a-exp-run{display:flex;flex-direction:column;gap:var(--sp-3)}
.a-beat{padding:var(--sp-3);border-left:2px solid var(--line2);
  background:var(--sur2);border-radius:0 var(--r-sm) var(--r-sm) 0}
.a-beat.ac-model{border-left-color:var(--cool)}
.a-beat.ac-solver{border-left-color:var(--hold)}
.a-beat.ac-engine{border-left-color:var(--ink)}
.a-beat-h{display:flex;align-items:baseline;gap:var(--sp-2);padding-bottom:3px}
.a-mark{font-size:var(--type-data)}
.ac-model .a-mark{color:var(--cool)} .ac-solver .a-mark{color:var(--hold)}
.ac-engine .a-mark{color:var(--ink)}
.a-beat-a{font-size:var(--type-label);letter-spacing:.13em;text-transform:uppercase;
  font-weight:600}
.a-beat-v{font-size:var(--type-micro);color:var(--dim2)}
.a-beat-r{margin-left:auto;font-family:var(--m);font-size:var(--type-micro);
  letter-spacing:.06em;color:var(--stop)}
.a-beat-d{font-size:var(--type-body);color:var(--dim);line-height:1.45}
.a-qs{display:flex;flex-direction:column}
.a-q{display:grid;grid-template-columns:80px minmax(0,1fr) 140px 84px;gap:var(--sp-4);
  padding:var(--sp-3) 0;border-top:1px solid var(--line);align-items:baseline}
.a-q-k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim3)}
.a-q-v{text-align:right;font-size:var(--type-data)}
.a-q-n{text-align:right;font-size:var(--type-micro);color:var(--dim3)}

/* policy: the boundary */
.a-bound{display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  gap:var(--sp-5);align-items:center;padding-bottom:var(--sp-3)}
.a-bnd-e,.a-bnd-r{text-align:center}
.a-bnd-e b,.a-bnd-r b{display:block;font-size:var(--type-title)}
.a-bnd-e em,.a-bnd-r em{font-style:normal;font-size:9px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim3)}
.a-bnd-line{display:flex;height:22px;border-radius:2px;overflow:hidden;
  background:var(--sur2);position:relative}
.a-bnd-line .auto{background:var(--flow)} .a-bnd-line .rev{background:var(--hold)}
.a-bnd-line .blk{background:var(--stop)}
.a-bnd-legend{display:flex;gap:var(--sp-5);font-size:var(--type-micro);
  letter-spacing:.1em}
.a-bnd-legend .auto{color:var(--flow)} .a-bnd-legend .rev{color:var(--hold)}
.a-bnd-legend .blk{color:var(--stop)}
.a-unpriced{border-left:3px solid var(--hold);padding:var(--sp-3) var(--sp-5);
  max-width:64ch}
.a-unpriced b{font-size:var(--type-title);letter-spacing:.06em;color:var(--hold)}
.a-unpriced p{color:var(--dim);padding-top:var(--sp-2);line-height:1.5}
.a-unpriced-r{padding-top:var(--sp-3);font-size:var(--type-micro);letter-spacing:.12em;
  color:var(--dim3)}
.a-unpriced-r b{font-size:var(--type-data);color:var(--ink);letter-spacing:.04em}
.a-gates{display:flex;align-items:center;gap:var(--sp-4);padding-bottom:var(--sp-3)}
.a-gate{padding:var(--sp-3) var(--sp-4);border:1px solid var(--line2);
  border-radius:var(--r-sm);background:var(--sur2)}
.a-gate b{display:block;font-size:var(--type-body);letter-spacing:.1em}
.a-gate em{font-style:normal;font-size:var(--type-micro);color:var(--dim2)}
.a-gate-ar{color:var(--dim3)}

/* context */
.a-ctx-h{display:flex;align-items:baseline;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--sur2)}
.a-ctx-k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim3)}
.a-ctx-t{font-size:var(--type-body);font-weight:600}
.a-ctx-x{margin-left:auto;font-size:var(--type-title);line-height:1;color:var(--dim3)}
.w-ctx>*:not(.a-ctx-h){padding:0 var(--sp-4)}
.a-ctx-amt{font-size:var(--type-title);font-family:var(--m);padding-top:var(--sp-3)}
.a-ctx-why{font-size:var(--type-micro);color:var(--dim2);line-height:1.5;
  padding:var(--sp-2) 0}
.a-ex{display:flex;flex-direction:column;padding-bottom:var(--sp-5)}
.a-ex-r{display:flex;justify-content:space-between;gap:var(--sp-3);
  padding:var(--sp-2) 0;border-top:1px solid var(--line);font-size:var(--type-body);
  width:100%}
.a-ex-r:hover{background:var(--sur)}

.a-empty{padding:var(--sp-6) 0;max-width:56ch}
.a-empty b{display:block;font-size:var(--type-title)}
.a-err{padding:var(--sp-6);color:var(--stop)}
.a-load{display:flex;gap:var(--sp-2);padding:var(--sp-7)}
.a-load i{height:14px;width:120px;background:var(--sur2);border-radius:var(--r-sm);
  animation:pl 1.1s ease-in-out infinite}
.a-load i:nth-child(2){animation-delay:.12s} .a-load i:nth-child(3){animation-delay:.24s}
@keyframes pl{50%{background:var(--line)}}

/* motion */
@keyframes ctx-in{from{opacity:0;transform:translateY(calc(var(--oy,0px)*.22)) scale(.985)}}
@keyframes ctx-out{to{opacity:0;transform:translateY(calc(var(--oy,0px)*.16))}}
@keyframes turn-in{from{opacity:0;transform:translateY(8px)}}
@keyframes turn-out{to{opacity:0;transform:translateY(-5px)}}
@keyframes slide-in{from{opacity:0;transform:translateX(12px)}}
@keyframes slide-out{to{opacity:0;transform:translateX(-9px)}}
.x-in-ctx{animation:ctx-in var(--spatial)} .x-out-ctx{animation:ctx-out 120ms ease-in}
.x-in-turn{animation:turn-in var(--standard)} .x-out-turn{animation:turn-out 110ms ease-in}
.x-in-slide{animation:slide-in var(--standard)} .x-out-slide{animation:slide-out 110ms ease-in}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{
  animation-duration:1ms!important;transition-duration:1ms!important}}

/* responsive: the rail becomes a band, then collapses to essentials */
@media (max-width:1023px){
  #app{grid-template-columns:236px minmax(0,1fr)}
  .w-main{padding:var(--sp-5)}
  #workspace.has-ctx{grid-template-columns:minmax(0,1fr)}
  #workspace.has-ctx .w-ctx{position:absolute;inset:0 0 0 auto;width:min(420px,86vw);
    z-index:5;box-shadow:-12px 0 32px rgba(0,0,0,.14)}
  .a-fl-d{display:none}
}
@media (max-width:767px){
  #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .p-subject{border-right:0;border-bottom:1px solid var(--line);max-height:44vh}
  .a-case{padding:var(--sp-3) var(--sp-4);gap:var(--sp-2)}
  .a-amt{font-size:var(--type-title)}
  .a-spine{display:grid;grid-template-columns:1fr 1fr;gap:2px var(--sp-3)}
  .a-st{grid-template-columns:52px minmax(0,1fr)}
  .a-st-v{display:none}
  .p-lenses{position:sticky;bottom:0;background:var(--rail)}
  .a-inst{grid-template-columns:repeat(4,1fr)}
  .w-main{padding:var(--sp-4)}
  .a-act,.a-exp,.a-q{grid-template-columns:minmax(0,1fr) auto;gap:var(--sp-2)}
  .a-act-k,.a-exp-b,.a-q-k{display:none}
  .a-bd{grid-template-columns:76px minmax(0,1fr)} .a-bd em{display:none}
  .a-fl{grid-template-columns:64px minmax(0,1fr) 92px;gap:var(--sp-2)}
  .a-bound{grid-template-columns:1fr;gap:var(--sp-3)}
}
</style>
<div id=app>
  <aside id=subject></aside>
  <main id=workspace><div id=w-spine></div><div class=w-main id=w-main></div>
    <aside class=w-ctx id=w-ctx hidden aria-live=polite></aside></main>
  <nav id=lenses></nav>
</div>
<div id=live aria-live=polite style="position:absolute;left:-9999px"></div>
<script src=../guard.js></script>
<script src=kit.js></script>
<script src=data.js></script>
<script src=proto-a.js></script>
<script src=../shell.js></script>
<script src=boot.js></script>
