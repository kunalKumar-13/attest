<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>ATTEST</title>
<style>
:root{
  --bg:#0b0d10; --panel:#12151a; --panel2:#171b21; --line:#232831; --line2:#2e343e;
  --ink:#e7eaf0; --dim:#8a93a3; --dim2:#5d6674;
  --proven:#3ecf8e; --ambiguous:#e0a33e; --contradicted:#7a838f;
  --accent:#5b9dd9; 
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
}
@media (prefers-color-scheme:light){:root{
  --bg:#f7f8fa; --panel:#fff; --panel2:#fafbfc; --line:#e3e6ea; --line2:#d5d9df;
  --ink:#12151a; --dim:#5f6875; --dim2:#8b94a1;
  --proven:#12805a; --ambiguous:#8a6410; --contradicted:#5f6875; --accent:#1f6fb8;}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);
-webkit-font-smoothing:antialiased;display:flex;height:100vh;overflow:hidden}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---- sidebar ---- */
aside{width:212px;flex:0 0 212px;background:var(--panel);border-right:1px solid var(--line);
display:flex;flex-direction:column;padding:18px 0}
.brand{padding:0 18px 4px;font-size:16px;font-weight:700;letter-spacing:.14em}
.brand small{display:block;font-size:10.5px;font-weight:500;letter-spacing:.04em;
color:var(--dim2);margin-top:3px;text-transform:none}
nav{margin-top:26px;flex:1}
nav a{display:flex;align-items:center;gap:9px;padding:7px 18px;color:var(--dim);
cursor:pointer;font-size:13.5px;border-left:2px solid transparent;user-select:none}
nav a:hover{color:var(--ink);background:var(--panel2)}
nav a.on{color:var(--ink);border-left-color:var(--accent);background:var(--panel2)}
nav a i{width:14px;text-align:center;font-style:normal;opacity:.65;font-size:12px}
.side-foot{padding:12px 18px 0;border-top:1px solid var(--line);color:var(--dim2);
font-size:11px;line-height:1.7}
kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);
border-radius:3px;padding:1px 4px;color:var(--dim)}

/* ---- main ---- */
main{flex:1;overflow-y:auto;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;background:var(--bg);
border-bottom:1px solid var(--line);padding:16px 26px;display:flex;
align-items:center;gap:14px}
h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.crumb{color:var(--dim2);font-size:13px}
.spacer{flex:1}
button{font:inherit;font-size:13px;border:1px solid var(--line2);background:var(--panel);
color:var(--ink);padding:6px 13px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#04121f;
font-weight:600}
button.primary:hover{opacity:.9;color:#04121f}
input[type=number],select{font:inherit;font-size:13px;background:var(--panel);
color:var(--ink);border:1px solid var(--line2);border-radius:6px;padding:6px 9px;width:88px}
.body{padding:24px 26px 80px}

/* ---- stat grid ---- */
.grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
border-radius:9px;overflow:hidden;margin-bottom:22px}
.g5{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.cell{background:var(--panel);padding:15px 17px}
.cell .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim2)}
.cell .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:23px;
margin-top:6px;letter-spacing:-.02em}
.cell .s{font-size:11.5px;color:var(--dim2);margin-top:3px}

/* ---- verdict bar ---- */
.vbar{display:flex;height:7px;border-radius:4px;overflow:hidden;margin:6px 0 11px}
.vbar i{display:block}
.vlegend{display:flex;gap:22px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);
margin-bottom:26px}
.vlegend b{color:var(--ink);font-family:var(--mono);font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px}

h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim2);
margin:30px 0 11px;font-weight:600}
h2:first-child{margin-top:0}

/* ---- tables ---- */
.tw{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
color:var(--dim2);font-weight:600;padding:9px 13px;background:var(--panel2);
border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 13px;border-bottom:1px solid var(--line);font-size:13px}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--panel2)}
.r{text-align:right}
td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.07em;
padding:2.5px 7px;border-radius:4px;border:1px solid currentColor}
.p-PROVEN{color:var(--proven)} .p-AMBIGUOUS{color:var(--ambiguous)}
.p-CONTRADICTED{color:var(--contradicted)}

/* ---- detail ---- */
.two{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
@media(max-width:1080px){.two{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;
padding:17px 19px;margin-bottom:16px}
.card h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim2);
margin-bottom:13px;font-weight:600}
.chk{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);
font-size:13px;align-items:baseline}
.chk:last-child{border-bottom:none}
.chk .m{font-family:var(--mono);font-size:12px}
.chk .nm{min-width:118px;color:var(--ink)}
.chk .dt{color:var(--dim);font-size:12px;flex:1}
.ok{color:var(--proven)} .no{color:var(--ambiguous)}
.flow{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:4px 0 2px}
.node{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;
padding:9px 13px;min-width:104px}
.node .l{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim2)}
.node .a{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;
margin-top:3px}
.arrow{color:var(--dim2);padding:0 9px;font-size:15px}
.sum-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;
border-bottom:1px solid var(--line)}
.sum-row:last-child{border-bottom:none}
.sum-row.tot{font-weight:700;border-top:1.5px solid var(--line2);margin-top:4px;
padding-top:9px;border-bottom:none}
.sum-row span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--dim)}
.note{color:var(--dim);font-size:12.5px;line-height:1.65;margin-top:12px}
.alt{border:1px dashed var(--line2);border-radius:7px;padding:11px 13px;margin-top:9px}
.alt .h{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim2);
margin-bottom:6px}
.ids{font-family:var(--mono);font-size:11.5px;color:var(--dim);word-break:break-all;
line-height:1.75}
.audit{font-family:var(--mono);font-size:12px;line-height:2}
.audit b{color:var(--accent);font-weight:500}
.audit .t{color:var(--dim2);margin-right:12px}

/* ---- palette ---- */
.pal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;
align-items:flex-start;justify-content:center;padding-top:16vh;z-index:50}
.pal.on{display:flex}
.pal .box{background:var(--panel);border:1px solid var(--line2);border-radius:11px;
width:min(540px,92vw);overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.45)}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;
color:var(--ink);font:inherit;font-size:15px;padding:15px 17px;outline:none}
.pal .it{padding:10px 17px;cursor:pointer;font-size:13.5px;display:flex;gap:11px}
.pal .it:hover,.pal .it.sel{background:var(--panel2)}
.pal .it small{color:var(--dim2);margin-left:auto}
.empty{color:var(--dim2);padding:40px 0;text-align:center;font-size:13px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line2);
border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;
vertical-align:-1px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
</style></head><body>
<aside>
  <div class=brand>ATTEST<small>verification engine</small></div>
  <nav id=nav>
    <a data-v=overview class=on><i>◧</i>Overview</a>
    <a data-v=reconciliation><i>≡</i>Reconciliation</a>
    <a data-v=exceptions><i>△</i>Exceptions</a>
    <a data-v=evaluation><i>▤</i>Evaluation</a>
    <a data-v=audit><i>⟐</i>Audit log</a>
  </nav>
  <div class=side-foot>
    <kbd>⌘K</kbd> command palette<br>
    <span id=runmeta>no run</span>
  </div>
</aside>
<main>
  <header>
    <h1 id=title>Overview</h1><span class=crumb id=crumb></span>
    <span class=spacer></span>
    <select id=size><option>120</option><option selected>250</option><option>500</option><option>1200</option></select>
    <button class=primary id=runbtn>Run reconciliation</button>
  </header>
  <div class=body id=view><div class=empty>Run a reconciliation to begin.</div></div>
</main>
<div class=pal id=pal><div class=box>
  <input id=palq placeholder="Search settlements, or type a command…" autocomplete=off>
  <div id=palr></div>
</div></div>
<script src=app.js></script>
</body></html>
