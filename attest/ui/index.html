<!doctype html><html lang=en data-theme=light><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>ATTEST</title>
<link rel=preconnect href="https://fonts.googleapis.com">
<link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel=stylesheet>
<style>
/* ATTEST — a case file, not a dashboard.
 *
 * The centre of the screen is the evidence, because the claim is that a
 * settlement can be *proven*, and a claim of proof must be shown rather than
 * summarised. Numbers support the picture; they never replace it.
 *
 * Dark is fixed, not a preference: an investigation surface looked at for hours
 * alongside terminals and ledgers. A light spreadsheet is the wrong register for
 * money that is not yet accounted for.
 */
:root, :root[data-theme=light]{
  --bg:#f6f7f9; --sunk:#fbfbfc; --sur:#ffffff; --sur2:#f7f8fa; --sur3:#eceef1;
  --line:#e6e9ed; --line2:#d6dbe2;
  --ink:#101418; --dim:#525c68; --dim2:#79838f; --dim3:#9aa3ad;
  --ok:#0d8f66; --ok-d:#eaf7f1; --warn:#a97613; --warn-d:#fdf5e4;
  --dead:#79838f; --acc:#1f6feb; --acc-d:#eef4fe;
  --shadow:0 1px 2px rgba(16,20,24,.05), 0 4px 14px rgba(16,20,24,.045);
  --glow:rgba(31,111,235,.05);
  --m:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --s:"Space Grotesk",ui-sans-serif,-apple-system,system-ui,sans-serif;

  /* Scale, not a collection of numbers. The audit found 11 radii and 19 font
     sizes across 428 lines of CSS — tokens existed, discipline did not. A
     one-off value now has to justify itself against one of these. */
  --r-1:6px; --r-2:9px; --r-3:12px; --r-4:16px; --r-full:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:34px; --s-7:48px;
  --t-micro:9px; --t-label:10.5px; --t-body:13px; --t-lead:15px;
  --t-h3:19px; --t-h2:24px; --t-num:30px; --t-hero:42px;
  --e-1:0 1px 2px rgba(16,20,24,.05);
  --e-2:0 1px 2px rgba(16,20,24,.05), 0 4px 14px rgba(16,20,24,.045);
  --e-3:0 12px 40px rgba(16,20,24,.10);
  --fast:.12s cubic-bezier(.2,0,0,1);
  --med:.2s cubic-bezier(.2,0,0,1);

  /* Status is semantic and never decorative (§24). Each state gets an ink, a
     ground and an edge so it can be expressed at any weight without inventing
     a new colour at the call site. */
  --st-proven:var(--ok);        --st-proven-bg:var(--ok-d);
  --st-ambiguous:var(--warn);   --st-ambiguous-bg:var(--warn-d);
  --st-contradicted:#b4442e;    --st-contradicted-bg:#fdeeeb;
  --st-insufficient:var(--dead);--st-insufficient-bg:var(--sur2);
  --st-investigate:var(--acc);  --st-investigate-bg:var(--acc-d);
}
:root[data-theme=dark]{
  --e-1:none; --e-2:none; --e-3:0 12px 40px rgba(0,0,0,.4);
  --st-contradicted:#e0715a; --st-contradicted-bg:#241310;
  --bg:#0b0f14; --sunk:#080b0f; --sur:#0f151c; --sur2:#131b24; --sur3:#18222c;
  --line:#151d26; --line2:#22303d;
  --ink:#dfe7ee; --dim:#9aa8b5; --dim2:#5c6b7a; --dim3:#3d4a57;
  --ok:#7ee3c1; --ok-d:#0d2019; --warn:#e2b34e; --warn-d:#1c1708;
  --dead:#5c6b7a; --acc:#4d7fa8; --acc-d:#0c1720;
  --shadow:none; --glow:rgba(126,227,193,.07);
  --st-proven:var(--ok);        --st-proven-bg:var(--ok-d);
  --st-ambiguous:var(--warn);   --st-ambiguous-bg:var(--warn-d);
  --st-insufficient:var(--dead);--st-insufficient-bg:var(--sur2);
  --st-investigate:var(--acc);  --st-investigate-bg:var(--acc-d);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--s);
-webkit-font-smoothing:antialiased;overflow:hidden}
.n{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

#app{display:grid;grid-template-rows:56px auto 1fr 24px;height:100vh}

/* ---------------- masthead ---------------- */
#top{display:flex;align-items:center;gap:16px;padding:0 26px;
background:var(--sur);border-bottom:1px solid var(--line)}
#top svg.logo{width:21px;height:21px;flex:0 0 21px}
.wm{font-size:15px;font-weight:700;letter-spacing:.16em}
.rule{width:1px;height:22px;background:var(--line)}
.tag{font-size:12px;color:var(--dim2)}
#top .sp{flex:1}
.btn{font:inherit;font-family:var(--m);font-size:11px;background:var(--sur);
border:1px solid var(--line2);color:var(--dim);padding:6px 12px;border-radius:7px;
cursor:pointer;transition:.13s}
.btn:hover{color:var(--ok);border-color:var(--ok)}
.btn.go{background:var(--acc);border-color:var(--acc);color:#04121d;font-weight:700}
.btn.go:hover{opacity:.9;color:#04121d}

/* ---------------- kpi band ---------------- */
#kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px 26px}
.kpi{background:var(--sur);border:1px solid var(--line);border-radius:14px;
padding:17px 19px;box-shadow:var(--shadow)}
.kpi .k{font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--dim3);
font-weight:600}
.kpi .v{font-family:var(--m);font-variant-numeric:tabular-nums;font-size:27px;
margin-top:7px;letter-spacing:-.035em;line-height:1.05}
.kpi .s{font-size:11px;color:var(--dim3);margin-top:5px}
.kpi .mt{height:3px;background:var(--line);margin-top:11px;border-radius:2px;overflow:hidden}
.kpi .mt i{display:block;height:100%;transition:width .3s}

/* ---------------- panes ---------------- */
#panes{display:grid;grid-template-columns:326px 1fr;gap:var(--s-4);overflow:hidden;
padding:var(--s-4) var(--s-5) var(--s-5)}
/* Modes that do not read a settlement list do not get one. The audit found the
   ledger occupying 326px of every screen, including source health. */
#panes.solo{grid-template-columns:1fr}
#panes.solo #left{display:none}
#left{background:var(--sur);border:1px solid var(--line);border-radius:14px;
overflow-y:auto;box-shadow:var(--shadow)}
#right{overflow-y:auto}
.lh{position:sticky;top:0;z-index:4;background:var(--sur);padding:13px 16px 10px;
display:flex;gap:9px;align-items:center;border-radius:14px 14px 0 0}
.lh input{flex:1;background:var(--sur2);border:1px solid var(--line);border-radius:8px;
color:var(--ink);font:inherit;font-family:var(--m);font-size:11px;padding:6px 10px;outline:0}
.lh input:focus{border-color:var(--acc)}
.lh .ct{font-family:var(--m);font-size:10px;color:var(--dim3)}
.tabs{display:flex;padding:0 12px;position:sticky;top:44px;background:var(--sur);z-index:3;
border-bottom:1px solid var(--line)}
.tabs b{font:inherit;font-size:10.5px;font-weight:500;color:var(--dim3);padding:8px 10px;
cursor:pointer;border-bottom:2px solid transparent}
.tabs b:hover{color:var(--dim)}
.tabs b.on{color:var(--ink);border-bottom-color:var(--acc)}
.row{display:grid;grid-template-columns:52px 28px 1fr 32px 54px;gap:8px;padding:6px 16px;
cursor:pointer;align-items:center;border-left:2px solid transparent;
font-family:var(--m);font-size:11px;font-variant-numeric:tabular-nums}
.row:hover{background:var(--sur2)}
.row.sel{background:var(--sur2);border-left-color:var(--acc)}
.row .id{color:var(--dim3)} .row.sel .id{color:var(--ink)}
.row .amt{text-align:right}
.row .vd{font-size:8px;font-weight:700;letter-spacing:.06em;text-align:right}
.row .rc{font-size:9px;color:var(--dim3);text-align:right;overflow:hidden;
white-space:nowrap}
.row .rc b{font-weight:500}
.gly{display:flex;gap:2px}
.gly i{width:4px;height:12px;border-radius:1px;background:var(--line2);display:block}
.gly i.y{background:var(--ok)} .gly i.n{background:var(--warn)}
.gly i.x{background:var(--dead);opacity:.3}
.v-PROVEN{color:var(--ok)} .v-AMBIGUOUS{color:var(--warn)} .v-CONTRADICTED{color:var(--dead)}

/* ---------------- case file ---------------- */
.case{padding:2px 0 40px;max-width:1180px}
.chd{display:flex;align-items:baseline;gap:14px}
.chd .sid{font-family:var(--m);font-size:19px;letter-spacing:-.02em}
.chd .amt{margin-left:auto;font-family:var(--m);font-size:30px;
font-variant-numeric:tabular-nums;letter-spacing:-.04em;line-height:1}
.pill{font-size:9.5px;font-weight:700;letter-spacing:.16em;padding:4px 10px;border-radius:6px;
border:1px solid currentColor}
.csub{color:var(--dim3);font-size:11px;font-family:var(--m);margin:7px 0 20px}

.gate{padding:16px 19px;border-radius:14px;margin-bottom:16px;border:1px solid;
box-shadow:var(--shadow)}
/* NOT `.gate.n` — `.n` is the global tabular-numeral class, so the modifier
   silently turned the entire refusal argument into monospace. */
.gate.approved{background:var(--ok-d);border-color:rgba(126,227,193,.26)}
.gate.refused{background:var(--warn-d);border-color:rgba(226,179,78,.24)}
.gate .b{font-family:var(--m);font-size:12.5px;font-weight:700;letter-spacing:.11em}
.gate .w{font-size:12.5px;color:var(--dim);margin-top:7px;line-height:1.6;max-width:70ch}
.whys{margin:9px 0 0 18px;padding:0;color:var(--dim);font-size:12.5px;line-height:1.65;
max-width:78ch}
.whys li{margin-bottom:4px}
.nxt{margin-top:11px;padding-top:10px;border-top:1px solid var(--line2);
font-size:12.5px;color:var(--dim);line-height:1.6}
.nxt b{color:var(--ink);font-weight:600;margin-right:7px}
.lg .l i{font-style:normal;font-size:9.5px;letter-spacing:.06em;margin-left:6px;
text-transform:uppercase}
.note b{font-weight:600}

.hero{background:var(--sur);border:1px solid var(--line);border-radius:14px;
padding:20px 24px 12px;margin-bottom:16px;position:relative;overflow:hidden;
box-shadow:var(--shadow)}
.hero::before{content:'';position:absolute;inset:0;
background:radial-gradient(640px 190px at 55% -22%,var(--glow),transparent 70%);
pointer-events:none}
.hero h4,.blk h4{font-size:9.5px;text-transform:uppercase;letter-spacing:.19em;
color:var(--dim3);font-weight:600;position:relative}
.hero .hint{font-size:11.5px;color:var(--dim3);margin:4px 0 8px;position:relative}
svg.flow{width:100%;display:block;position:relative}
.fl-lbl{fill:var(--dim2);font-family:var(--m);font-size:8.5px}
.fl-amt{fill:var(--ink);font-family:var(--m);font-size:10px}
.fl-cap{fill:var(--dim3);font-family:var(--m);font-size:8px;letter-spacing:.11em}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:1000px){.cols{grid-template-columns:1fr}}
.blk{background:var(--sur);border:1px solid var(--line);border-radius:14px;overflow:hidden;
margin-bottom:16px;box-shadow:var(--shadow)}
.blk h4{padding:14px 17px 11px;border-bottom:1px solid var(--line)}
.lg{font-family:var(--m);font-size:12px;font-variant-numeric:tabular-nums}
.lg .l{display:flex;padding:8px 17px;border-bottom:1px solid var(--line)}
.lg .l:last-child{border-bottom:0}
.lg .l .a{color:var(--dim2);flex:1} .lg .l .b{text-align:right}
.lg .l.t{background:var(--sur2);font-weight:700} .lg .l .neg{color:var(--warn)}
.ck{padding:11px 17px;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.ck .t{display:flex;gap:10px;align-items:center;font-size:12.5px}
.ck .t .mk{width:12px;font-family:var(--m);font-weight:700}
.ck .d{color:var(--dim3);font-size:10.5px;margin-top:4px;padding-left:22px;line-height:1.55}
.ok{color:var(--ok)} .warn{color:var(--warn)} .dead{color:var(--dead)}
.ords{max-height:270px;overflow-y:auto}
.ords .o{display:grid;grid-template-columns:72px 66px 1fr 1fr;gap:11px;padding:6px 17px;
font-family:var(--m);font-size:11px;font-variant-numeric:tabular-nums;
border-bottom:1px solid var(--line)}
.ords .o:last-child{border-bottom:0}
.ords .o.h{position:sticky;top:0;background:var(--sur2);color:var(--dim3);font-size:8.5px;
text-transform:uppercase;letter-spacing:.13em}
.ords .o span:nth-child(3),.ords .o span:nth-child(4){text-align:right}
.ords .mth{color:var(--dim3)}
.alt{display:flex;gap:13px;padding:9px 17px;border-bottom:1px solid var(--line);
font-family:var(--m);font-size:11px;align-items:baseline}
.alt .nn{color:var(--warn);width:22px} .alt .kk{color:var(--dim3);width:66px}
.alt .ii{flex:1;color:var(--dim3);font-size:9.5px;word-break:break-all}
.note{color:var(--dim3);font-size:11.5px;line-height:1.65;padding:12px 17px}

/* ---------------- integrations ---------------- */
.ing{padding:26px 34px 70px;max-width:1020px}
.ing h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-bottom:5px}
.ing .lead{color:var(--dim2);font-size:12.5px;margin-bottom:22px;max-width:76ch;line-height:1.6}
.src{background:var(--sur);border:1px solid var(--line);border-radius:14px;
box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.src.on{border-color:rgba(126,227,193,.35)}
.src .h{display:flex;align-items:center;gap:11px;padding:16px 19px 13px;
border-bottom:1px solid var(--line)}
.src .h b{font-size:15px;font-weight:600}
.dot2{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.pillx{font-family:var(--m);font-size:9px;letter-spacing:.13em;padding:3px 8px;
border-radius:5px;border:1px solid currentColor}
.src .b{padding:14px 19px}
.src .kv{display:flex;gap:12px;padding:6px 0;font-size:12.5px;
border-bottom:1px solid var(--line)}
.src .kv:last-child{border-bottom:0}
.src .kv span:first-child{color:var(--dim2);min-width:132px}
.src .kv b{font-weight:400;font-family:var(--m);font-size:11.5px}
.src .note{font-size:11.5px;color:var(--dim3);line-height:1.65;margin-top:11px;
padding-top:11px;border-top:1px solid var(--line)}
.src .ep{font-family:var(--m);font-size:10.5px;color:var(--dim2);
background:var(--sur2);border:1px solid var(--line);border-radius:6px;
padding:5px 9px;margin-top:4px;display:block;word-break:break-all}

/* ---------------- board ---------------- */
.boardwrap{padding:22px 26px 60px}
.bd-bar{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.bd-t{font-size:16px;font-weight:600;letter-spacing:-.01em}
.bd-sp{flex:1}
.btn.on{color:var(--acc);border-color:var(--acc);background:var(--acc-d)}
.bd{display:grid;gap:14px;grid-auto-rows:104px;align-items:stretch}
.bd-w{background:var(--sur);border:1px solid var(--line);border-radius:14px;
box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
min-width:0;transition:box-shadow .15s}
.bd.editing .bd-w{border-style:dashed;border-color:var(--line2)}
.bd-w.dragging{position:fixed;z-index:60;pointer-events:none;
box-shadow:0 18px 48px rgba(0,0,0,.22);opacity:.96;border-style:solid;
border-color:var(--acc)}
.bd-h{display:flex;align-items:center;gap:8px;padding:11px 14px 9px;
border-bottom:1px solid var(--line);flex:0 0 auto}
.bd-n{font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim3);
font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-g{color:var(--line2);cursor:default;font-size:11px;user-select:none}
.bd.editing .bd-g{cursor:grab;color:var(--dim3)}
.bd.editing .bd-g:active{cursor:grabbing}
.bd-x{border:1px solid var(--line);background:var(--sur2);color:var(--dim3);
border-radius:5px;width:20px;height:19px;font-size:10px;cursor:pointer;padding:0;
line-height:1;font-family:var(--m)}
.bd-x:hover{color:var(--acc);border-color:var(--acc)}
.bd-body{flex:1;padding:13px 15px;overflow:auto;min-height:0}
.bd-empty{color:var(--dim3);font-family:var(--m);font-size:11.5px;padding:16px 0;
text-align:center;line-height:1.7}
.bd-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bd-grid1{display:grid;gap:12px}
.bd-s .bd-k{font-size:8.5px;letter-spacing:.17em;text-transform:uppercase;
color:var(--dim3);font-weight:600}
.bd-s .bd-v{font-family:var(--m);font-variant-numeric:tabular-nums;font-size:19px;
margin-top:4px;letter-spacing:-.03em}
.bd-ss{font-size:10.5px;color:var(--dim3);margin-top:3px;line-height:1.5}
.bd-big{font-family:var(--m);font-size:30px;letter-spacing:-.04em}
.bd-bars{display:flex;flex-direction:column;gap:10px}
.bd-bl{display:flex;align-items:baseline;gap:8px;font-size:11.5px;color:var(--dim2)}
.bd-bl b{color:var(--ink);font-size:12.5px}
.bd-bp{margin-left:auto;font-family:var(--m);font-size:10px;color:var(--dim3)}
.bd-bt{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px}
.bd-bt i{display:block;height:100%;border-radius:3px}
.bd-note{font-size:10.5px;color:var(--dim3);line-height:1.6;margin-top:4px}
.bd-tbl{display:flex;flex-direction:column}
.bd-row{display:flex;align-items:center;gap:10px;padding:6px 0;
border-bottom:1px solid var(--line);font-size:11.5px}
.bd-row:last-child{border-bottom:0}
.bd-row>span:first-child{color:var(--dim2)}
.bd-row.link{cursor:pointer}
.bd-row.link:hover{background:var(--sur2)}
.bd-spark{width:100%;height:96px;display:block}
.bd-axis{display:flex;justify-content:space-between;font-family:var(--m);font-size:9.5px;
color:var(--dim3);margin-top:6px}
.bd-meas{font-family:var(--m);font-size:10px;color:var(--dim2);background:var(--sur2);
border:1px solid var(--line);border-radius:6px;padding:7px 10px;margin-top:5px;
white-space:pre;overflow-x:auto;line-height:1.6}
.pillx.warn{color:var(--warn)}
.bd-feed{display:flex;flex-direction:column;gap:10px}
.bd-ev{display:flex;gap:11px;font-size:11.5px}
.bd-t2{font-family:var(--m);font-size:9.5px;color:var(--dim3);flex:0 0 50px;padding-top:2px}
.bd-ev b{font-weight:600;font-size:11.5px}
.pk-back{position:fixed;inset:0;background:rgba(8,11,15,.42);z-index:70;display:flex;
align-items:flex-start;justify-content:center;padding-top:11vh}
.pk{background:var(--sur);border:1px solid var(--line2);border-radius:14px;
width:min(520px,92vw);max-height:70vh;overflow:auto;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.pk-h{padding:16px 19px 12px;font-size:15px;font-weight:600;
border-bottom:1px solid var(--line)}
.pk-cat{padding:12px 19px 6px;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;
color:var(--dim3);font-weight:600}
.pk-i{display:block;width:100%;text-align:left;background:transparent;border:0;
border-bottom:1px solid var(--line);padding:10px 19px;cursor:pointer;color:var(--ink);
font:inherit;font-size:13px}
.pk-i:hover{background:var(--sur2)}
.pk-i.used{opacity:.5}
.pk-i small{display:block;color:var(--dim3);font-size:10.5px;margin-top:2px}

/* ---------------- investigation ---------------- */
.inv{margin-bottom:16px;background:var(--sur);border:1px solid var(--line);
border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.inv .hd{padding:14px 18px 11px;border-bottom:1px solid var(--line);display:flex;
align-items:center;gap:11px}
.inv .hd h4{font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;
color:var(--dim3);font-weight:600}
.inv .hd .st{margin-left:auto;font-family:var(--m);font-size:9.5px;letter-spacing:.11em;
color:var(--warn);border:1px solid currentColor;border-radius:5px;padding:3px 8px}
.ev-row{display:grid;grid-template-columns:64px 1fr;gap:13px;padding:10px 18px;
border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.55}
.ev-row:last-child{border-bottom:0}
.ev-row .who{font-family:var(--m);font-size:9.5px;letter-spacing:.09em;
text-transform:uppercase;padding-top:2px}
.who.model{color:var(--acc)} .who.solver{color:var(--warn)}
.who.kernel{color:var(--ok)} .who.engine{color:var(--dim2)}
.ev-row .lens{font-family:var(--m);font-size:9.5px;color:var(--dim3);
margin-left:7px}
.ev-row .res{font-family:var(--m);font-size:10.5px;color:var(--warn);
margin-top:3px}
.inv .foot{padding:12px 18px;background:var(--sur2);border-top:1px solid var(--line);
font-size:11.5px;color:var(--dim3);line-height:1.65}

/* ---------------- ask ---------------- */
.ask{padding:26px 34px 70px;max-width:1020px}
.ask h2{font-size:19px;font-weight:600;margin-bottom:5px;letter-spacing:-.01em}
.ask .lead{color:var(--dim2);font-size:12.5px;margin-bottom:20px;max-width:74ch;
line-height:1.6}
.qbar{display:flex;align-items:center;gap:11px;background:var(--sur);
border:1px solid var(--line2);border-radius:12px;padding:13px 17px;
box-shadow:var(--shadow);margin-bottom:13px}
.qbar .pr{font-family:var(--m);color:var(--acc);font-size:15px}
.qbar input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);
font:inherit;font-family:var(--m);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px}
.chip{font-family:var(--m);font-size:10.5px;color:var(--dim2);background:var(--sur);
border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer}
.chip:hover{color:var(--acc);border-color:var(--acc)}
.ans{background:var(--sur);border:1px solid var(--line);border-radius:14px;
box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.ans .hd{padding:15px 19px 12px;border-bottom:1px solid var(--line);
display:flex;align-items:baseline;gap:11px}
.ans .hd b{font-size:15px;font-weight:600}
.ans .hd .kind{font-family:var(--m);font-size:9px;letter-spacing:.14em;
text-transform:uppercase;color:var(--dim3);margin-left:auto}
.ans .ft{padding:12px 19px;border-bottom:1px solid var(--line);font-size:13px;
line-height:1.6}
.ans .ft:last-child{border-bottom:0}
.ans .ev{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.ans .ev b{font-family:var(--m);font-size:10px;color:var(--dim2);background:var(--sur2);
border:1px solid var(--line);border-radius:5px;padding:3px 7px;cursor:pointer;
font-weight:400}
.ans .ev b:hover{color:var(--acc);border-color:var(--acc)}
.ans .q{font-family:var(--m);font-size:10.5px;color:var(--dim3);padding:11px 19px;
background:var(--sur2);border-top:1px solid var(--line);line-height:1.7}

/* ---------------- policy ---------------- */
.pol{padding:26px 34px 70px;max-width:1080px}
.pol h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-bottom:5px}
.pol .lead{color:var(--dim2);font-size:12.5px;margin-bottom:22px;max-width:74ch;
line-height:1.6}
.sl{background:var(--sur);border:1px solid var(--line);border-radius:14px;
padding:18px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.sl .top{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.sl .nm{font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;
color:var(--dim3);font-weight:600}
.sl .val{margin-left:auto;font-family:var(--m);font-size:20px;letter-spacing:-.03em}
.sl input[type=range]{width:100%;accent-color:var(--acc);height:3px}
.sl .ends{display:flex;justify-content:space-between;font-family:var(--m);
font-size:10px;color:var(--dim3);margin-top:7px}
.sl .why{font-size:11.5px;color:var(--dim3);margin-top:11px;line-height:1.6}
.out{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.out .c{background:var(--sur);border:1px solid var(--line);border-radius:12px;
padding:15px 17px;box-shadow:var(--shadow)}
.out .k{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim3);
font-weight:600}
.out .v{font-family:var(--m);font-size:22px;margin-top:6px;letter-spacing:-.03em}
.out .s{font-size:10.5px;color:var(--dim3);margin-top:4px}
svg.front{width:100%;height:200px;display:block}
.fx{fill:var(--dim3);font-family:var(--m);font-size:9px}
.stt{font-family:var(--m);font-size:11.5px;font-variant-numeric:tabular-nums}
.stt .r{display:flex;padding:7px 0;border-bottom:1px solid var(--line);gap:12px}
.stt .r:last-child{border-bottom:0}
.stt .r span:first-child{flex:1;color:var(--dim2)}

#bar{display:flex;align-items:center;gap:16px;border-top:1px solid var(--line);
background:var(--sur);padding:0 26px;font-family:var(--m);font-size:9.5px;color:var(--dim3)}
#bar b{color:var(--dim2);font-weight:400} #bar .sp{flex:1}
kbd{font-family:var(--m);font-size:9px;border:1px solid var(--line2);border-radius:3px;
padding:0 4px;color:var(--dim2)}
.empty{color:var(--dim3);padding:80px 20px;text-align:center;font-family:var(--m);font-size:12px}
.spin{display:inline-block;width:9px;height:9px;border:1.5px solid var(--line2);
border-top-color:var(--ok);border-radius:50%;animation:sp .7s linear infinite;
margin-right:8px;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
.case{animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
/* ---------------- modes (§17) ---------------- */
.modes{display:flex;gap:2px;margin-left:var(--s-5)}
.mode{background:transparent;border:0;border-radius:var(--r-2);padding:6px 13px 5px;
cursor:pointer;color:var(--dim2);font:inherit;font-size:var(--t-body);
font-weight:500;display:flex;flex-direction:column;align-items:flex-start;
line-height:1.15;transition:color var(--fast),background var(--fast)}
.mode em{font-style:normal;font-size:var(--t-micro);color:var(--dim3);
letter-spacing:.04em;margin-top:2px}
.mode:hover{color:var(--ink);background:var(--sur2)}
.mode.on{color:var(--ink);background:var(--sur2)}
.mode.on em{color:var(--acc)}

#subnav{display:flex;gap:2px;padding:0 var(--s-5);border-bottom:1px solid var(--line);
background:var(--bg)}
#subnav:empty{display:none}
.sub{background:transparent;border:0;border-bottom:2px solid transparent;
padding:9px 12px 7px;margin-bottom:-1px;cursor:pointer;color:var(--dim3);
font:inherit;font-size:var(--t-label);font-weight:500;
transition:color var(--fast),border-color var(--fast)}
.sub:hover{color:var(--ink)}
.sub.on{color:var(--ink);border-bottom-color:var(--acc)}

/* ---------------- control ---------------- */
.ctl{padding:var(--s-5) var(--s-6) var(--s-7);max-width:1180px}
.ctl-hd{display:flex;align-items:baseline;gap:var(--s-3);margin-bottom:var(--s-5)}
.ctl-hd h1{font-size:var(--t-h2);font-weight:600;letter-spacing:-.02em}
.ctl-hd .sub{color:var(--dim3);font-size:var(--t-body)}
/* Five figures across. The numbers are Indian-grouped and long, so the column
   floor is set by the widest realistic amount rather than by taste — at the old
   floor a crore-scale figure ran into its neighbour. */
.fs{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));
gap:var(--s-4) var(--s-5);padding-bottom:var(--s-5);
border-bottom:1px solid var(--line);margin-bottom:var(--s-5)}
.fs .metric .v{font-size:var(--t-h2);letter-spacing:-.02em}
.fs .metric .s{line-height:1.45;max-width:24ch}
.att-hd{display:flex;align-items:baseline;gap:var(--s-3);margin-bottom:var(--s-4)}
.att-hd h2{font-size:var(--t-h3);font-weight:600;letter-spacing:-.01em}
.att-hd .amt{margin-left:auto;font-family:var(--m);font-variant-numeric:tabular-nums;
color:var(--dim2);font-size:var(--t-body)}
.grp{margin-bottom:var(--s-5)}
.grp-hd{padding-bottom:5px}
.grp-hd{display:flex;align-items:baseline;gap:var(--s-2);padding:0 0 var(--s-2)}
.grp-hd b{font-size:var(--t-body);font-weight:600}
.grp-hd .n{font-family:var(--m);color:var(--dim3);font-size:var(--t-label)}
.grp-hd .tot{margin-left:auto;font-family:var(--m);font-variant-numeric:tabular-nums;
font-size:var(--t-body)}
/* Explanatory prose. Deliberately NOT `.why` — that class is the dotted-underline
   provenance affordance, and a paragraph wearing it promises a click that
   explains a number. Prose explains itself. */
.lede{color:var(--dim3);font-size:var(--t-label);line-height:1.65;
margin-bottom:var(--s-4);max-width:86ch}
.grp .lede{margin-bottom:10px;line-height:1.55}
.att{display:flex;align-items:center;gap:var(--s-4);padding:9px var(--s-4);
background:var(--sur);border:1px solid var(--line);border-radius:var(--r-2);
margin-bottom:4px;cursor:pointer;transition:border-color var(--fast),
transform var(--fast);text-align:left;width:100%;font:inherit;color:var(--ink)}
.att:hover{border-color:var(--acc);transform:translateX(2px)}
.att .dot{width:6px;height:6px;border-radius:var(--r-full);flex:none;
background:currentColor}
/* The verdict is the group, so the row does not repeat it in words — a dot
   carries the colour and the group heading carries the meaning. */
.att .dot.st-PROVEN{color:var(--st-proven)}
.att .dot.st-AMBIGUOUS{color:var(--st-ambiguous)}
.att .dot.st-CONTRADICTED{color:var(--st-contradicted)}
.att .dot.st-INSUFFICIENT{color:var(--st-insufficient)}
.att .id{font-family:var(--m);font-size:var(--t-label);color:var(--dim3);
min-width:74px}
.att .amt{font-family:var(--m);font-variant-numeric:tabular-nums;
font-size:var(--t-body);min-width:124px;text-align:right}
.att .line{flex:1;color:var(--dim2);font-size:var(--t-label);line-height:1.5}
.att .go{color:var(--acc);font-size:var(--t-label);opacity:0;
transition:opacity var(--fast);white-space:nowrap}
.att:hover .go,.att:focus-visible .go{opacity:1}
.more{font-size:var(--t-label);color:var(--dim3);padding:6px 0 0}

/* ---------------- financial state (the signature screen) ---------------- */
.state{padding:var(--s-5) var(--s-6) var(--s-7);max-width:940px}
.back{background:transparent;border:0;color:var(--dim3);font:inherit;
font-size:var(--t-label);cursor:pointer;padding:0 0 var(--s-4);
transition:color var(--fast)}
.back:hover{color:var(--acc)}
.state-hd{padding-bottom:var(--s-5);border-bottom:1px solid var(--line);
margin-bottom:var(--s-6)}
.state-amt{font-size:var(--t-hero);font-weight:600;letter-spacing:-.03em;
font-variant-numeric:tabular-nums;line-height:1.05;margin-top:4px}
.state-sub{color:var(--dim3);font-size:var(--t-label);margin-top:var(--s-3)}
.blockq{margin-bottom:var(--s-6)}
.blockq h4{font-size:var(--t-micro);letter-spacing:.1em;text-transform:uppercase;
color:var(--dim3);font-weight:600;margin-bottom:var(--s-4)}
.knw{display:flex;flex-direction:column;gap:10px}
.kn{font-size:var(--t-lead);line-height:1.45;color:var(--dim1)}
.kn b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.kn b.warn{color:var(--st-ambiguous)}
.cands{display:flex;flex-direction:column;gap:5px}
.cand{display:flex;align-items:center;gap:var(--s-3);font-size:var(--t-label)}
.cl{font-family:var(--m);color:var(--dim3);width:16px}
.cbar{flex:1;max-width:420px;height:7px;background:var(--sur2);
border-radius:var(--r-full);overflow:hidden;display:flex}
.cbar i{display:block;height:100%}
.cbar .cs{background:var(--dim3);opacity:.42}
.cbar .cu{background:var(--st-ambiguous)}
.cn{font-family:var(--m);color:var(--dim2);min-width:104px;text-align:right}
.cv{font-family:var(--m);font-variant-numeric:tabular-nums;min-width:106px;
text-align:right}
.cok{font-family:var(--m);font-size:var(--t-micro);min-width:78px;text-align:right}
.qnote{color:var(--dim3);font-size:var(--t-label);line-height:1.6;
margin-top:var(--s-3);max-width:72ch}
.res{font-size:var(--t-lead);line-height:1.5;color:var(--dim1)}
.will{display:flex;flex-direction:column;gap:8px;margin-bottom:var(--s-4)}
.w1{display:flex;align-items:flex-start;gap:10px;font-size:var(--t-body);
line-height:1.5;color:var(--dim1)}
.w1 i{width:7px;height:7px;border-radius:var(--r-full);background:var(--dim3);
margin-top:7px;flex:none}
.w1 i.y{background:var(--st-proven)}
.w1 b{color:var(--ink)}
.acts{display:flex;gap:var(--s-3)}

/* ---------------- verify ---------------- */
.rgates{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--s-6)}
.rgate{display:grid;grid-template-columns:24px 1fr 108px 118px;
grid-template-areas:"s l v b" ". w w w";gap:2px var(--s-3);align-items:baseline;
padding:11px var(--s-4);background:var(--sur);border:1px solid var(--line);
border-radius:var(--r-3)}
.rgate.fail{border-color:var(--st-contradicted)}
.rgate.warn{border-color:var(--st-ambiguous)}
.gs{grid-area:s;font-size:var(--t-body)}
.rgate.pass .gs{color:var(--st-proven)}
.rgate.fail .gs{color:var(--st-contradicted)}
.rgate.warn .gs{color:var(--st-ambiguous)}
.rgate.unknown .gs{color:var(--dim3)}
.gl{grid-area:l;font-size:var(--t-body);font-weight:500}
.gl em{font-style:normal;font-size:var(--t-micro);color:var(--st-contradicted);
letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
.gl em.adv{color:var(--dim3)}
.gv{grid-area:v;font-family:var(--m);font-variant-numeric:tabular-nums;
text-align:right;font-size:var(--t-label)}
.gb{grid-area:b;font-family:var(--m);font-variant-numeric:tabular-nums;
text-align:right;font-size:var(--t-micro);color:var(--dim3)}
.gw{grid-area:w;color:var(--dim3);font-size:var(--t-label);line-height:1.5;
max-width:78ch}
.bnote{background:var(--sur2);border-radius:var(--r-3);padding:var(--s-4);
color:var(--dim2);font-size:var(--t-label);line-height:1.65;max-width:82ch}
.bnote b{display:block;color:var(--ink);font-size:var(--t-micro);
letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}

.fails{display:flex;flex-direction:column;gap:6px;margin:var(--s-4) 0 var(--s-5)}
.fail{display:flex;gap:var(--s-4);padding:12px var(--s-4);background:var(--sur);
border:1px solid var(--line);border-radius:var(--r-3)}
.fail.ref{border-left:2px solid var(--st-investigate)}
.fid{font-family:var(--m);font-size:var(--t-label);color:var(--dim3);
min-width:32px;padding-top:1px}
.fbody{flex:1;min-width:0}
.fh{display:flex;align-items:baseline;gap:var(--s-3);margin-bottom:5px}
.fh b{font-size:var(--t-body);font-weight:600}
.fsev{font-size:var(--t-micro);letter-spacing:.08em;text-transform:uppercase;
color:var(--st-investigate);border:1px solid var(--st-investigate);
border-radius:var(--r-full);padding:1px 7px}
.fp{color:var(--dim2);font-size:var(--t-label);line-height:1.65;max-width:96ch;
display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fp.meas{display:flex;gap:8px;margin-top:6px;color:var(--dim1);
font-family:var(--m);font-size:var(--t-micro)}
.fp.meas i{width:2px;background:var(--acc);flex:none;border-radius:1px}

.prov{display:flex;flex-direction:column;gap:1px;background:var(--line);
border:1px solid var(--line);border-radius:var(--r-3);overflow:hidden}
.pr{display:grid;grid-template-columns:150px 1fr;gap:var(--s-4);
background:var(--sur);padding:10px var(--s-4)}
.prk{color:var(--dim3);font-size:var(--t-label)}
.pv{font-size:var(--t-label)}
.rules{display:flex;flex-direction:column;gap:1px;background:var(--line);
border:1px solid var(--line);border-radius:var(--r-3);overflow:hidden}
.rl{display:grid;grid-template-columns:168px 220px 1fr;gap:var(--s-4);
background:var(--sur);padding:11px var(--s-4);align-items:baseline}
.rn{font-size:var(--t-label);font-weight:500}
.rv{font-family:var(--m);font-size:var(--t-label);color:var(--dim1)}
.rw{color:var(--dim3);font-size:var(--t-label);line-height:1.5}

/* ---------------- automate ---------------- */
.blocked{display:flex;flex-wrap:wrap;gap:6px}
.bl{display:inline-flex;align-items:center;gap:7px;font-family:var(--m);
font-size:var(--t-label);color:var(--dim1);background:var(--sur);
border:1px solid var(--line);border-radius:var(--r-full);padding:5px 13px 5px 10px}
.bl i{font-style:normal;color:var(--st-contradicted)}
.atts{display:flex;flex-direction:column;gap:8px}
.atmpt{padding:var(--s-4);background:var(--sur);border:1px solid var(--line);
border-radius:var(--r-3)}
.atmpt.ok{border-left:2px solid var(--st-proven)}
.atmpt.no{border-left:2px solid var(--st-contradicted)}
.ah{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
margin-bottom:var(--s-3)}
.an{font-size:var(--t-body);font-weight:600}
.ai{color:var(--dim2);font-size:var(--t-label)}
.aj{color:var(--dim3);font-size:var(--t-micro)}
.ares{margin-left:auto;font-size:var(--t-micro);letter-spacing:.08em;
text-transform:uppercase}
.ares.y{color:var(--st-proven)}
.ares.n{color:var(--st-contradicted)}
.stg{display:flex;align-items:center;gap:0;margin-bottom:10px}
.sg{display:flex;align-items:center;gap:6px;font-size:var(--t-micro);
color:var(--dim3);padding-right:var(--s-3);cursor:help}
.sg::after{content:"";width:14px;height:1px;background:var(--line);
margin-left:var(--s-3)}
.sg:last-child::after{display:none}
.sg i{width:8px;height:8px;border-radius:var(--r-full);background:var(--sur2);
border:1px solid var(--line);flex:none}
.sg.pass i{background:var(--st-proven);border-color:var(--st-proven)}
.sg.pass span{color:var(--dim1)}
.sg.stop i{background:var(--st-contradicted);border-color:var(--st-contradicted)}
.sg.stop span{color:var(--st-contradicted)}
.areason{color:var(--dim2);font-size:var(--t-label);line-height:1.6;max-width:88ch}
.rost{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));
gap:8px}
.ag{padding:var(--s-4);background:var(--sur);border:1px solid var(--line);
border-radius:var(--r-3)}
.agn{font-size:var(--t-body);margin-bottom:5px}
.agp{color:var(--dim3);font-size:var(--t-label);line-height:1.55;
margin-bottom:10px}
.agc{display:flex;flex-wrap:wrap;gap:4px}
.cap{font-family:var(--m);font-size:var(--t-micro);color:var(--dim2);
background:var(--sur2);border-radius:var(--r-1);padding:2px 6px}

.evs{display:flex;flex-direction:column;gap:1px;background:var(--line);
border:1px solid var(--line);border-radius:var(--r-3);overflow:hidden;
margin-top:var(--s-4)}
.ev{display:grid;grid-template-columns:150px 200px 1fr 92px;gap:var(--s-4);
background:var(--sur);padding:9px var(--s-4);align-items:baseline;
font-size:var(--t-label)}
.et{color:var(--dim3);font-family:var(--m);font-size:var(--t-micro)}
.ek{font-size:var(--t-micro)}
.ed{color:var(--dim2)}
.est{text-align:right;font-size:var(--t-micro);letter-spacing:.06em;
text-transform:uppercase;color:var(--dim3)}
.est.accepted,.est.ok{color:var(--st-proven)}
.est.duplicate,.est.unsupported{color:var(--dim3)}
.est.bad_signature,.est.replay_mismatch,.est.rejected{color:var(--st-contradicted)}

/* ---------------- exceptions ---------------- */
.exg{display:flex;flex-direction:column;gap:8px;margin-top:var(--s-4)}
.exc{padding:var(--s-4) var(--s-5);background:var(--sur);
border:1px solid var(--line);border-radius:var(--r-3)}
.eh{display:flex;align-items:baseline;gap:var(--s-3);margin-bottom:8px}
.eh b{font-size:var(--t-lead);font-weight:600}
.en{font-family:var(--m);color:var(--dim3);font-size:var(--t-label)}
.ev2{margin-left:auto;font-family:var(--m);font-variant-numeric:tabular-nums;
font-size:var(--t-body)}
.ew{color:var(--dim2);font-size:var(--t-label);line-height:1.6;max-width:84ch}
.ex-next{color:var(--dim1);font-size:var(--t-label);line-height:1.6;
margin-top:8px;max-width:84ch}
.ex-next b{color:var(--dim3);font-size:var(--t-micro);letter-spacing:.08em;
text-transform:uppercase;margin-right:7px}
.exs{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.exl{font-family:var(--m);font-size:var(--t-micro);color:var(--dim2);
background:var(--sur2);border:1px solid transparent;border-radius:var(--r-1);
padding:3px 8px;cursor:pointer;transition:border-color var(--fast),color var(--fast)}
.exl:hover{border-color:var(--acc);color:var(--ink)}

/* ---------------- primitives (§54, §55) ----------------
   One definition per concept. PROVEN must look identical everywhere it appears,
   which is only true if there is one place it is defined. */
.st{display:inline-flex;align-items:center;gap:var(--s-2);font-family:var(--m);
font-size:var(--t-micro);font-weight:700;letter-spacing:.14em;padding:4px 9px;
border-radius:var(--r-1);border:1px solid currentColor;text-transform:uppercase}
.st-PROVEN{color:var(--st-proven);background:var(--st-proven-bg)}
.st-AMBIGUOUS{color:var(--st-ambiguous);background:var(--st-ambiguous-bg)}
.st-CONTRADICTED{color:var(--st-contradicted);background:var(--st-contradicted-bg)}
.st-INSUFFICIENT{color:var(--st-insufficient);background:var(--st-insufficient-bg)}

.metric{display:flex;flex-direction:column;gap:var(--s-1)}
.metric .k{font-size:var(--t-micro);letter-spacing:.18em;text-transform:uppercase;
color:var(--dim3);font-weight:600}
.metric .v{font-family:var(--m);font-variant-numeric:tabular-nums;
font-size:var(--t-num);letter-spacing:-.035em;line-height:1.05}
.metric .s{font-size:var(--t-label);color:var(--dim3)}
.metric.lg .v{font-size:var(--t-hero)}
.metric.sm .v{font-size:var(--t-h3)}

/* Every number that has a provenance path carries this, and it is the same
   affordance everywhere (§15, §47). A dotted underline is a promise that
   clicking explains where the figure came from. */
.why{border-bottom:1px dashed var(--line2);cursor:help}
.why:hover{border-bottom-color:var(--acc);color:var(--acc)}

.card{background:var(--sur);border:1px solid var(--line);border-radius:var(--r-4);
box-shadow:var(--e-2)}
.muted{color:var(--dim2)}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}

/* ---------------- accessibility ---------------- */
/* Focus is visible everywhere and never removed. A focus ring is how a keyboard
   user knows where they are; suppressing it to tidy the mouse experience makes
   the interface unusable for someone else. §52. */
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--sur);
border:1px solid var(--acc);border-radius:7px;padding:8px 14px;color:var(--ink)}
.skip:focus{left:14px}
h2.bd-t,h3.bd-n{font-family:inherit}
h3.bd-n{font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;
color:var(--dim3);font-weight:600}
button.bd-g{background:transparent;border:0;padding:0 2px;font:inherit}

/* Motion communicates state; for a viewer who has asked for less of it, the
   state still has to arrive — so transitions collapse rather than the feedback
   disappearing. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;
    animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .case,.hero{animation:none}
}

/* ---------------- responsive ---------------- */
/* Desktop is primary. Below these widths the board stops being a board and
   becomes a column — §51 is explicit that reproducing a drag surface on a phone
   is the wrong goal. Reading a settlement and acting on an exception are the
   jobs that must survive. */
@media (max-width: 1180px){
  #panes{grid-template-columns:280px 1fr}
  .cols{grid-template-columns:1fr}
  #kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width: 900px){
  #app{grid-template-rows:auto auto 1fr 24px}
  #top{flex-wrap:wrap;padding:10px 16px;gap:8px;height:auto}
  #top .tag{display:none}
  #kpis{grid-template-columns:repeat(2,1fr);padding:14px 16px;gap:10px}
  #panes{grid-template-columns:1fr;padding:0 16px 16px}
  /* One pane at a time. Two 50%-width panes on a phone are two unusable panes. */
  #left{max-height:38vh}
  .case,.pol,.ask,.ing,.boardwrap{padding:18px 16px 48px}
  .bd{grid-template-columns:1fr !important}
  .bd-w{grid-column:1 / -1 !important;grid-row:auto !important;min-height:190px}
  .bd-g{display:none}
  .chd .amt{font-size:22px}
  #bar{display:none}
}
@media (max-width: 620px){
  #kpis{grid-template-columns:1fr}
  .out{grid-template-columns:repeat(2,1fr)}
}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
code{font-family:var(--m);font-size:11px;color:var(--dim2)}
</style></head><body>
