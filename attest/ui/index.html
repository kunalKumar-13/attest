<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>ATTEST</title>
<style>
/* ATTEST — an investigation console.
 *
 * Not a dashboard. A dashboard answers "how are we doing"; an investigator asks
 * "why do you believe this", and that question is answered by evidence sitting
 * next to the claim, not two clicks away. So the proof is always on screen, the
 * ledger is always on screen, and moving between settlements never navigates.
 *
 * Monospace dominates because this is a ledger. Numbers must align vertically or
 * the eye cannot compare them, and comparing them is the entire job.
 */
:root{
  --bg:#0a0c0f; --rail:#0d1014; --pane:#101419; --pane2:#141a20; --edge:#1c232b;
  --edge2:#28313b; --ink:#dfe5ec; --dim:#7d8894; --dim2:#4e5866;
  --ok:#3fcf8e; --warn:#dda43c; --dead:#6b7684; --acc:#5ba3e0;
  --m:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --s:ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
}
@media(prefers-color-scheme:light){:root{
  --bg:#f4f6f8; --rail:#eceff2; --pane:#fff; --pane2:#f7f9fa; --edge:#dfe4e9;
  --edge2:#c9d1d9; --ink:#10161d; --dim:#5a6572; --dim2:#8b95a1;
  --ok:#0f7a52; --warn:#8a6208; --dead:#5a6572; --acc:#15619f;}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--s);
-webkit-font-smoothing:antialiased;overflow:hidden}
.n{font-family:var(--m);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{display:grid;grid-template-rows:38px 1fr 22px;height:100vh}

/* top strip: money, always visible, never a card */
#strip{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--edge);
background:var(--rail);padding:0 12px;overflow-x:auto}
#strip .logo{font-weight:700;letter-spacing:.2em;font-size:12px;padding-right:16px;
margin-right:4px;border-right:1px solid var(--edge);color:var(--ink)}
.m{display:flex;align-items:baseline;gap:7px;padding:0 14px;white-space:nowrap;
border-right:1px solid var(--edge);height:100%;align-items:center}
.m .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim2)}
.m .v{font-family:var(--m);font-variant-numeric:tabular-nums;font-size:13px}
.m.big .v{font-size:14px;font-weight:600}
#strip .sp{flex:1;border:0}
#strip button{font:inherit;font-size:11.5px;font-family:var(--m);background:transparent;
border:1px solid var(--edge2);color:var(--dim);padding:3px 9px;border-radius:4px;
cursor:pointer;margin-left:7px}
#strip button:hover{color:var(--acc);border-color:var(--acc)}
#strip select{font:inherit;font-family:var(--m);font-size:11.5px;background:transparent;
border:1px solid var(--edge2);color:var(--dim);border-radius:4px;padding:3px 5px}

/* three panes */
#panes{display:grid;grid-template-columns:minmax(360px,1fr) minmax(400px,1.15fr) 330px;
overflow:hidden}
.pane{overflow-y:auto;border-right:1px solid var(--edge);background:var(--pane)}
.pane:last-child{border-right:0}
.ph{position:sticky;top:0;z-index:3;background:var(--pane);border-bottom:1px solid var(--edge);
padding:7px 12px;display:flex;align-items:center;gap:9px;font-size:9.5px;
text-transform:uppercase;letter-spacing:.11em;color:var(--dim2)}
.ph .r{margin-left:auto;font-family:var(--m);text-transform:none;letter-spacing:0;
font-size:11px}
.ph input{background:transparent;border:0;outline:0;color:var(--ink);font:inherit;
font-family:var(--m);font-size:11.5px;text-transform:none;letter-spacing:0;width:110px}

/* ---------- ledger ---------- */
.led{font-family:var(--m);font-size:12px;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:96px 46px 1fr 34px 52px;gap:9px;
padding:4px 12px;cursor:pointer;align-items:center;border-left:2px solid transparent}
.row:hover{background:var(--pane2)}
.row.sel{background:var(--pane2);border-left-color:var(--acc)}
.row .id{color:var(--dim)}
.row.sel .id{color:var(--ink)}
.row .amt{text-align:right}
.row .cnt{text-align:right;color:var(--dim2);font-size:11px}

/* the constraint glyph — five marks, one per constraint, scannable down a column.
   This is the piece that makes 250 settlements readable at a glance: you do not
   read the verdict, you read WHICH constraint failed. */
.gly{display:flex;gap:2px}
.gly i{width:5px;height:11px;border-radius:1px;background:var(--edge2);display:block}
.gly i.y{background:var(--ok)}
.gly i.n{background:var(--warn)}
.gly i.x{background:var(--dead);opacity:.45}

/* residual against tolerance — how close to the edge this proof sits.
   A proof at 3% of its bound and one at 97% both "pass"; only one of them
   should let you sleep. */
.res{position:relative;height:11px;display:flex;align-items:center}
.res .tr{position:absolute;inset:0 0;background:var(--edge);border-radius:1px;height:3px;
top:4px}
.res .fl{position:absolute;height:3px;top:4px;border-radius:1px}
.res .md{position:absolute;left:50%;width:1px;height:9px;top:1px;background:var(--edge2)}

.vd{font-size:9.5px;letter-spacing:.08em;font-weight:700;text-align:right}
.v-PROVEN{color:var(--ok)} .v-AMBIGUOUS{color:var(--warn)} .v-CONTRADICTED{color:var(--dead)}

/* ---------- proof pane ---------- */
.pb{padding:13px 15px}
.hdr{display:flex;align-items:baseline;gap:11px;margin-bottom:3px}
.hdr .sid{font-family:var(--m);font-size:16px}
.hdr .amt{margin-left:auto;font-family:var(--m);font-size:19px;
font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sub{color:var(--dim2);font-size:11px;font-family:var(--m);margin-bottom:15px}

.eq{font-family:var(--m);font-size:12.5px;font-variant-numeric:tabular-nums;
border:1px solid var(--edge);border-radius:6px;overflow:hidden;margin-bottom:15px}
.eq .l{display:flex;padding:5px 12px;border-bottom:1px solid var(--edge)}
.eq .l:last-child{border-bottom:0}
.eq .l .lb{color:var(--dim);flex:1}
.eq .l .vl{text-align:right}
.eq .l.t{border-top:1px solid var(--edge2);font-weight:600;background:var(--pane2)}
.eq .l.q{background:var(--pane2)}
.eq .l .neg{color:var(--warn)}

h4{font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--dim2);
margin:16px 0 7px;font-weight:600}
.ord{font-family:var(--m);font-size:11.5px;font-variant-numeric:tabular-nums;
max-height:260px;overflow-y:auto;border:1px solid var(--edge);border-radius:6px}
.ord .o{display:grid;grid-template-columns:88px 52px 1fr 1fr;gap:8px;padding:3px 11px;
border-bottom:1px solid var(--edge)}
.ord .o:last-child{border-bottom:0}
.ord .o.h{position:sticky;top:0;background:var(--pane2);color:var(--dim2);font-size:9.5px;
text-transform:uppercase;letter-spacing:.09em}
.ord .o span:nth-child(3),.ord .o span:nth-child(4){text-align:right}
.ord .o .mth{color:var(--dim2)}

.alt{border:1px solid var(--edge);border-left:2px solid var(--warn);border-radius:5px;
padding:8px 11px;margin-bottom:7px;font-family:var(--m);font-size:11px}
.alt .ah{color:var(--dim);margin-bottom:4px;font-size:10.5px}
.alt .ai{color:var(--dim2);word-break:break-all;line-height:1.65}

/* ---------- right rail: constraints ---------- */
.ck{padding:8px 13px;border-bottom:1px solid var(--edge);font-size:11.5px}
.ck:last-child{border-bottom:0}
.ck .t{display:flex;align-items:center;gap:8px;font-family:var(--m);font-size:11.5px}
.ck .t .mk{width:13px}
.ck .t .nm{flex:1}
.ck .d{color:var(--dim2);font-size:10.5px;margin-top:3px;padding-left:21px;line-height:1.55}
.ok{color:var(--ok)} .warn{color:var(--warn)} .dead{color:var(--dead)}
.stat{padding:11px 13px;border-bottom:1px solid var(--edge);font-family:var(--m);
font-size:11.5px}
.stat .l{display:flex;justify-content:space-between;padding:2px 0}
.stat .l span:first-child{color:var(--dim2)}
.post{padding:11px 13px;font-family:var(--m);font-size:11px;border-bottom:1px solid var(--edge)}
.post .b{font-size:12px;font-weight:700;letter-spacing:.07em}

/* ---------- status bar ---------- */
#bar{display:flex;align-items:center;gap:16px;background:var(--rail);
border-top:1px solid var(--edge);padding:0 12px;font-family:var(--m);font-size:10.5px;
color:var(--dim2)}
#bar b{color:var(--dim);font-weight:500}
#bar .sp{flex:1}
kbd{font-family:var(--m);font-size:9.5px;border:1px solid var(--edge2);border-radius:3px;
padding:0 4px;color:var(--dim)}
.empty{color:var(--dim2);padding:44px 16px;text-align:center;font-family:var(--m);font-size:12px}
.spin{display:inline-block;width:9px;height:9px;border:1.5px solid var(--edge2);
border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;
margin-right:7px;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--edge2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
</style></head><body>
<div id=app>
  <div id=strip>
    <span class=logo>ATTEST</span>
    <div class="m big"><span class=k>processed</span><span class=v id=m-proc>—</span></div>
    <div class=m><span class=k>posted</span><span class="v ok" id=m-post>—</span></div>
    <div class=m><span class=k>held</span><span class="v warn" id=m-held>—</span></div>
    <div class=m><span class=k>unexplained</span><span class="v dead" id=m-unex>—</span></div>
    <div class="m big"><span class=k>false proofs</span><span class=v id=m-wrong>—</span></div>
    <span class=sp></span>
    <select id=size><option>120</option><option selected>250</option><option>500</option><option>1200</option></select>
    <button id=run>run ⏎</button>
  </div>

  <div id=panes>
    <div class=pane id=p1>
      <div class=ph><span>ledger</span>
        <span>/</span><input id=filter placeholder="filter…" autocomplete=off>
        <span class=r id=count></span></div>
      <div class=led id=ledger><div class=empty>press run</div></div>
    </div>
    <div class=pane id=p2>
      <div class=ph><span>proof</span><span class=r id=proofmeta></span></div>
      <div class=pb id=proof><div class=empty>select a settlement</div></div>
    </div>
    <div class=pane id=p3>
      <div class=ph><span>constraints</span></div>
      <div id=checks><div class=empty>—</div></div>
    </div>
  </div>

  <div id=bar>
    <span><kbd>j</kbd><kbd>k</kbd> move</span>
    <span><kbd>/</kbd> filter</span>
    <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> proven · ambiguous · contradicted</span>
    <span><kbd>0</kbd> all</span>
    <span class=sp></span>
    <span id=barmeta></span>
  </div>
</div>
<script src=app.js></script>
</body></html>
