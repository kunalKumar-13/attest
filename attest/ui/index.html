<!doctype html><html lang=en data-theme=light><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>ATTEST</title>
<link rel=preconnect href="https://fonts.googleapis.com">
<link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel=stylesheet>
<style>
/* ATTEST — a case file, not a dashboard.
 *
 * The centre of the screen is the evidence, because the claim is that a
 * settlement can be *proven*, and a claim of proof must be shown rather than
 * summarised. Numbers support the picture; they never replace it.
 *
 * Dark is fixed, not a preference: an investigation surface looked at for hours
 * alongside terminals and ledgers. A light spreadsheet is the wrong register for
 * money that is not yet accounted for.
 */
:root, :root[data-theme=light]{
  --bg:#f6f7f9; --sunk:#fbfbfc; --sur:#ffffff; --sur2:#f7f8fa; --sur3:#eceef1;
  --line:#e6e9ed; --line2:#d6dbe2;
  --ink:#101418; --dim:#525c68; --dim2:#79838f; --dim3:#9aa3ad;
  --ok:#0d8f66; --ok-d:#eaf7f1; --warn:#a97613; --warn-d:#fdf5e4;
  --dead:#79838f; --acc:#1f6feb; --acc-d:#eef4fe;
  --shadow:0 1px 2px rgba(16,20,24,.05), 0 4px 14px rgba(16,20,24,.045);
  --glow:rgba(31,111,235,.05);
  --m:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --s:"Space Grotesk",ui-sans-serif,-apple-system,system-ui,sans-serif;
}
:root[data-theme=dark]{
  --bg:#0b0f14; --sunk:#080b0f; --sur:#0f151c; --sur2:#131b24; --sur3:#18222c;
  --line:#151d26; --line2:#22303d;
  --ink:#dfe7ee; --dim:#9aa8b5; --dim2:#5c6b7a; --dim3:#3d4a57;
  --ok:#7ee3c1; --ok-d:#0d2019; --warn:#e2b34e; --warn-d:#1c1708;
  --dead:#5c6b7a; --acc:#4d7fa8; --acc-d:#0c1720;
  --shadow:none; --glow:rgba(126,227,193,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--s);
-webkit-font-smoothing:antialiased;overflow:hidden}
.n{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

#app{display:grid;grid-template-rows:60px auto 1fr 24px;height:100vh}

/* ---------------- masthead ---------------- */
#top{display:flex;align-items:center;gap:16px;padding:0 26px;
background:var(--sur);border-bottom:1px solid var(--line)}
#top svg.logo{width:21px;height:21px;flex:0 0 21px}
.wm{font-size:15px;font-weight:700;letter-spacing:.16em}
.rule{width:1px;height:22px;background:var(--line)}
.tag{font-size:12px;color:var(--dim2)}
#top .sp{flex:1}
.btn{font:inherit;font-family:var(--m);font-size:11px;background:var(--sur);
border:1px solid var(--line2);color:var(--dim);padding:6px 12px;border-radius:7px;
cursor:pointer;transition:.13s}
.btn:hover{color:var(--ok);border-color:var(--ok)}
.btn.go{background:var(--acc);border-color:var(--acc);color:#04121d;font-weight:700}
.btn.go:hover{opacity:.9;color:#04121d}

/* ---------------- kpi band ---------------- */
#kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px 26px}
.kpi{background:var(--sur);border:1px solid var(--line);border-radius:14px;
padding:17px 19px;box-shadow:var(--shadow)}
.kpi .k{font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--dim3);
font-weight:600}
.kpi .v{font-family:var(--m);font-variant-numeric:tabular-nums;font-size:27px;
margin-top:7px;letter-spacing:-.035em;line-height:1.05}
.kpi .s{font-size:11px;color:var(--dim3);margin-top:5px}
.kpi .mt{height:3px;background:var(--line);margin-top:11px;border-radius:2px;overflow:hidden}
.kpi .mt i{display:block;height:100%;transition:width .3s}

/* ---------------- panes ---------------- */
#panes{display:grid;grid-template-columns:326px 1fr;gap:16px;overflow:hidden;
padding:0 26px 20px}
#left{background:var(--sur);border:1px solid var(--line);border-radius:14px;
overflow-y:auto;box-shadow:var(--shadow)}
#right{overflow-y:auto}
.lh{position:sticky;top:0;z-index:4;background:var(--sur);padding:13px 16px 10px;
display:flex;gap:9px;align-items:center;border-radius:14px 14px 0 0}
.lh input{flex:1;background:var(--sur2);border:1px solid var(--line);border-radius:8px;
color:var(--ink);font:inherit;font-family:var(--m);font-size:11px;padding:6px 10px;outline:0}
.lh input:focus{border-color:var(--acc)}
.lh .ct{font-family:var(--m);font-size:10px;color:var(--dim3)}
.tabs{display:flex;padding:0 12px;position:sticky;top:44px;background:var(--sur);z-index:3;
border-bottom:1px solid var(--line)}
.tabs b{font:inherit;font-size:10.5px;font-weight:500;color:var(--dim3);padding:8px 10px;
cursor:pointer;border-bottom:2px solid transparent}
.tabs b:hover{color:var(--dim)}
.tabs b.on{color:var(--ink);border-bottom-color:var(--acc)}
.row{display:grid;grid-template-columns:52px 28px 1fr 32px 54px;gap:8px;padding:6px 16px;
cursor:pointer;align-items:center;border-left:2px solid transparent;
font-family:var(--m);font-size:11px;font-variant-numeric:tabular-nums}
.row:hover{background:var(--sur2)}
.row.sel{background:var(--sur2);border-left-color:var(--acc)}
.row .id{color:var(--dim3)} .row.sel .id{color:var(--ink)}
.row .amt{text-align:right}
.row .vd{font-size:8px;font-weight:700;letter-spacing:.06em;text-align:right}
.row .rc{font-size:9px;color:var(--dim3);text-align:right;overflow:hidden;
white-space:nowrap}
.row .rc b{font-weight:500}
.gly{display:flex;gap:2px}
.gly i{width:4px;height:12px;border-radius:1px;background:var(--line2);display:block}
.gly i.y{background:var(--ok)} .gly i.n{background:var(--warn)}
.gly i.x{background:var(--dead);opacity:.3}
.v-PROVEN{color:var(--ok)} .v-AMBIGUOUS{color:var(--warn)} .v-CONTRADICTED{color:var(--dead)}

/* ---------------- case file ---------------- */
.case{padding:2px 0 40px;max-width:1180px}
.chd{display:flex;align-items:baseline;gap:14px}
.chd .sid{font-family:var(--m);font-size:19px;letter-spacing:-.02em}
.chd .amt{margin-left:auto;font-family:var(--m);font-size:30px;
font-variant-numeric:tabular-nums;letter-spacing:-.04em;line-height:1}
.pill{font-size:9.5px;font-weight:700;letter-spacing:.16em;padding:4px 10px;border-radius:6px;
border:1px solid currentColor}
.csub{color:var(--dim3);font-size:11px;font-family:var(--m);margin:7px 0 20px}

.gate{padding:16px 19px;border-radius:14px;margin-bottom:16px;border:1px solid;
box-shadow:var(--shadow)}
.gate.y{background:var(--ok-d);border-color:rgba(126,227,193,.26)}
.gate.n{background:var(--warn-d);border-color:rgba(226,179,78,.24)}
.gate .b{font-family:var(--m);font-size:12.5px;font-weight:700;letter-spacing:.11em}
.gate .w{font-size:12.5px;color:var(--dim);margin-top:7px;line-height:1.6;max-width:70ch}
.whys{margin:9px 0 0 18px;padding:0;color:var(--dim);font-size:12.5px;line-height:1.65;
max-width:78ch}
.whys li{margin-bottom:4px}
.nxt{margin-top:11px;padding-top:10px;border-top:1px solid var(--line2);
font-size:12.5px;color:var(--dim);line-height:1.6}
.nxt b{color:var(--ink);font-weight:600;margin-right:7px}
.lg .l i{font-style:normal;font-size:9.5px;letter-spacing:.06em;margin-left:6px;
text-transform:uppercase}
.note b{font-weight:600}

.hero{background:var(--sur);border:1px solid var(--line);border-radius:14px;
padding:20px 24px 12px;margin-bottom:16px;position:relative;overflow:hidden;
box-shadow:var(--shadow)}
.hero::before{content:'';position:absolute;inset:0;
background:radial-gradient(640px 190px at 55% -22%,var(--glow),transparent 70%);
pointer-events:none}
.hero h4,.blk h4{font-size:9.5px;text-transform:uppercase;letter-spacing:.19em;
color:var(--dim3);font-weight:600;position:relative}
.hero .hint{font-size:11.5px;color:var(--dim3);margin:4px 0 8px;position:relative}
svg.flow{width:100%;display:block;position:relative}
.fl-lbl{fill:var(--dim2);font-family:var(--m);font-size:8.5px}
.fl-amt{fill:var(--ink);font-family:var(--m);font-size:10px}
.fl-cap{fill:var(--dim3);font-family:var(--m);font-size:8px;letter-spacing:.11em}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:1000px){.cols{grid-template-columns:1fr}}
.blk{background:var(--sur);border:1px solid var(--line);border-radius:14px;overflow:hidden;
margin-bottom:16px;box-shadow:var(--shadow)}
.blk h4{padding:14px 17px 11px;border-bottom:1px solid var(--line)}
.lg{font-family:var(--m);font-size:12px;font-variant-numeric:tabular-nums}
.lg .l{display:flex;padding:8px 17px;border-bottom:1px solid var(--line)}
.lg .l:last-child{border-bottom:0}
.lg .l .a{color:var(--dim2);flex:1} .lg .l .b{text-align:right}
.lg .l.t{background:var(--sur2);font-weight:700} .lg .l .neg{color:var(--warn)}
.ck{padding:11px 17px;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.ck .t{display:flex;gap:10px;align-items:center;font-size:12.5px}
.ck .t .mk{width:12px;font-family:var(--m);font-weight:700}
.ck .d{color:var(--dim3);font-size:10.5px;margin-top:4px;padding-left:22px;line-height:1.55}
.ok{color:var(--ok)} .warn{color:var(--warn)} .dead{color:var(--dead)}
.ords{max-height:270px;overflow-y:auto}
.ords .o{display:grid;grid-template-columns:72px 66px 1fr 1fr;gap:11px;padding:6px 17px;
font-family:var(--m);font-size:11px;font-variant-numeric:tabular-nums;
border-bottom:1px solid var(--line)}
.ords .o:last-child{border-bottom:0}
.ords .o.h{position:sticky;top:0;background:var(--sur2);color:var(--dim3);font-size:8.5px;
text-transform:uppercase;letter-spacing:.13em}
.ords .o span:nth-child(3),.ords .o span:nth-child(4){text-align:right}
.ords .mth{color:var(--dim3)}
.alt{display:flex;gap:13px;padding:9px 17px;border-bottom:1px solid var(--line);
font-family:var(--m);font-size:11px;align-items:baseline}
.alt .nn{color:var(--warn);width:22px} .alt .kk{color:var(--dim3);width:66px}
.alt .ii{flex:1;color:var(--dim3);font-size:9.5px;word-break:break-all}
.note{color:var(--dim3);font-size:11.5px;line-height:1.65;padding:12px 17px}

/* ---------------- board ---------------- */
.boardwrap{padding:22px 26px 60px}
.bd-bar{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.bd-t{font-size:16px;font-weight:600;letter-spacing:-.01em}
.bd-sp{flex:1}
.btn.on{color:var(--acc);border-color:var(--acc);background:var(--acc-d)}
.bd{display:grid;gap:14px;grid-auto-rows:104px;align-items:stretch}
.bd-w{background:var(--sur);border:1px solid var(--line);border-radius:14px;
box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
min-width:0;transition:box-shadow .15s}
.bd.editing .bd-w{border-style:dashed;border-color:var(--line2)}
.bd-w.dragging{position:fixed;z-index:60;pointer-events:none;
box-shadow:0 18px 48px rgba(0,0,0,.22);opacity:.96;border-style:solid;
border-color:var(--acc)}
.bd-h{display:flex;align-items:center;gap:8px;padding:11px 14px 9px;
border-bottom:1px solid var(--line);flex:0 0 auto}
.bd-n{font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim3);
font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-g{color:var(--line2);cursor:default;font-size:11px;user-select:none}
.bd.editing .bd-g{cursor:grab;color:var(--dim3)}
.bd.editing .bd-g:active{cursor:grabbing}
.bd-x{border:1px solid var(--line);background:var(--sur2);color:var(--dim3);
border-radius:5px;width:20px;height:19px;font-size:10px;cursor:pointer;padding:0;
line-height:1;font-family:var(--m)}
.bd-x:hover{color:var(--acc);border-color:var(--acc)}
.bd-body{flex:1;padding:13px 15px;overflow:auto;min-height:0}
.bd-empty{color:var(--dim3);font-family:var(--m);font-size:11.5px;padding:16px 0;
text-align:center;line-height:1.7}
.bd-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bd-grid1{display:grid;gap:12px}
.bd-s .bd-k{font-size:8.5px;letter-spacing:.17em;text-transform:uppercase;
color:var(--dim3);font-weight:600}
.bd-s .bd-v{font-family:var(--m);font-variant-numeric:tabular-nums;font-size:19px;
margin-top:4px;letter-spacing:-.03em}
.bd-ss{font-size:10.5px;color:var(--dim3);margin-top:3px;line-height:1.5}
.bd-big{font-family:var(--m);font-size:30px;letter-spacing:-.04em}
.bd-bars{display:flex;flex-direction:column;gap:10px}
.bd-bl{display:flex;align-items:baseline;gap:8px;font-size:11.5px;color:var(--dim2)}
.bd-bl b{color:var(--ink);font-size:12.5px}
.bd-bp{margin-left:auto;font-family:var(--m);font-size:10px;color:var(--dim3)}
.bd-bt{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px}
.bd-bt i{display:block;height:100%;border-radius:3px}
.bd-note{font-size:10.5px;color:var(--dim3);line-height:1.6;margin-top:4px}
.bd-tbl{display:flex;flex-direction:column}
.bd-row{display:flex;align-items:center;gap:10px;padding:6px 0;
border-bottom:1px solid var(--line);font-size:11.5px}
.bd-row:last-child{border-bottom:0}
.bd-row>span:first-child{color:var(--dim2)}
.bd-row.link{cursor:pointer}
.bd-row.link:hover{background:var(--sur2)}
.bd-spark{width:100%;height:96px;display:block}
.bd-axis{display:flex;justify-content:space-between;font-family:var(--m);font-size:9.5px;
color:var(--dim3);margin-top:6px}
.bd-feed{display:flex;flex-direction:column;gap:10px}
.bd-ev{display:flex;gap:11px;font-size:11.5px}
.bd-t2{font-family:var(--m);font-size:9.5px;color:var(--dim3);flex:0 0 50px;padding-top:2px}
.bd-ev b{font-weight:600;font-size:11.5px}
.pk-back{position:fixed;inset:0;background:rgba(8,11,15,.42);z-index:70;display:flex;
align-items:flex-start;justify-content:center;padding-top:11vh}
.pk{background:var(--sur);border:1px solid var(--line2);border-radius:14px;
width:min(520px,92vw);max-height:70vh;overflow:auto;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.pk-h{padding:16px 19px 12px;font-size:15px;font-weight:600;
border-bottom:1px solid var(--line)}
.pk-cat{padding:12px 19px 6px;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;
color:var(--dim3);font-weight:600}
.pk-i{display:block;width:100%;text-align:left;background:transparent;border:0;
border-bottom:1px solid var(--line);padding:10px 19px;cursor:pointer;color:var(--ink);
font:inherit;font-size:13px}
.pk-i:hover{background:var(--sur2)}
.pk-i.used{opacity:.5}
.pk-i small{display:block;color:var(--dim3);font-size:10.5px;margin-top:2px}

/* ---------------- investigation ---------------- */
.inv{margin-bottom:16px;background:var(--sur);border:1px solid var(--line);
border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.inv .hd{padding:14px 18px 11px;border-bottom:1px solid var(--line);display:flex;
align-items:center;gap:11px}
.inv .hd h4{font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;
color:var(--dim3);font-weight:600}
.inv .hd .st{margin-left:auto;font-family:var(--m);font-size:9.5px;letter-spacing:.11em;
color:var(--warn);border:1px solid currentColor;border-radius:5px;padding:3px 8px}
.ev-row{display:grid;grid-template-columns:64px 1fr;gap:13px;padding:10px 18px;
border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.55}
.ev-row:last-child{border-bottom:0}
.ev-row .who{font-family:var(--m);font-size:9.5px;letter-spacing:.09em;
text-transform:uppercase;padding-top:2px}
.who.model{color:var(--acc)} .who.solver{color:var(--warn)}
.who.kernel{color:var(--ok)} .who.engine{color:var(--dim2)}
.ev-row .lens{font-family:var(--m);font-size:9.5px;color:var(--dim3);
margin-left:7px}
.ev-row .res{font-family:var(--m);font-size:10.5px;color:var(--warn);
margin-top:3px}
.inv .foot{padding:12px 18px;background:var(--sur2);border-top:1px solid var(--line);
font-size:11.5px;color:var(--dim3);line-height:1.65}

/* ---------------- ask ---------------- */
.ask{padding:26px 34px 70px;max-width:1020px}
.ask h2{font-size:19px;font-weight:600;margin-bottom:5px;letter-spacing:-.01em}
.ask .lead{color:var(--dim2);font-size:12.5px;margin-bottom:20px;max-width:74ch;
line-height:1.6}
.qbar{display:flex;align-items:center;gap:11px;background:var(--sur);
border:1px solid var(--line2);border-radius:12px;padding:13px 17px;
box-shadow:var(--shadow);margin-bottom:13px}
.qbar .pr{font-family:var(--m);color:var(--acc);font-size:15px}
.qbar input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);
font:inherit;font-family:var(--m);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px}
.chip{font-family:var(--m);font-size:10.5px;color:var(--dim2);background:var(--sur);
border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer}
.chip:hover{color:var(--acc);border-color:var(--acc)}
.ans{background:var(--sur);border:1px solid var(--line);border-radius:14px;
box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.ans .hd{padding:15px 19px 12px;border-bottom:1px solid var(--line);
display:flex;align-items:baseline;gap:11px}
.ans .hd b{font-size:15px;font-weight:600}
.ans .hd .kind{font-family:var(--m);font-size:9px;letter-spacing:.14em;
text-transform:uppercase;color:var(--dim3);margin-left:auto}
.ans .ft{padding:12px 19px;border-bottom:1px solid var(--line);font-size:13px;
line-height:1.6}
.ans .ft:last-child{border-bottom:0}
.ans .ev{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.ans .ev b{font-family:var(--m);font-size:10px;color:var(--dim2);background:var(--sur2);
border:1px solid var(--line);border-radius:5px;padding:3px 7px;cursor:pointer;
font-weight:400}
.ans .ev b:hover{color:var(--acc);border-color:var(--acc)}
.ans .q{font-family:var(--m);font-size:10.5px;color:var(--dim3);padding:11px 19px;
background:var(--sur2);border-top:1px solid var(--line);line-height:1.7}

/* ---------------- policy ---------------- */
.pol{padding:26px 34px 70px;max-width:1080px}
.pol h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-bottom:5px}
.pol .lead{color:var(--dim2);font-size:12.5px;margin-bottom:22px;max-width:74ch;
line-height:1.6}
.sl{background:var(--sur);border:1px solid var(--line);border-radius:14px;
padding:18px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.sl .top{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.sl .nm{font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;
color:var(--dim3);font-weight:600}
.sl .val{margin-left:auto;font-family:var(--m);font-size:20px;letter-spacing:-.03em}
.sl input[type=range]{width:100%;accent-color:var(--acc);height:3px}
.sl .ends{display:flex;justify-content:space-between;font-family:var(--m);
font-size:10px;color:var(--dim3);margin-top:7px}
.sl .why{font-size:11.5px;color:var(--dim3);margin-top:11px;line-height:1.6}
.out{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.out .c{background:var(--sur);border:1px solid var(--line);border-radius:12px;
padding:15px 17px;box-shadow:var(--shadow)}
.out .k{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim3);
font-weight:600}
.out .v{font-family:var(--m);font-size:22px;margin-top:6px;letter-spacing:-.03em}
.out .s{font-size:10.5px;color:var(--dim3);margin-top:4px}
svg.front{width:100%;height:200px;display:block}
.fx{fill:var(--dim3);font-family:var(--m);font-size:9px}
.stt{font-family:var(--m);font-size:11.5px;font-variant-numeric:tabular-nums}
.stt .r{display:flex;padding:7px 0;border-bottom:1px solid var(--line);gap:12px}
.stt .r:last-child{border-bottom:0}
.stt .r span:first-child{flex:1;color:var(--dim2)}

#bar{display:flex;align-items:center;gap:16px;border-top:1px solid var(--line);
background:var(--sur);padding:0 26px;font-family:var(--m);font-size:9.5px;color:var(--dim3)}
#bar b{color:var(--dim2);font-weight:400} #bar .sp{flex:1}
kbd{font-family:var(--m);font-size:9px;border:1px solid var(--line2);border-radius:3px;
padding:0 4px;color:var(--dim2)}
.empty{color:var(--dim3);padding:80px 20px;text-align:center;font-family:var(--m);font-size:12px}
.spin{display:inline-block;width:9px;height:9px;border:1.5px solid var(--line2);
border-top-color:var(--ok);border-radius:50%;animation:sp .7s linear infinite;
margin-right:8px;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
.case{animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
code{font-family:var(--m);font-size:11px;color:var(--dim2)}
</style></head><body>
<div id=app>
  <div id=top>
    <svg class=logo viewBox="0 0 24 24" fill=none>
      <path d="M12 2.6 3.2 7v6.2c0 5 3.7 8.5 8.8 9.8 5.1-1.3 8.8-4.8 8.8-9.8V7L12 2.6Z"
        stroke="var(--acc)" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="m8.4 12.3 2.6 2.6 4.9-5.2" stroke="var(--ok)" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class=wm>ATTEST</span><span class=rule></span>
    <span class=tag>The verification engine for agentic finance</span>
    <span class=sp></span>
    <button class=btn id=theme title="light / dark">◐</button>
    <select class=btn id=size><option>120</option><option selected>250</option><option>500</option><option>1200</option></select>
    <button class=btn id=board>Board</button>
    <button class=btn id=ask>Ask</button>
    <button class=btn id=policy>Policy</button>
    <button class="btn go" id=run>Run</button>
  </div>

  <div id=kpis>
    <div class=kpi><div class=k>processed</div><div class=v id=m-proc>—</div>
      <div class=s id=s-proc>—</div><div class=mt><i id=b-proc style="width:100%;background:var(--dim2)"></i></div></div>
    <div class=kpi><div class=k>auto-posted</div><div class="v ok" id=m-post>—</div>
      <div class=s id=s-post>—</div><div class=mt><i id=b-post style="background:var(--ok)"></i></div></div>
    <div class=kpi><div class=k id=k-held>held for review</div><div class="v warn" id=m-held>—</div>
      <div class=s id=s-held>—</div><div class=mt><i id=b-held style="background:var(--warn)"></i></div></div>
    <div class=kpi><div class=k>false proofs</div><div class=v id=m-wrong>—</div>
      <div class=s id=s-wrong>—</div><div class=mt><i id=b-wrong style="background:var(--dim2)"></i></div></div>
  </div>

  <div id=panes>
    <div id=left>
      <div class=lh><input id=filter placeholder="filter settlements…" autocomplete=off>
        <span class=ct id=count></span></div>
      <div class=tabs id=tabs>
        <b data-v="" class=on>All</b><b data-v=PROVEN>Proven</b>
        <b data-v=AMBIGUOUS>Ambiguous</b><b data-v=CONTRADICTED>Contradicted</b>
      </div>
      <div id=ledger><div class=empty>press Run</div></div>
    </div>
    <div id=right><div class=empty>select a settlement</div></div>
  </div>

  <div id=bar>
    <span><kbd>j</kbd><kbd>k</kbd> move</span><span><kbd>/</kbd> filter</span>
    <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> verdict</span><span><kbd>0</kbd> all</span>
    <span class=sp></span><span id=barmeta></span>
  </div>
</div>
<script src=guard.js></script>
<script src=widgets.js></script>
<script src=board-widgets.js></script>
<script src=app.js></script>
</body></html>
