<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>ATTEST — the investigation</title>
<link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel=stylesheet>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   ATTEST — THE INVESTIGATION

   Rebuilt against the reference's DARK rendering. The last pass measured its
   light theme — the page carries an APPEARANCE control in its own footer and
   headless Chromium had picked LIGHT — so the ground, the accents and the
   whole feel were measured off the wrong half of the site.

   Measured with color_scheme=dark:
     canvas       rgb(14,14,14)
     surface      rgb(17,17,17)
     primary      #fff
     secondary    rgba(255,255,255,.68)
     tertiary     rgba(255,255,255,.42)
     coral        rgb(255,101,90)   — 45 uses: eyebrows, current nav, refusals
     lime         rgb(231,245,61)   — actions only
     warm         ≈#2b1817          — the chapter that changes state

   THE GRAMMAR, taken; the content and identity, ATTEST's own:
     · fixed narrow left nav — wordmark, grouped links, one in the accent,
       a bordered utility block pinned to the floor
     · a mono utility strip along the top carrying provenance
     · an editorial column of about 580px: coral eyebrow, white statement,
       coral sub-statement, grey body
     · a large ARTIFACT to its right, framed with corner registration marks
     · a full-width action bar in the action colour, with an ↗
     · faint enormous circle and diagonal traces on the near-black
     · bordered specimen blocks, radius 0, mono status rows with ✓ and ✗

   COLOUR DISCIPLINE — the reason the reference works. Coral is unresolved,
   risk, refusal. Lime is only ever an action you can take. Grey is
   infrastructure. White is a stated truth. Nothing else is coloured, and
   neither accent is ever used decoratively.

   Every figure is fetched from the running engine at load. The scoreboard's
   false-proof rates come from benchmark/baselines.json through the API, so
   the correctness argument on this page is the artifact's, not a template's.
   ═════════════════════════════════════════════════════════════════════════ */
:root{
  --canvas:#0e0e0e;
  --sur:#141414;
  --sur2:#191919;
  --warm:#2b1817;          /* the chapter where the system stops */
  --paper:#f0ede6;
  --ink:#ffffff;
  --dim:rgba(255,255,255,.68);
  --dim2:rgba(255,255,255,.46);
  --dim3:rgba(255,255,255,.30);
  --rule:rgba(255,255,255,.10);
  --rule2:rgba(255,255,255,.20);
  --coral:#ff655a;         /* unresolved · risk · refusal */
  --lime:#dcf23c;          /* action, and nothing else */
  --proven:#5fbf9b;

  --s:"Space Grotesk",ui-sans-serif,-apple-system,system-ui,sans-serif;
  --m:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  /* leading = size, tracking ≈ −.045em on display */
  --t-hero:clamp(30px,3.1vw,46px);
  --t-chapter:clamp(28px,3.2vw,44px);
  --t-huge:clamp(44px,7.4vw,116px);
  --t-sect:clamp(21px,1.9vw,28px);
  --t-body:clamp(15px,1.05vw,17px);
  --t-small:13px;
  --t-micro:11px;
  --t-nano:9px;

  --nav:196px;
  --gut:clamp(18px,2.6vw,42px);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;background:var(--canvas)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--canvas);color:var(--ink);font-family:var(--s);
  font-size:var(--t-body);line-height:1.55;-webkit-font-smoothing:antialiased;
  overflow-x:hidden}
a{color:inherit}

/* ── the field ───────────────────────────────────────────────────────────
   An engineering drawing on black paper: a 44px graphite grid that is only
   visible if you look for it, two enormous circle traces and two long
   diagonals. No glow, no gradient blob, no noise texture. */
#field{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size:44px 44px}
/* The traces that were here — two circles and two diagonals — represented
   nothing. Every other shape on this page names a job: a bar is a quantity, a
   dot is a settlement, a diamond proposes, a ring tests, a disc decides, a
   dashed rule is a capability limit. Those four were the only marks that could
   not answer "what does this represent", so they are gone rather than
   restyled. The graphite field stays: it is the ground the objects are
   measured on. */

/* ── the standing nav ────────────────────────────────────────────────────
   Left, fixed, quiet. Grouped like a contents page, not a menu bar. It never
   competes: 9px group labels, 13px links, and the held one carries the accent.

   (This block and the strip below were deleted by accident when the decorative
   traces were removed — the cut ran from the traces' first rule to `main{`,
   and both of these sat between them. Overflow and console checks both stayed
   green; only the screenshot showed the navigation had stopped being fixed.) */
#nav{position:fixed;left:0;top:0;bottom:0;width:var(--nav);z-index:6;
  padding:24px 0 22px 24px;display:flex;flex-direction:column;
  background:var(--canvas);border-right:1px solid var(--rule);
  overflow-y:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav .wm{font-family:var(--m);font-weight:700;letter-spacing:.26em;
  font-size:13px;margin-bottom:30px}
#nav .grp{font-family:var(--m);font-size:var(--t-nano);letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim3);margin:22px 0 9px;
  padding-top:16px;border-top:1px solid var(--rule);margin-right:24px}
#nav .grp:first-of-type{border-top:0;padding-top:0;margin-top:0}
#nav a{display:flex;gap:9px;text-decoration:none;color:var(--dim);
  font-size:var(--t-small);padding:4px 0;transition:color .16s}
#nav a:hover{color:var(--ink)}
#nav a.on{color:var(--coral)}
#nav a .k{font-family:var(--m);font-size:var(--t-nano);color:var(--dim3)}
#nav a.on .k{color:var(--coral)}
#nav .sys{font-family:var(--m);font-size:var(--t-nano);letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim2);line-height:2}
#nav .sp{flex:1;min-height:16px}
/* the way in, in the corner the reference keeps its shortcuts panel — ATTEST
   has no shortcuts, and an affordance that leads nowhere is worse than none */
#nav .enter{display:flex;justify-content:space-between;gap:8px;
  border:1px solid var(--lime);color:var(--lime);margin-right:24px;flex:none;
  font-family:var(--m);font-size:var(--t-micro);letter-spacing:.14em;
  text-transform:uppercase;text-decoration:none;padding:11px 12px;
  transition:background .18s,color .18s}
#nav .enter:hover{background:var(--lime);color:var(--canvas)}
#nav .enter i{font-style:normal}

/* ── the strip ───────────────────────────────────────────────────────────
   What produced the page, in the machine's own voice, pinned above it. */
#strip{position:fixed;top:0;left:var(--nav);right:0;z-index:7;
  background:var(--sur);border-bottom:1px solid var(--rule);
  font-family:var(--m);font-size:var(--t-micro);letter-spacing:.06em;
  padding:0 var(--gut);height:38px;display:flex;gap:0;align-items:stretch;
  white-space:nowrap;overflow:hidden;color:var(--dim)}
#strip span{display:flex;align-items:center;padding:0 16px;
  border-left:1px solid var(--rule)}
#strip span:first-child{padding-left:0;border-left:0;color:var(--ink)}
#strip b{font-weight:400;color:var(--ink)}
#strip .sp{flex:1;border-left:0;padding:0}

main{position:relative;z-index:1;margin-left:var(--nav);padding-top:38px}

/* ── rows ────────────────────────────────────────────────────────────── */
section{padding:clamp(64px,10vh,132px) var(--gut);position:relative}
.row{display:grid;grid-template-columns:var(--mk,150px) minmax(0,var(--st,1fr))
  minmax(0,var(--as,.8fr));gap:clamp(18px,2.6vw,44px);align-items:start}
/* A grid item's automatic minimum is its content, so a long unbroken headline
   pushes its own track wider than the fraction it was given and prints over
   the artifact beside it. Every column here is allowed to be narrower than
   its contents; the type sizes are what keep it readable. */
.row > *{min-width:0}
/* The hero declares its own tracks rather than going through the row's
   variables: with only the artifact carrying a floor, the statement column
   had none and shrank to 185px while the artifact kept 300. Both need one,
   and the statement's is the larger. */
.hero-row{grid-template-columns:132px minmax(360px,1.25fr) minmax(320px,.85fr)}
@media (max-width:1240px){
  .hero-row{grid-template-columns:112px minmax(0,1fr)}
  .hero-row > *:last-child{grid-column:1/-1;margin-top:26px;max-width:520px}
}
.mk{font-family:var(--m);font-size:var(--t-micro);letter-spacing:.16em;
  text-transform:uppercase;color:var(--coral);line-height:1.55;padding-top:.45em}
.mk b{display:block;font-weight:700}
.mk em{display:block;font-style:normal;color:var(--dim3);margin-top:4px}
h1,h2,h3{font-weight:500;letter-spacing:-.045em;line-height:1}
.hero-t{font-size:var(--t-hero);max-width:16ch;text-wrap:balance;
  overflow-wrap:break-word}
.chapter{font-size:var(--t-chapter);max-width:17ch;text-wrap:balance}
.sub{font-size:clamp(16px,1.35vw,20px);color:var(--coral);letter-spacing:-.02em;
  line-height:1.25;max-width:34ch;font-weight:500;margin-top:18px}
.say{font-size:var(--t-body);color:var(--dim);max-width:44ch;line-height:1.6}
.say + .say{margin-top:.85em}
.say b{color:var(--ink);font-weight:500}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--m);font-size:var(--t-micro);letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim2)}
hr.rule{border:0;border-top:1px solid var(--rule);margin:clamp(20px,3vh,34px) 0}

/* ── the action colour, used only for actions ───────────────────────── */
.act-line{display:inline-flex;align-items:center;gap:10px;
  font-family:var(--m);font-size:var(--t-micro);letter-spacing:.16em;
  text-transform:uppercase;text-decoration:none;color:var(--lime);
  border-bottom:1px solid var(--lime);padding-bottom:5px;
  transition:gap .2s}
.act-line:hover{gap:18px}

.rise{opacity:0;transform:translateY(14px);
  transition:opacity .55s cubic-bezier(.16,1,.3,1),
             transform .55s cubic-bezier(.16,1,.3,1)}
.rise.in{opacity:1;transform:none}
.rise.d1{transition-delay:.06s} .rise.d2{transition-delay:.12s}
.rise.d3{transition-delay:.18s} .rise.d4{transition-delay:.24s}
@media (prefers-reduced-motion:reduce){.rise{opacity:1;transform:none;transition:none}}
</style>
<style>
/* ── THE SPECIMEN ────────────────────────────────────────────────────────
   The hero object. Not a card: a document. It is framed by four corner
   registration marks rather than a border, punched down its left edge the way
   a filed record is, and every field on it is a real value from the run.

   The rule against skeuomorphism holds — there is no paper texture, no bevel,
   no drop shadow pretending to be light. What makes it read as an object is
   that its internal grammar is a form's: labelled fields on a fixed measure,
   a stamped state, a punched edge, and a serial along the foot. */
.spec{position:relative;background:var(--sur);padding:34px 30px 30px 46px;
  border:1px solid var(--rule)}
.spec::before,.spec::after{content:"";position:absolute;width:11px;height:11px;
  border:1px solid var(--coral);pointer-events:none}
.spec::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.spec::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.spec-c{position:absolute;width:11px;height:11px;border:1px solid var(--coral);
  pointer-events:none}
.spec-c.tr{right:-1px;top:-1px;border-left:0;border-bottom:0}
.spec-c.bl{left:-1px;bottom:-1px;border-right:0;border-top:0}
/* the punched edge */
.spec-punch{position:absolute;left:17px;top:30px;bottom:30px;width:6px;
  background-image:radial-gradient(circle,rgba(255,255,255,.16) 2.4px,transparent 2.5px);
  background-size:6px 26px}
.spec-h{display:flex;align-items:baseline;justify-content:space-between;
  gap:14px;padding-bottom:14px;border-bottom:1px solid var(--rule2)}
.spec-h b{font-family:var(--m);letter-spacing:.24em;font-size:12px;font-weight:700}
.spec-h span{font-family:var(--m);font-size:var(--t-nano);letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim2)}
.spec-f{display:grid;grid-template-columns:96px minmax(0,1fr);
  gap:0 16px;align-items:baseline;padding:13px 0;
  border-bottom:1px solid var(--rule)}
.spec-f i{font-style:normal;font-family:var(--m);font-size:var(--t-nano);
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim2)}
.spec-f b{font-family:var(--m);font-weight:400;font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;font-size:clamp(15px,1.5vw,20px);text-align:right;
  justify-self:end}
.spec-f.hot b{color:var(--coral)}
.spec-f.big b{font-size:clamp(19px,2.1vw,29px)}
/* the stamp */
.spec-stamp{margin-top:16px;display:inline-block;border:1px solid var(--coral);
  color:var(--coral);font-family:var(--m);font-size:var(--t-micro);
  letter-spacing:.2em;padding:7px 11px;text-transform:uppercase}
/* ── the pipeline, on the specimen ──────────────────────────────────────
   The whole system, printed on the object a judge sees before scrolling:
   evidence goes in, the model proposes, the solver tests, the engine decides.
   Four marks, each a different shape, because the roles are different: a bar
   is an input, a diamond proposes, a ring tests, a filled disc decides. */
.spec-pipe{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
.spec-pipe .lbl{display:block;margin-bottom:10px;font-size:var(--t-nano)}
.spec-pipe-r{display:grid;grid-template-columns:16px 62px minmax(0,1fr);
  gap:9px;align-items:center;padding:4px 0;position:relative}
.spec-pipe-r i{justify-self:center;width:9px;height:9px;font-style:normal;
  position:relative;z-index:1;background:var(--sur)}
.spec-pipe-r i.e{width:11px;height:2px;background:var(--dim2)}
.spec-pipe-r i.m{border:1.5px solid var(--dim);transform:rotate(45deg)}
.spec-pipe-r i.s{border:1.5px solid var(--dim);border-radius:999px}
.spec-pipe-r i.g{background:var(--ink);border-radius:999px}
/* the connector runs between the marks, not through them */
.spec-pipe-r:not(:last-child)::before{content:"";position:absolute;left:7.5px;
  top:calc(50% + 6px);height:calc(100% - 12px);width:1px;background:var(--rule2)}
.spec-pipe-r b{font-family:var(--m);font-size:var(--t-nano);letter-spacing:.16em;
  text-transform:uppercase;font-weight:400}
.spec-pipe-r em{font-style:normal;font-size:var(--t-nano);color:var(--dim2);
  letter-spacing:.04em}
.spec-note{margin-top:10px;font-family:var(--m);font-size:var(--t-nano);
  letter-spacing:.12em;text-transform:uppercase;color:var(--dim2)}
.spec-foot{display:flex;justify-content:space-between;gap:12px;margin-top:18px;
  padding-top:12px;border-top:1px solid var(--rule);
  font-family:var(--m);font-size:var(--t-nano);letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim3)}

/* ── THE SCOREBOARD ──────────────────────────────────────────────────────
   The horizontal information strip. This is where the page stops being a
   description and becomes evidence: the run's four verdicts, then the same
   measurement run against three other methods, from the artifact. */
.score{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  border-top:1px solid var(--rule2);border-bottom:1px solid var(--rule)}
.score-c{padding:18px 20px 20px;border-left:1px solid var(--rule)}
.score-c:first-child{border-left:0;padding-left:0}
.score-c b{display:block;font-family:var(--m);font-weight:400;
  font-variant-numeric:tabular-nums;font-size:clamp(24px,2.7vw,40px);
  letter-spacing:-.05em;line-height:1}
.score-c span{display:block;font-family:var(--m);font-size:var(--t-nano);
  letter-spacing:.18em;text-transform:uppercase;color:var(--dim2);margin-top:8px}
.score-c.a b{color:var(--coral)} .score-c.p b{color:var(--proven)}
.bench{margin-top:26px}
.bench-r{display:grid;grid-template-columns:96px minmax(0,1fr) 80px minmax(0,1fr) 58px 92px;
  gap:0 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.bench-r > *{min-width:0}
.bench-r i{font-style:normal;letter-spacing:.1em;text-transform:uppercase;
  font-family:var(--m);font-size:var(--t-nano);color:var(--dim2)}
.bench-r.me i{color:var(--ink)}
.bench-t{height:5px;background:rgba(255,255,255,.07);position:relative}
.bench-t u.q{position:absolute;top:0;bottom:0;left:0;width:100%;
  transform-origin:left;transform:scaleX(var(--w,0));background:var(--coral);
  transition:transform .7s cubic-bezier(.2,.7,.3,1)}
.bench-t u.q.cov{background:var(--dim2)}
.bench-r.me .bench-t u.q.cov{background:var(--ink)}
.rise:not(.in) .bench-t u.q{transform:scaleX(0)}
@media (prefers-reduced-motion:reduce){.bench-t u.q{transition:none}}
.bench-r b{font-weight:400;font-variant-numeric:tabular-nums;text-align:right;
  font-family:var(--m);font-size:var(--t-micro);color:var(--dim)}
.bench-r em{font-style:normal;color:var(--dim2);font-size:var(--t-nano);
  text-align:right;font-family:var(--m);font-variant-numeric:tabular-nums}
/* correct = decided − wrong. Both fields are published in the artifact; the
   subtraction is the comparison's whole point and is not a new metric. */
.bench-r em.bench-ok{font-size:clamp(15px,1.5vw,21px);color:var(--ink);
  letter-spacing:-.02em}
.bench-r.me em.bench-ok{color:var(--proven);font-weight:700}
.bench-r.me em,.bench-r.me b{color:var(--ink)}
.bench-h{display:grid;grid-template-columns:96px minmax(0,1fr) 80px minmax(0,1fr) 58px 92px;
  gap:0 12px;padding-bottom:7px;border-bottom:1px solid var(--rule2);
  font-family:var(--m);font-size:var(--t-nano);letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim3)}
.bench-h span:nth-child(3),.bench-h span:nth-child(5),
.bench-h span:nth-child(6){text-align:right}

/* ── the population field ────────────────────────────────────────────── */
.stage{position:relative;width:100%;min-height:clamp(200px,32vh,340px);
  padding-bottom:58px}
.stage canvas{position:absolute;inset:0 0 58px 0;display:block;
  width:100%;height:calc(100% - 58px)}
.stage.tall{min-height:clamp(260px,46vh,470px)}

/* ── the collapse ────────────────────────────────────────────────────── */
.fall-r{display:grid;grid-template-columns:minmax(0,1fr) auto;
  gap:7px clamp(14px,2vw,30px);align-items:baseline;
  padding:clamp(11px,1.8vh,20px) 0;border-top:1px solid var(--rule)}
.fall-r:first-child{border-top:0}
.fall-v{font-family:var(--m);font-variant-numeric:tabular-nums;
  letter-spacing:-.045em;text-align:right;white-space:nowrap;
  font-size:clamp(15px,1.6vw,21px)}
.fall-m{grid-column:1/3;height:clamp(5px,.8vh,8px);background:var(--dim3);
  transform-origin:left;transform:scaleX(var(--w,1));
  transition:transform 1.05s cubic-bezier(.16,1,.3,1)}
.rise:not(.in) .fall-m{transform:scaleX(0)}
.fall-r.stop .fall-m{background:var(--coral)}
.fall-x{grid-column:1/3;display:flex;flex-wrap:wrap;align-items:baseline;
  gap:5px 12px;padding-top:5px}
.fall-x b{font-family:var(--m);font-variant-numeric:tabular-nums;font-weight:400;
  font-size:clamp(20px,2.4vw,36px);letter-spacing:-.05em;color:var(--coral)}
.fall-x span{color:var(--dim2);font-size:var(--t-small);max-width:46ch}

/* ── the reduction ───────────────────────────────────────────────────── */
.red-n{display:flex;align-items:baseline;gap:clamp(11px,1.8vw,24px);
  flex-wrap:wrap;padding:clamp(7px,1.2vh,14px) 0}
.red-n b{font-family:var(--m);font-weight:400;font-variant-numeric:tabular-nums;
  letter-spacing:-.055em;line-height:.92;font-size:clamp(32px,4.8vw,78px)}
.red-n.end b{color:var(--coral)}
.red-c{display:grid;grid-template-columns:auto minmax(0,1fr);
  gap:4px clamp(11px,1.8vw,24px);align-items:baseline;
  padding:clamp(8px,1.3vh,14px) 0 clamp(8px,1.3vh,14px) clamp(13px,2vw,30px);
  margin-left:clamp(5px,1vw,14px);border-left:1px solid var(--rule2)}
.red-c b{font-family:var(--m);font-weight:400;font-variant-numeric:tabular-nums;
  font-size:var(--t-small);color:var(--dim)}
.red-c i{font-style:normal;font-family:var(--m);font-size:var(--t-nano);
  letter-spacing:.16em;text-transform:uppercase}
.red-c.conv i{color:var(--coral)} .red-c.det i{color:var(--proven)}
.red-c p{grid-column:2;color:var(--dim2);font-size:var(--t-small);max-width:60ch}

/* ── the three actors ────────────────────────────────────────────────── */

/* ── the threshold ───────────────────────────────────────────────────── */
.thr-h{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:clamp(14px,2.2vw,36px);margin-bottom:clamp(16px,2.4vh,28px)}
.thr-h b{display:block;font-family:var(--m);font-weight:400;
  font-variant-numeric:tabular-nums;font-size:clamp(22px,2.9vw,42px);
  letter-spacing:-.05em;line-height:1}
.thr-h.none b{color:var(--coral);letter-spacing:0}
.thr-s{position:relative;height:clamp(26px,3.6vh,40px);
  background:rgba(255,255,255,.05);border:1px solid var(--rule)}
.thr-line{position:absolute;top:-6px;bottom:-6px;width:1px;background:var(--ink)}
.thr-mark{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;
  border-radius:999px;background:var(--proven);box-shadow:0 0 0 4px var(--canvas)}
.thr-z{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--m);
  font-size:var(--t-nano);letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim2)}
.thr-r{margin-top:clamp(14px,2.2vh,26px);font-size:var(--t-body);
  color:var(--dim);max-width:52ch}
.thr-r b{font-family:var(--m);color:var(--ink);font-weight:400;
  font-variant-numeric:tabular-nums;letter-spacing:-.04em}

/* ── the ledger sheet ────────────────────────────────────────────────── */
.sheet{background:var(--sur);border:1px solid var(--rule);position:relative;
  padding:clamp(30px,4.6vh,58px) clamp(30px,4vw,58px)}
.sheet::before,.sheet::after{content:"";position:absolute;top:20px;bottom:20px;
  width:5px;background-image:radial-gradient(circle,rgba(255,255,255,.14) 2px,transparent 2.1px);
  background-size:5px 20px}
.sheet::before{left:13px} .sheet::after{right:13px}
.book-t{display:grid;grid-template-columns:auto minmax(0,150px);
  gap:7px clamp(18px,2.6vw,40px);align-items:baseline;
  margin-top:clamp(16px,2.4vh,28px)}
.book-t i{font-style:normal;font-family:var(--m);font-size:var(--t-micro);
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim2)}
.book-t b{font-family:var(--m);font-weight:400;font-variant-numeric:tabular-nums;
  font-size:clamp(15px,1.6vw,21px);text-align:right;color:var(--dim)}
.book-t i.net,.book-t b.net{border-top:1px solid var(--ink);padding-top:8px;
  margin-top:5px;color:var(--ink)}
.stamp{margin-top:clamp(20px,3vh,36px);font-family:var(--m);
  font-size:clamp(18px,2.6vw,36px);letter-spacing:-.045em;line-height:1.06;
  text-transform:uppercase;font-weight:700;color:var(--coral);max-width:12ch}

/* ── the causal trace ────────────────────────────────────────────────── */
.chain-e{display:grid;grid-template-columns:92px minmax(0,1fr);
  gap:clamp(10px,1.6vw,22px);padding:clamp(9px,1.5vh,16px) 0;
  border-top:1px solid var(--rule)}
.chain-e:first-child{border-top:0}
.chain-e i{font-style:normal;font-family:var(--m);font-size:var(--t-micro);
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim2)}
.chain-e.engine i{color:var(--ink)}
.chain-e span{color:var(--dim);font-size:var(--t-small)}
.chain-b{grid-column:2;color:var(--dim3);font-size:var(--t-small);padding-top:3px}
.chain-b::before{content:"↳ ";color:var(--coral)}

/* ── trust ───────────────────────────────────────────────────────────── */
.refuse-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) auto;
  gap:5px clamp(14px,2.2vw,36px);align-items:baseline;
  padding:clamp(10px,1.6vh,18px) 0;border-top:1px solid var(--rule)}
.refuse-r b{font-weight:500}
.refuse-r span{color:var(--dim2);font-size:var(--t-small)}
.refuse-r i{font-style:normal;font-family:var(--m);font-size:var(--t-nano);
  letter-spacing:.16em;text-transform:uppercase;color:var(--coral);
  justify-self:end;white-space:nowrap}

/* ── the warm room, and the ending on paper ──────────────────────────── */
.warm{background:var(--warm);padding:clamp(74px,14vh,180px) var(--gut);
  position:relative;z-index:1}
.warm .mk{color:#f0a08f}
.warm .say{color:rgba(255,255,255,.7)}
.warm .say b{color:#fff}
.warm .lbl{color:rgba(255,255,255,.5)}
.warm .chapter{font-size:clamp(30px,5vw,72px);max-width:13ch}
.warm-figs{display:flex;flex-wrap:wrap;gap:clamp(20px,4vw,66px);
  margin-top:clamp(30px,5.4vh,66px);align-items:baseline}
.warm-figs b{font-family:var(--m);font-weight:400;font-variant-numeric:tabular-nums;
  letter-spacing:-.05em;font-size:clamp(24px,3.2vw,46px);color:#fff}
.warm-figs .u{display:flex;flex-direction:column;gap:6px}
.ask{margin-top:clamp(34px,6vh,80px);font-family:var(--m);
  font-size:clamp(14px,1.5vw,20px);letter-spacing:.06em;color:#fff;
  border-top:1px solid rgba(255,255,255,.28);padding-top:clamp(16px,2.6vh,28px);
  max-width:34ch}
#end{background:var(--paper);color:#12130f;
  padding:clamp(70px,13vh,180px) var(--gut) clamp(50px,9vh,120px)}
#end .ghost{font-family:var(--m);font-size:clamp(26px,6.4vw,100px);
  letter-spacing:-.05em;line-height:1.04;color:transparent;
  -webkit-text-stroke:1px rgba(18,19,15,.26);max-width:11ch;font-weight:700}
#end .foot{margin-top:clamp(34px,6vh,80px);display:flex;flex-wrap:wrap;
  gap:14px clamp(22px,3.6vw,58px);align-items:baseline;
  border-top:1px solid rgba(18,19,15,.15);padding-top:clamp(16px,2.6vh,28px)}
#end .foot p{color:#55564e;font-size:var(--t-small);max-width:54ch}
#end .act-line{color:#12130f;border-color:#12130f}
/* ── the handoff ─────────────────────────────────────────────────────────
   §38.P0-3. The refusal used to end the page. "We stop here" and "we hand the
   work to whoever can finish it" are different products; only the second is
   finished. Lime because it is an action, which is the only thing lime is
   ever used for. */
.hand{margin-top:clamp(26px,4.4vh,52px);border-top:1px solid rgba(255,255,255,.28);
  padding-top:clamp(16px,2.6vh,28px)}
.hand-f{display:flex;flex-wrap:wrap;gap:14px clamp(20px,4vw,60px);
  margin-top:clamp(14px,2.2vh,22px);align-items:baseline}
.hand-f .u{display:flex;flex-direction:column;gap:6px}
.hand-f b{font-family:var(--m);font-weight:400;font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;font-size:clamp(20px,2.4vw,34px);color:#fff}
.hand-f .u:last-child b{font-size:clamp(14px,1.4vw,19px);letter-spacing:.04em;
  text-transform:uppercase;color:var(--coral)}
.hand-p{margin-top:clamp(16px,2.4vh,26px);max-width:52ch;color:rgba(255,255,255,.72);
  font-size:var(--t-body);line-height:1.6}
.hand-p b{color:#fff;font-weight:500}
.hand-a{margin-top:clamp(16px,2.4vh,26px)}
.hand-n{display:block;margin-top:12px;font-family:var(--m);
  font-size:var(--t-nano);letter-spacing:.13em;text-transform:uppercase;
  color:rgba(255,255,255,.44)}

.err{font-family:var(--m);color:var(--coral);border:1px solid var(--coral);
  padding:20px;max-width:56ch;font-size:var(--t-small)}

@media (max-width:1000px){
  :root{--nav:0px}
  #nav{position:static;width:auto;flex-direction:row;align-items:center;gap:12px;
    padding:10px var(--gut);border-right:0;border-bottom:1px solid var(--rule);
    overflow-x:auto;scrollbar-width:none}
  #nav::-webkit-scrollbar{display:none}
  #nav .grp,#nav .sp,#nav .sys{display:none}
  /* #index is the vertical rail on desktop and was left as a block here, so
     the seven instruments stacked into a 96px column inside a row-direction
     nav and pushed the action off the right edge. It scrolls, so no overflow
     check saw it; only the phone screenshot did. */
  #nav #index{display:flex;flex-direction:row;align-items:center;
    gap:0 16px;flex:0 0 auto}
  #nav #index a{white-space:nowrap}
  #nav .enter{margin:0;padding:8px 10px;flex:0 0 auto;white-space:nowrap}
  #nav .wm{margin:0 8px 0 0}
  #nav a{white-space:nowrap;padding:2px 0}
  /* `flex-wrap:wrap` never got the chance to wrap: the provenance span is one
     unbreakable mono line, so at 390px the strip held 434px of content behind
     `overflow:hidden` and the run id was silently cut off. Nothing on this page
     may hide a figure it claims to publish. */
  #strip{position:static;left:0;height:auto;padding:8px var(--gut);
    flex-wrap:wrap;gap:6px 0;overflow-x:auto;scrollbar-width:none}
  #strip::-webkit-scrollbar{display:none}
  #strip span{padding:0 10px}
  main{margin-left:0;padding-top:0}
  .row{grid-template-columns:minmax(0,1fr);gap:12px}
  .mk{padding-top:0}
  .hero-t,.chapter,.say,.sub{max-width:none}
  .score{grid-template-columns:repeat(2,minmax(0,1fr))}
  .score-c{padding:14px 14px 16px;border-left:1px solid var(--rule);
    border-top:1px solid var(--rule)}
  .score-c:nth-child(odd){padding-left:0;border-left:0}
  .bench-r,.bench-h{grid-template-columns:74px minmax(0,1fr) minmax(0,1fr) 58px;
    gap:0 9px}
  .bench-r b,.bench-h span:nth-child(3),.bench-h span:nth-child(5){display:none}
  .refuse-r{grid-template-columns:minmax(0,1fr);gap:4px}
  .refuse-r i{justify-self:start}
  .chain-e{grid-template-columns:minmax(0,1fr)}
  .chain-b,.chain-e span{grid-column:1}
  .sheet::before,.sheet::after{display:none}
  .book-t{grid-template-columns:auto minmax(0,1fr)}
}

/* ── THE SYSTEM BOUNDARY ─────────────────────────────────────────────────
   Not a timeline. A timeline says "then, then, then"; this has to say that
   four different KINDS of thing are happening, and that only one of them is
   allowed to decide.

   The role is carried by the mark, and each mark is a different shape:
     ─  evidence   an input, so it is a bar
     ◇  model      proposes, so it is open and turned
     ○  solver     tests, so it is a ring — a thing you pass through
     ●  engine     decides, so it is solid and filled

   The left column names the VERB rather than the actor, because "proposes /
   tests / decides" is the sentence a reader needs and "model / solver /
   engine" is the one they already saw. */

/* ── THE COUNTERFACTUAL ──────────────────────────────────────────────────
   The boundary, demonstrated instead of asserted: what the loop concluded,
   beside what the engine kept, beside whether anything moved. */
.cf-c b{display:block;font-family:var(--m);font-weight:400;
  font-size:clamp(19px,2.4vw,34px);letter-spacing:-.04em;line-height:1;
  margin:9px 0 7px}
.cf-c em{font-style:normal;font-family:var(--m);font-size:var(--t-nano);
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim3)}

/* ── THE SAFE STOP ───────────────────────────────────────────────────────
   Four statements down a rule, each one a consequence of the one above it.
   The last is coral, which in this product means unresolved — not error. */
.safe{margin-top:clamp(30px,5vh,62px);padding-left:clamp(16px,2.6vw,34px);
  border-left:2px solid var(--rule2)}
.safe-s{font-family:var(--m);font-size:clamp(15px,1.7vw,24px);
  letter-spacing:-.02em;text-transform:uppercase;padding:clamp(5px,.9vh,9px) 0;
  color:var(--dim)}
.safe-s.hot{color:var(--coral);font-weight:700}
.safe-n{margin-top:clamp(14px,2.2vh,24px);color:var(--dim2);
  font-size:var(--t-small);max-width:56ch}
.safe-n b{color:var(--ink)}

@media (max-width:1000px){
}

/* ── THE ADAPTER BOUNDARY ────────────────────────────────────────────────
   Three stations and the line between them, so "the engine does not know
   Razorpay exists" is a diagram a reader can check rather than a sentence
   they have to take. The middle station is the boundary itself. */
.adapter{margin-top:clamp(8px,1.4vh,16px)}
.ad-r{display:grid;grid-template-columns:190px minmax(0,1fr);
  gap:clamp(12px,2vw,26px);align-items:baseline;padding:clamp(9px,1.5vh,16px) 0}
.ad-r b{font-family:var(--m);font-size:var(--t-micro);letter-spacing:.18em;
  text-transform:uppercase;font-weight:400;color:var(--dim)}
.ad-r.eng b{color:var(--ink);font-weight:700}
.ad-r span{color:var(--dim2);font-size:var(--t-small)}
.ad-r em{font-style:normal;font-family:var(--m);color:var(--ink)}
.ad-b{font-family:var(--m);font-size:var(--t-nano);letter-spacing:.2em;
  text-transform:uppercase;color:var(--coral);padding:2px 0 2px 0;
  border-top:1px dashed rgba(255,101,90,.4);width:190px}
@media (max-width:1000px){
  .ad-r{grid-template-columns:minmax(0,1fr);gap:4px}
  .ad-b{width:100%}
}

/* ── the run's disposition, on the record ───────────────────────────────
   Three counts and three bars, on the object itself, so the record says it is
   a BATCH before a reader has scrolled anywhere. The bar lengths are the
   shares of the run — 197 dominates because 197 is the operational problem. */
.spec-disp{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.spec-disp .lbl{display:block;margin-bottom:9px;font-size:var(--t-nano)}
.spec-disp-r{display:grid;grid-template-columns:38px 84px minmax(0,1fr);
  gap:10px;align-items:center;padding:3px 0}
.spec-disp-r b{font-family:var(--m);font-weight:400;font-size:var(--t-small);
  font-variant-numeric:tabular-nums;text-align:right}
.spec-disp-r b.p{color:var(--proven)} .spec-disp-r b.a{color:var(--coral)}
.spec-disp-r b.c{color:var(--ink)}
.spec-disp-r i{font-style:normal;font-family:var(--m);font-size:var(--t-nano);
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
.spec-disp-r u{display:block;height:3px;text-decoration:none;
  background:rgba(255,255,255,.10);position:relative}
.spec-disp-r u::after{content:"";position:absolute;top:0;bottom:0;left:0;
  width:calc(var(--w) * 100%);background:currentColor}
.spec-disp-r:nth-child(2) u{color:var(--proven)}
.spec-disp-r:nth-child(3) u{color:var(--coral)}
.spec-disp-r:nth-child(4) u{color:var(--ink)}

/* ── the benchmark's claim ──────────────────────────────────────────────
   The measurement is a table; this is the argument it supports, and without
   it the table reads as a leaderboard ATTEST does not win. */
/* ── the signature frame ─────────────────────────────────────────────────
   §38.P0-1. The three actors, the counterfactual, the measurement and the
   consequence used to be four blocks spread over 1,545px starting at y=5374.
   Every fact was present and none of it was a frame: it could be read, and it
   could not be screenshotted. This composes the same values — no new data —
   into one specimen sheet that fits a viewport.

   Glyphs are the page's existing grammar: ◇ proposes, ○ tests, ● decides.
   The tick row is a population, drawn the way every other population on this
   page is drawn, so 42.9% is seen rather than asserted. */
.sig{border:1px solid var(--rule2);background:var(--sur);position:relative;
  padding:clamp(18px,2.1vw,30px);margin-top:26px}
.sig::before,.sig::after{content:"";position:absolute;width:9px;height:9px;
  border:1px solid var(--coral);pointer-events:none}
.sig::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.sig::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.sig-h{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:11px}
.sig-h i{font-style:normal;font-family:var(--m);font-size:var(--t-nano);
  letter-spacing:.17em;text-transform:uppercase;color:var(--coral)}
.sig-h span{font-family:var(--m);font-size:var(--t-nano);letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim3)}

/* three actor rows */
.sig-r{display:grid;grid-template-columns:26px 104px minmax(0,1fr);
  gap:0 14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--rule)}
.sig-r > *{min-width:0}
.sig-gl{width:11px;height:11px;margin-top:5px;display:block}
.sig-r.model .sig-gl{background:var(--dim2);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}          /* ◇ proposes */
.sig-r.solver .sig-gl{border:1.5px solid var(--dim2);border-radius:50%}  /* ○ tests */
.sig-r.engine .sig-gl{background:var(--ink);border-radius:50%}           /* ● decides */
.sig-a{font-size:15px;font-weight:600;letter-spacing:-.02em;line-height:1.3}
.sig-a em{display:block;font-style:normal;font-family:var(--m);
  font-size:var(--t-nano);letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim3);font-weight:400;margin-top:3px}
.sig-r.engine .sig-a{color:var(--ink)}
.sig-v{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.sig-o{font-family:var(--m);font-size:13px;font-weight:400;color:var(--ink);
  background:var(--sur2);border:1px solid var(--rule);padding:2px 7px;
  letter-spacing:.02em}
.sig-r.solver .sig-o{color:var(--coral);border-color:rgba(255,101,90,.34)}
.sig-w{flex:1 1 200px;color:var(--dim2);font-size:var(--t-small);line-height:1.5}
.sig-w b{color:var(--dim);font-weight:500}

/* the counterfactual pair */
.sig-cf{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);
  gap:0 10px;align-items:center;padding:15px 0;border-bottom:1px solid var(--rule)}
.sig-cf > *{min-width:0}
.cf-c{display:flex;flex-direction:column;gap:4px}
.cf-c .lbl{font-family:var(--m);font-size:var(--t-nano);letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim3)}
.cf-c b{font-size:clamp(19px,1.9vw,26px);font-weight:500;letter-spacing:-.035em;
  color:var(--ink);line-height:1.1}
.cf-c em{font-style:normal;font-family:var(--m);font-size:var(--t-nano);
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim3)}
.sig-op{font-family:var(--m);font-size:19px;color:var(--dim3);text-align:center}

/* the measurement — 63 ticks, 27 filled, a coin flip marked */
.sig-m{padding:15px 0 0}
.sig-mh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sig-mh b{font-family:var(--m);font-size:clamp(20px,2.1vw,29px);font-weight:400;
  color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sig-mh span{font-family:var(--m);font-size:var(--t-nano);letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim2)}
.sig-mh u{text-decoration:none;font-family:var(--m);font-size:var(--t-micro);
  color:var(--coral);letter-spacing:.06em;margin-left:auto}
.sig-ticks{display:flex;gap:2px;margin-top:10px;position:relative;height:19px;
  align-items:stretch}
.sig-tk{flex:1 1 0;min-width:0;background:rgba(255,255,255,.09);display:block}
.sig-tk.hit{background:var(--dim)}
.sig-half{position:absolute;top:-4px;bottom:-4px;left:50%;width:1px;
  background:var(--coral);pointer-events:none}
.sig-half b{position:absolute;top:-13px;left:5px;font-family:var(--m);
  font-size:var(--t-nano);letter-spacing:.11em;text-transform:uppercase;
  color:var(--coral);font-weight:400;white-space:nowrap}
.sig-mn{margin-top:15px;color:var(--dim2);font-size:var(--t-small);
  line-height:1.5;max-width:66ch}
.sig-mn b{color:var(--dim);font-weight:500}

/* the consequence — the largest thing in the section, by contract */
.sig-x{margin-top:clamp(16px,1.9vw,24px);border-top:1px solid rgba(255,101,90,.34);
  padding-top:clamp(13px,1.5vw,18px);display:flex;justify-content:space-between;
  align-items:baseline;gap:12px;flex-wrap:wrap}
.sig-x b{font-size:clamp(32px,4.1vw,58px);font-weight:600;letter-spacing:-.045em;
  color:var(--coral);line-height:1;text-transform:uppercase}
.sig-x span{font-family:var(--m);font-size:var(--t-nano);letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim3);text-align:right}
@media (max-width:720px){
  .sig-r{grid-template-columns:20px minmax(0,1fr);gap:0 10px}
  .sig-r .sig-v{grid-column:1 / -1;margin-top:9px}
  /* all three actors stack the same way: the engine's note is short enough to
     sit beside its value while the other two wrap, which read as a different
     kind of row rather than the same row with less text. */
  .sig-w{flex:1 1 100%}
  .sig-cf{grid-template-columns:minmax(0,1fr);gap:12px}
  .sig-op{text-align:left}
  /* `margin-left:auto` put the ratio hard right, where it landed on top of the
     coin-flip marker's label at 50%. */
  .sig-mh u{margin-left:0;flex:1 1 100%}
  /* the marker's label hangs 13px above the tick row; once the ratio wraps to
     its own full-width line that space is occupied, so the ticks take the gap
     the label needs rather than the label moving somewhere it means less. */
  .sig-ticks{margin-top:26px}
}
.bench-note{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);
  gap:clamp(16px,2.6vw,44px);margin-top:clamp(18px,2.6vh,30px);
  padding-top:clamp(16px,2.4vh,26px);border-top:1px solid var(--rule)}
.bench-claim{font-size:clamp(17px,1.9vw,26px);letter-spacing:-.035em;
  line-height:1.1;font-weight:500;max-width:14ch;margin:0}
@media (max-width:1000px){.bench-note{grid-template-columns:minmax(0,1fr);gap:12px}}

/* ── the lifecycle ──────────────────────────────────────────────────────
   Six stations, quiet, in the nav. The station the reader is standing in is
   lit; the rest are ground. This is the mental model the seven instruments
   share — without it a reader meets seven questions and no reason they belong
   to one another. */
#loop{display:flex;flex-direction:column;gap:0;margin-right:24px}

/* ── §32.B · THE REFUSAL IS THE HERO ─────────────────────────────────────
   The hierarchy was backwards: a 44px section headline, a 34px counterfactual,
   and NO FINANCIAL ACTION — the sentence the product exists for — at 24px. A
   judge scrolling at pace read the headline and passed the claim.

   It leads the section now, at chapter scale, in coral. Everything below it is
   the working: who proposed, who tested, who decided, and what did not change. */

/* ── colour semantics ───────────────────────────────────────────────────
   Both verdicts are the same state. Painting the engine's coral and the
   model's white implied the engine's was worse — coral means unresolved, and
   they are equally unresolved. Coral is spent on the CONSEQUENCE only. */
.cf-c b{color:var(--ink)}
.safe-s.hot{color:var(--coral)}

/* ── §32.C · THE NARROWING ───────────────────────────────────────────────
   Six steps down the marker column, the current one lit. Steps already passed
   keep their figure at reading weight and drop their label; steps still ahead
   are barely there. The reader always knows what the number in front of them
   narrowed from. */
.nrw{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule);

  text-transform:uppercase;opacity:.75}
.nrw-r.past{color:var(--dim2)}

@media (max-width:1000px){
  .nrw{flex-direction:row;flex-wrap:wrap;gap:4px 14px;margin-top:12px;
    padding-top:10px}

/* ── the two populations, said where they are compared ──────────────────
   "84 / 500" printed directly under a live run of 250 reads as a
   contradiction, and a judge who spots it stops trusting every other figure

<script>
'use strict';
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async p => { const r = await fetch(p);
  if (!r.ok) throw new Error(`${p} → ${r.status}`); return r.json(); };
const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
const CASE = 'setl_000225';
const cap = s => esc(String(s ?? '').trim().replace(/[.\s]+$/, ''))
  .replace(/^./, c => c.toUpperCase());

const SECTIONS = [
  ['open','control'], ['money','evidence'], ['population','investigate'],
  ['exception','policy'], ['proof','journal'], ['ai','activity'],
  ['decision','trust'],
];
/* The seven instruments name the nav, because they are what the product is.
   The sections below map onto them; a reader who clicks EVIDENCE lands on the
   part of the story that instrument answers. */
/* The product is one loop, and the seven instruments are seven points on it.
   The engine may stop early — that is the product, not a failure — so ABSTAIN
   is a station rather than an error branch. */
const LOOP = [
  ['ingest','ingest'], ['reconcile','reconcile'], ['prove','prove'],
  ['decide','decide'], ['act','act'], ['audit','audit'],
];
/* which stage of the loop each section is standing in */
const STAGE = {
  open:'ingest', money:'reconcile', population:'prove', exception:'prove',
  proof:'prove', ai:'prove', proofs:'prove', decision:'decide', books:'act',
  activity:'audit', trust:'audit', boundary:'audit',
};
const NAV = [
  ['open','01','CONTROL'], ['money','02','EVIDENCE'], ['proof','03','INVESTIGATE'],
  ['decision','04','POLICY'], ['books','05','JOURNAL'], ['activity','06','ACTIVITY'],
  ['trust','07','TRUST'],
];

/* ── the population field ────────────────────────────────────────────────
   One point per settlement, coloured by the verdict the engine reached, in
   lanes sized by their own counts. The lone contradicted point sits alone,
   which is the honest picture of a run with one of them in it. */
function Field(host, spec) {
  const cv = document.createElement('canvas'); host.appendChild(cv);
  const cx = cv.getContext('2d');
  let W=0,H=0,pts=[],lanes=[],shown=false,raf=0,t0=0,seed=20260821;
  const rnd=()=>(seed=(seed*1664525+1013904223)%4294967296)/4294967296;
  const TONE={ink:'#ffffff',dim:'rgba(255,255,255,.26)',coral:'#ff655a',
              proven:'#5fbf9b',lit:'#dcf23c'};
  function build(){
    seed=20260821; pts=[];
    const dpr=Math.min(devicePixelRatio||1,2);
    W=host.clientWidth; H=host.clientHeight;
    cv.width=W*dpr; cv.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    const gs=spec.groups, total=gs.reduce((a,g)=>a+g.n,0)||1;
    const gap=Math.min(spec.lane||40, W*.07), gaps=gs.length-1;
    const per=(W-gaps*gap)/total;
    let x0=0;
    lanes=[];
    gs.forEach(g=>{
      const cols=Math.max(1,Math.round(Math.sqrt(g.n*1.7)));
      const rows=Math.ceil(g.n/cols);
      const cell=Math.min((g.n*per)/cols, H/rows, spec.cell||13);
      const top=(H-rows*cell)/2;
      for(let i=0;i<g.n;i++)
        pts.push({x:x0+(i%cols)*cell+cell/2+(rnd()-.5)*1.3,
                  y:top+((i/cols)|0)*cell+cell/2+(rnd()-.5)*1.3,
                  r:g.r||1.9, c:g.tone, d:rnd()});
      // the lane's own rect, so a label can be pinned to the points it names
      lanes.push({g, x:x0, w:cols*cell, y:top, h:rows*cell});
      x0+=cols*cell+gap;
    });
    const shift=Math.max(0,(W-(x0-gap))/2);
    pts.forEach(p=>{p.x+=shift;});
    lanes.forEach(l=>{l.x+=shift;});
    paintLabels();
  }

  /* §32.A — the field carries its own legend.
   *
   * The population rendered as two coloured blocks and a lone dot with the
   * counts three sections away, on the specimen. A reader saw an ornament.
   * Every label here is pinned to the lane it names and reads its count from
   * the same group that drew the points, so the two cannot disagree — change
   * the disposition and the label changes with it.
   *
   * They are DOM, not canvas: a legend that cannot be selected, read by a
   * screen reader, or found by the comprehension audit is not a legend. */
  function paintLabels(){
    if(!spec.groups.some(g=>g.label)) return;
    host.querySelectorAll('.fld-l').forEach(n=>n.remove());
    // one baseline for every label. Lanes are vertically centred and differ in
    // height, so hugging each lane's own bottom edge staggered them and the
    // legend read as three unrelated notes rather than one reading of one
    // population.
    const floor=Math.max(...lanes.map(l=>l.y+l.h))+11;
    for(const l of lanes){
      if(!l.g.label) continue;
      const el=document.createElement('span');
      el.className='fld-l';
      const wide = W > 620;
      el.style.top=`${floor}px`;
      el.style.minWidth=`${Math.max(l.w, 54)}px`;
      el.style.maxWidth=`${Math.max(l.w + (wide ? 120 : 40), 90)}px`;
      // never start a label where it cannot finish
      el.style.left=`${Math.max(0, Math.min(l.x, W - 90))}px`;
      if(!wide) el.style.whiteSpace='normal';
      el.style.color=TONE[l.g.tone]||TONE.dim;
      el.innerHTML=`<b>${l.g.n.toLocaleString()}</b>${esc(l.g.label)}`;
      host.appendChild(el);
    }
  }
  function draw(t){
    cx.clearRect(0,0,W,H);
    for(const p of pts){
      const a=STILL?1:Math.max(0,Math.min(1,(t-p.d*.5)/.45));
      if(a<=0) continue;
      cx.globalAlpha=a; cx.fillStyle=TONE[p.c]||TONE.dim;
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.2832); cx.fill();
    }
    cx.globalAlpha=1;
  }
  function run(ts){ if(!t0) t0=ts; const t=Math.min(1.1,(ts-t0)/850);
    draw(t); if(t<1.1) raf=requestAnimationFrame(run); }
  return {
    show(){ if(shown) return; shown=true; build();
      if(STILL){draw(1.1);return;} t0=0; raf=requestAnimationFrame(run); },
    resize(){ if(!shown) return; build(); draw(1.1); },
  };
}
</script>

<script>
'use strict';
function wire(data){
  const stages=[...document.querySelectorAll('.stage')];
  const fields=[];
  /* Counts and labels come from the same group object that draws the points,
     so the legend cannot drift from the field. Nothing here is written down. */
  if(stages[0]) fields.push([stages[0], Field(stages[0], {cell:15, lane:56,
    groups:[{n:data.counts.PROVEN,       tone:'proven', label:'proven'},
            {n:data.counts.AMBIGUOUS,    tone:'coral',  label:'ambiguous'},
            {n:data.counts.CONTRADICTED, tone:'ink', r:4.5, label:'contradicted'},
            {n:data.counts.INSUFFICIENT, tone:'dim',   label:'insufficient'}]
      .filter(g=>g.n>0)})]);
  if(stages[1]) fields.push([stages[1], Field(stages[1], {cell:6, lane:60,
    groups:[{n:data.space.universe-data.space.candidates, tone:'dim', r:1.3,
             label:'cut by the reductions'},
            {n:data.space.candidates, tone:'ink', r:2, label:'candidates'},
            {n:data.survivors, tone:'lit', r:7, label:'explanations'}]
      .filter(g=>g.n>0)})]);

  if(!STILL){
    const rev=new IntersectionObserver(es=>{
      for(const e of es) if(e.isIntersecting){
        e.target.classList.add('in');
        const f=fields.find(([h])=>h===e.target||e.target.contains(h)||h.contains(e.target));
        if(f) f[1].show();
        rev.unobserve(e.target);
      }
    },{rootMargin:'0px 0px -6% 0px',threshold:.1});
    document.querySelectorAll('.rise').forEach(n=>rev.observe(n));
  } else {
    document.querySelectorAll('.rise').forEach(n=>n.classList.add('in'));
    fields.forEach(([,f])=>f.show());
  }
  addEventListener('resize',()=>fields.forEach(([,f])=>f.resize()),{passive:true});

  const nav=document.getElementById('index');
  nav.innerHTML=`<div class=grp>finance</div>`
    + NAV.map(([id,k,label])=>`<a href="#${id}" data-i="${id}"><span class=k>${
        k}</span>${esc(label)}</a>`).join('')
    + `<div class=grp>lifecycle</div>
       <div class=loop id=loop>${LOOP.map(([k,l])=>
         `<span data-stage="${k}"><i class=st></i>${esc(l)}</span>`).join('')}</div>`
    + `<div class=grp>system</div><div class=sys id=sysline></div>`;
  const sysline = document.getElementById('sysline');
  if (sysline) sysline.innerHTML = (data.system || []).map(esc).join('<br>');
  const links=new Map([...nav.querySelectorAll('a')].map(a=>[a.dataset.i,a]));

  const ratio=new Map();
  const here=new IntersectionObserver(es=>{
    for(const e of es) ratio.set(e.target.id, e.isIntersecting?e.intersectionRatio:0);
    let id=null,best=0;
    for(const [k,v] of ratio) if(v>best){best=v;id=k;}
    if(!id) return;
    links.forEach((a,k)=>a.classList.toggle('on',k===id));
    const st = STAGE[id];
    document.querySelectorAll('#loop span').forEach(n=>
      n.classList.toggle('on', n.dataset.stage === st));
  },{rootMargin:'-40% 0px -40% 0px',threshold:[0,.1,.3,.6,1]});
  [...NAV.map(x=>x[0]), ...Object.keys(STAGE)].forEach(id=>{
    const el=document.getElementById(id); if(el && !ratio.has(id)) here.observe(el);});

  const at=location.hash.replace('#','');
  if(at&&document.getElementById(at))
    document.getElementById(at).scrollIntoView({behavior:'auto'});
}
build();
</script>
