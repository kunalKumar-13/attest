<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>ATTEST — the investigation</title>
<link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel=stylesheet>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   ATTEST — THE INVESTIGATION

   Rebuilt from measurements of the reference rather than from a memory of it.
   The two things I had wrong were the two that matter most: the reference is
   WARM PAPER, not dark, and it has NO SERIF — one grotesk for everything
   editorial, mono for everything technical. See ref/INVENTORY.md.

   What is borrowed is the FAMILY, not the design:

     · a warm paper ground with radius-0 full-bleed bands cut into it
     · three-part asymmetric rows — micro-label | statement | prose
     · display weights of 500–600 with tracking near −.045em and leading
       equal to the type size, which is what makes a 40px headline read as
       a headline instead of as large text
     · mono micro-labels in a single accent, used sparingly
     · one white specimen sheet, rail-bound, as a change of treatment
     · an ending that is mostly space

   What is ATTEST's own:

     · the palette — paper, ink, and an UMBER room that arrives exactly where
       the engine stops being able to decide. The reference spends its accent
       on an action; ATTEST spends its on a boundary, because the boundary is
       the product.
     · the faces — Space Grotesk and Space Mono, ATTEST's existing voice, set
       at the reference's ratios
     · the objects — every shape on the page stands for a record the engine
       produced. 250 points are 250 settlements. There is no decoration.

   THE RHYTHM
     field → statement → explanation → artifact → space → statement → artifact
     → space → conclusion

   Chapters change TREATMENT, not just content: paper, then a dark band where
   the machine speaks, then paper, then the specimen sheet, then the umber
   room, then almost nothing.
   ═════════════════════════════════════════════════════════════════════════ */
:root{
  /* ground */
  --paper:#f2f1ec;          /* the page */
  --sheet:#fbfaf7;          /* a specimen laid on it */
  --band:#14150f;           /* where the machine speaks */
  --band-ink:#eeede4;
  --umber:#733a20;          /* where the system stops */
  --umber-ink:#f0e3d4;

  /* ink */
  --ink:#12130f;
  --dim:#55564e;
  /* Contrast on paper is not the same problem as contrast on black. These
     tiers were carried over from the dark build, where #a9a99f was a legible
     grey; on this ground it measures 2.10:1 and the section numbers were
     effectively invisible to anyone who needs contrast. Measured against
     #f2f1ec: dim 6.57, dim2 5.05, dim3 4.70 — all clear of AA.

     The quietness now comes from SIZE, which is where the reference gets it
     too: its own 8px labels are near-black, not washed out. */
  --dim2:#666760;
  --dim3:#676860;
  --rule:rgba(18,19,15,.13);
  --rule2:rgba(18,19,15,.26);

  /* the three things colour is allowed to say */
  --mark:#b4462a;           /* a section marker, a link, an anchor */
  --proven:#2f6b4f;
  --held:#8a5f1c;

  --s:"Space Grotesk",ui-sans-serif,-apple-system,system-ui,sans-serif;
  --m:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  /* the ramp. Leading equals the size on display type; tracking is negative
     and aggressive. That ratio is the whole difference between a headline and
     text that happens to be big. */
  --t-hero:clamp(40px,6.6vw,88px);
  --t-chapter:clamp(28px,3.4vw,46px);
  --t-sect:clamp(23px,2.1vw,31px);
  --t-body:clamp(16px,1.15vw,18px);
  --t-small:14px;
  --t-micro:11px;
  --t-nano:9px;

  --nav:196px;
  --gut:clamp(20px,3.4vw,50px);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--paper);color:var(--ink);font-family:var(--s);
  font-size:var(--t-body);line-height:1.55;-webkit-font-smoothing:antialiased;
  overflow-x:hidden}
a{color:inherit}

/* ── the traces ──────────────────────────────────────────────────────────
   Enormous, faint, and fixed: two circles and two long diagonals, drawn once
   at page scale. They give the paper a size — without them a dark ground and
   a light ground both read as "a colour", and the page has no room in it. */
#traces{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6}
#traces svg{width:100%;height:100%;display:block}
#traces circle,#traces line{fill:none;stroke:rgba(18,19,15,.11);
  stroke-width:1;vector-effect:non-scaling-stroke}

/* ── the standing nav ────────────────────────────────────────────────────
   Left, fixed, quiet. Grouped like a contents page, not a menu bar. It never
   competes: 11px labels, 15px links, and the held one carries the mark. */
#nav{position:fixed;left:0;top:0;bottom:0;width:var(--nav);z-index:5;
  padding:26px 0 26px 26px;display:flex;flex-direction:column;
  border-right:1px solid var(--rule);background:var(--paper)}
#nav .wm{font-family:var(--m);font-weight:700;letter-spacing:.26em;
  font-size:13px;margin-bottom:34px}
#nav .grp{font-family:var(--m);font-size:var(--t-nano);letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim3);margin:20px 0 9px}
#nav a{display:block;text-decoration:none;color:var(--dim);font-size:var(--t-small);
  padding:3px 0;transition:color .16s}
#nav a:hover{color:var(--ink)}
#nav a.on{color:var(--mark)}
#nav a .k{font-family:var(--m);font-size:var(--t-nano);color:var(--dim3);
  margin-right:7px}
#nav a.on .k{color:var(--mark)}
#nav .sp{flex:1}
#nav .enter{font-family:var(--m);font-size:var(--t-micro);letter-spacing:.14em;
  text-transform:uppercase;text-decoration:none;color:var(--ink);
  border:1px solid var(--rule2);padding:11px 12px;display:flex;
  justify-content:space-between;gap:8px;margin-right:26px;
  transition:background .18s,color .18s}
#nav .enter:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ── the strip ───────────────────────────────────────────────────────────
   What produced the page, stated in the machine's own voice, pinned above it.
   The reference puts an install command here; ATTEST puts its provenance,
   because that is the equivalent fact: how what follows was made. */
#strip{position:fixed;top:0;left:var(--nav);right:0;z-index:6;background:var(--band);
  color:var(--band-ink);font-family:var(--m);font-size:var(--t-micro);
  letter-spacing:.08em;padding:10px var(--gut);display:flex;gap:22px;
  align-items:center;white-space:nowrap;overflow:hidden}
#strip b{font-weight:400;color:#fff}
#strip i{font-style:normal;color:rgba(238,237,228,.44)}
#strip .sp{flex:1}

main{position:relative;z-index:1;margin-left:var(--nav);padding-top:38px}

/* ── a section ───────────────────────────────────────────────────────────
   The three-part row is the whole composition: a marker at the left edge, the
   statement in the middle, the prose or the artifact to the right. Nothing is
   centred; nothing is a grid of equal cells. */
section{padding:clamp(74px,11vh,150px) var(--gut);position:relative;
  max-width:1560px}
.row{display:grid;grid-template-columns:var(--mk,152px) minmax(0,var(--st,1fr))
  minmax(0,var(--as,.85fr));gap:clamp(20px,3vw,48px);align-items:start}
.row.tight{--as:0}
.row.wide-mk{--mk:210px}
.mk{font-family:var(--m);font-size:var(--t-micro);letter-spacing:.16em;
  text-transform:uppercase;color:var(--mark);line-height:1.5;padding-top:.5em}
.mk b{display:block;font-weight:700}
.mk em{display:block;font-style:normal;color:var(--dim3);margin-top:4px}

/* display type: leading = size, tracking negative */
h1,h2,h3{font-weight:500;letter-spacing:-.045em;line-height:1}
.hero-t{font-size:var(--t-hero);max-width:14ch;text-wrap:balance}
.chapter{font-size:var(--t-chapter);max-width:17ch;text-wrap:balance}
.sect{font-size:var(--t-sect);max-width:22ch;text-wrap:balance}
.say{font-size:var(--t-body);color:var(--dim);max-width:46ch;line-height:1.6}
.say + .say{margin-top:.9em}
.say b{color:var(--ink);font-weight:500}
.say a{color:var(--mark)}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.fig{font-family:var(--m);font-variant-numeric:tabular-nums;
  letter-spacing:-.05em;font-weight:400}
.lbl{font-family:var(--m);font-size:var(--t-micro);letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim2)}

/* ── full-bleed bands: where the machine speaks ─────────────────────────── */
.band{background:var(--band);color:var(--band-ink);
  padding:clamp(46px,7vh,92px) var(--gut);margin:clamp(40px,6vh,80px) 0;
  position:relative;z-index:1}
.band .mk{color:#e8a37a}
.band .say{color:rgba(238,237,228,.72)}
.band .say b{color:#fff}
.band .lbl{color:rgba(238,237,228,.55)}
/* the marker's note inherits the PAPER grey; on a dark band that measures
   3.46:1, so each ground states its own */
.band .mk em{color:#8b8c83}
.band h2,.band h3{color:#fff}
.band .rule{border-color:rgba(255,255,255,.16)}

/* ── the umber room: where the system stops ─────────────────────────────── */
.umber{background:var(--umber);color:var(--umber-ink);
  padding:clamp(80px,15vh,190px) var(--gut);margin:clamp(40px,6vh,80px) 0 0;
  position:relative;z-index:1}
.umber .mk{color:#e8b98f}
.umber .say{color:rgba(240,227,212,.78)}
.umber .say b{color:#fff}
.umber .lbl{color:rgba(240,227,212,.62)}
.umber .mk em{color:#d3b89f}
.umber h2{color:#fff}

.rule{border:0;border-top:1px solid var(--rule);margin:clamp(22px,3.4vh,40px) 0}

/* what enters the viewport */
.rise{opacity:0;transform:translateY(16px);
  transition:opacity .6s cubic-bezier(.16,1,.3,1),
             transform .6s cubic-bezier(.16,1,.3,1)}
.rise.in{opacity:1;transform:none}
.rise.d1{transition-delay:.06s} .rise.d2{transition-delay:.12s}
.rise.d3{transition-delay:.18s} .rise.d4{transition-delay:.24s}
@media (prefers-reduced-motion:reduce){.rise{opacity:1;transform:none;transition:none}}

@media (max-width:1000px){
  :root{--nav:0px}
  #nav{position:static;width:auto;flex-direction:row;align-items:center;
    gap:14px;padding:12px var(--gut);border-right:0;
    border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
  #nav::-webkit-scrollbar{display:none}
  #nav .grp,#nav .sp{display:none}
  #nav .wm{margin:0 10px 0 0}
  #nav a{white-space:nowrap;padding:3px 0}
  #nav a .k{margin-right:4px}
  #nav .enter{margin:0;padding:8px 10px}
  #strip{position:static;left:0}
  main{margin-left:0;padding-top:0}
  .row{grid-template-columns:minmax(0,1fr);gap:14px}
  .mk{padding-top:0}
  .hero-t,.chapter,.sect,.say{max-width:none}
}
</style>

<div id=traces aria-hidden=true>
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <circle cx="330" cy="180" r="270"/>
    <circle cx="1230" cy="760" r="420"/>
    <line x1="-100" y1="620" x2="1600" y2="240"/>
    <line x1="-100" y1="240" x2="1600" y2="880"/>
  </svg>
</div>

<nav id=nav>
  <span class=wm>ATTEST</span>
  <div id=index></div>
  <span class=sp></span>
  <a class=enter href="/app" id=open-app>open the instrument <i>↗</i></a>
</nav>

<div id=strip>
  <b>ATTEST</b><i>settlement reconciliation</i>
  <span class=sp></span>
  <span id=prov>reading the engine…</span>
</div>

<main id=main>
  <section><p class=say id=boot>Reading the engine…</p></section>
</main>
<style>
/* ── 00 · the opening ────────────────────────────────────────────────────
   Almost nothing. A marker, a statement, and a great deal of paper. The two
   figures arrive far below the statement, not beside it. */
#open{min-height:82svh;display:flex;flex-direction:column;justify-content:center;
  padding-top:clamp(50px,9vh,110px)}
#open .hero-t em{font-style:normal;color:var(--dim2);display:block}
.opening-figs{display:flex;flex-wrap:wrap;align-items:baseline;
  gap:clamp(18px,3.4vw,60px);margin-top:clamp(46px,9vh,120px)}
.opening-figs .v{font-size:clamp(24px,2.7vw,38px)}
.opening-figs .u{display:flex;flex-direction:column;gap:5px}
.opening-figs .u b{font-family:var(--m);font-weight:400;
  font-size:clamp(17px,1.7vw,23px);font-variant-numeric:tabular-nums;
  letter-spacing:-.04em}
.cue{margin-top:clamp(40px,8vh,96px);display:inline-flex;align-items:center;
  gap:10px;font-family:var(--m);font-size:var(--t-micro);letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim2);border:0;background:none;
  cursor:pointer;padding:0}
.cue:hover{color:var(--ink)}
.cue i{font-style:normal;animation:nudge 2.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.cue i{animation:none}}

/* ── the stage: any object the data draws ───────────────────────────────── */
.stage{position:relative;width:100%;min-height:clamp(180px,30vh,320px)}
.stage canvas{display:block;width:100%;height:100%;position:absolute;inset:0}
.stage.tall{min-height:clamp(240px,44vh,460px)}

/* ── 02 · the collapse, as printed mass ─────────────────────────────────── */
.fall{margin-top:clamp(22px,3.4vh,40px)}
.fall-r{display:grid;grid-template-columns:minmax(0,1fr) auto;
  gap:8px clamp(14px,2.4vw,34px);align-items:baseline;
  padding:clamp(12px,2vh,22px) 0;border-top:1px solid var(--rule)}
.fall-r:first-child{border-top:0}
.fall-v{font-family:var(--m);font-variant-numeric:tabular-nums;
  letter-spacing:-.045em;text-align:right;white-space:nowrap;
  font-size:clamp(16px,1.7vw,23px)}
.fall-m{grid-column:1/3;height:clamp(5px,.9vh,9px);background:var(--ink);
  transform-origin:left;transform:scaleX(var(--w,1));
  transition:transform 1.1s cubic-bezier(.16,1,.3,1)}
.rise:not(.in) .fall-m{transform:scaleX(0)}
.fall-r.stop .fall-m{background:var(--held)}
.fall-x{grid-column:1/3;display:flex;flex-wrap:wrap;align-items:baseline;
  gap:5px 13px;padding-top:5px}
.fall-x b{font-family:var(--m);font-variant-numeric:tabular-nums;font-weight:400;
  font-size:clamp(21px,2.7vw,40px);letter-spacing:-.05em;color:var(--held)}
.fall-x span{color:var(--dim2);font-size:var(--t-small);max-width:48ch}
.band .fall-r{border-color:rgba(255,255,255,.14)}
.band .fall-m{background:var(--band-ink)}
.band .fall-r.stop .fall-m{background:#e8a37a}
.band .fall-x b{color:#e8a37a}
.band .fall-x span{color:rgba(238,237,228,.62)}

/* ── 03 · the four verdicts ─────────────────────────────────────────────── */
.verd{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
  gap:clamp(18px,2.6vw,40px);margin-top:clamp(22px,3.4vh,40px)}
.verd-c b{display:block;font-family:var(--m);font-weight:400;
  font-size:clamp(30px,3.6vw,54px);letter-spacing:-.055em;line-height:.94;
  font-variant-numeric:tabular-nums}
.verd-c span{display:block;font-family:var(--m);font-size:var(--t-micro);
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim2);margin-top:8px}
.verd-c em{display:block;font-style:normal;font-size:var(--t-small);
  color:var(--dim2);margin-top:9px;line-height:1.45}
.verd-c.p b{color:var(--proven)} .verd-c.a b{color:var(--held)}
.verd-c.c b{color:var(--mark)}   .verd-c.i b{color:var(--dim3)}

/* ── 04 · the reduction ─────────────────────────────────────────────────── */
.red-n{display:flex;align-items:baseline;gap:clamp(12px,2vw,26px);flex-wrap:wrap;
  padding:clamp(8px,1.4vh,16px) 0}
.red-n b{font-family:var(--m);font-weight:400;font-variant-numeric:tabular-nums;
  letter-spacing:-.055em;line-height:.92;font-size:clamp(34px,5.4vw,86px)}
.red-n span{font-family:var(--m);font-size:var(--t-micro);letter-spacing:.16em;
  text-transform:uppercase;color:rgba(238,237,228,.55)}
.red-c{display:grid;grid-template-columns:auto minmax(0,1fr);
  gap:4px clamp(12px,2vw,26px);align-items:baseline;
  padding:clamp(9px,1.5vh,16px) 0 clamp(9px,1.5vh,16px) clamp(14px,2.4vw,34px);
  margin-left:clamp(6px,1.2vw,16px);border-left:1px solid rgba(255,255,255,.18)}
.red-c b{font-family:var(--m);font-weight:400;font-variant-numeric:tabular-nums;
  font-size:var(--t-small);color:rgba(238,237,228,.8)}
.red-c i{font-style:normal;font-family:var(--m);font-size:var(--t-nano);
  letter-spacing:.16em;text-transform:uppercase}
.red-c.conv i{color:#e8a37a} .red-c.det i{color:#8fd4b0}
.red-c p{grid-column:2;color:rgba(238,237,228,.55);font-size:var(--t-small);
  max-width:62ch}

/* ── 05 · the three actors ──────────────────────────────────────────────── */
.act{position:relative;margin-top:clamp(20px,3vh,34px)}
.act::before{content:"";position:absolute;left:6px;top:30px;bottom:30px;width:1px;
  background:rgba(255,255,255,.2)}
.act-r{display:grid;grid-template-columns:14px 104px minmax(0,1fr);
  gap:clamp(10px,1.8vw,24px);align-items:baseline;padding:clamp(11px,1.9vh,20px) 0}
.act-r i{justify-self:center;align-self:center;width:10px;height:10px;
  background:var(--band);font-style:normal;position:relative;z-index:1}
.act-r.model i{border:1.5px solid #cbb2f4;transform:rotate(45deg)}
.act-r.solver i{border:1.5px solid #9dc0ff;border-radius:999px}
.act-r.engine i{background:#fff;border-radius:999px}
.act-r b{font-family:var(--m);font-size:var(--t-micro);letter-spacing:.18em;
  text-transform:uppercase;font-weight:400;color:rgba(238,237,228,.72)}
.act-r.model b{color:#d5c1f8} .act-r.solver b{color:#a8c7ff}
.act-r.engine b{color:#fff}
.act-r span{color:rgba(238,237,228,.68);font-size:var(--t-small)}
.term{margin-top:clamp(24px,4vh,48px);padding-top:clamp(20px,3.4vh,38px);
  border-top:1px solid rgba(255,255,255,.18)}
.term b{display:block;font-family:var(--m);font-size:clamp(20px,3.4vw,48px);
  letter-spacing:-.05em;line-height:1.06;text-transform:uppercase;font-weight:700;
  color:#fff}
.term b + b{color:#e8a37a}

/* ── 06 · the threshold ─────────────────────────────────────────────────── */
.thr-h{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:clamp(16px,2.6vw,42px);margin-bottom:clamp(18px,2.8vh,32px)}
.thr-h b{display:block;font-family:var(--m);font-weight:400;
  font-variant-numeric:tabular-nums;font-size:clamp(24px,3.2vw,46px);
  letter-spacing:-.05em;line-height:1}
.thr-h.none b{color:var(--held);letter-spacing:0}
.thr-s{position:relative;height:clamp(28px,4vh,44px);
  background:rgba(18,19,15,.06);border:1px solid var(--rule)}
.thr-line{position:absolute;top:-6px;bottom:-6px;width:1px;background:var(--ink)}
.thr-mark{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;
  border-radius:999px;background:var(--proven);box-shadow:0 0 0 4px var(--paper)}
.thr-z{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--m);
  font-size:var(--t-nano);letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim)}
/* The one line that was running the full 1146px content width. The reference
   never lets prose past 760; a measure that long is a paragraph the eye has to
   track back across, and it is the single most dashboard-like thing a page can
   do with text. */
.thr-r{margin-top:clamp(16px,2.6vh,30px);font-size:var(--t-body);
  color:var(--dim);max-width:56ch}
.thr-r b{font-family:var(--m);color:var(--ink);font-weight:400;
  font-variant-numeric:tabular-nums;letter-spacing:-.04em}

/* ── 07 · the specimen sheet ────────────────────────────────────────────
   A change of treatment, not just of content: the books are laid on a sheet,
   rail-bound down both edges the way a ledger page is punched. */
.sheet{background:var(--sheet);border:1px solid var(--rule);
  margin:clamp(30px,5vh,64px) 0;position:relative;
  padding:clamp(38px,6vh,80px) clamp(38px,6vw,86px)}
.sheet::before,.sheet::after{content:"";position:absolute;top:22px;bottom:22px;
  width:5px;background-image:radial-gradient(circle,var(--rule2) 1.6px,transparent 1.7px);
  background-size:5px 19px}
.sheet::before{left:15px} .sheet::after{right:15px}
.book-t{display:grid;grid-template-columns:auto minmax(0,160px);
  gap:8px clamp(20px,3vw,44px);align-items:baseline;
  margin-top:clamp(18px,2.8vh,32px)}
.book-t i{font-style:normal;font-family:var(--m);font-size:var(--t-micro);
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim2)}
.book-t b{font-family:var(--m);font-weight:400;font-variant-numeric:tabular-nums;
  font-size:clamp(16px,1.7vw,22px);text-align:right;color:var(--dim)}
/* `.net` is on the cells themselves, not on a row wrapper — the descendant
   form matched nothing and the rule that closes the account never drew. */

<script>
'use strict';
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async p => { const r = await fetch(p);
  if (!r.ok) throw new Error(`${p} → ${r.status}`); return r.json(); };
const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
const CASE = 'setl_000225';
const cap = s => esc(String(s ?? '').trim().replace(/[.\s]+$/, ''))
  .replace(/^./, c => c.toUpperCase());

/* ═══════════════════════════════════════════════════════════ THE OBJECTS
 *
 * Every field on this page is a population the engine actually produced,
 * drawn onto its own small canvas inside the section that talks about it.
 *
 * One canvas per object rather than one world behind everything, because the
 * page is PAPER now: a field printed on the sheet where it belongs reads as an
 * artifact, and the same field floating behind the whole document reads as
 * wallpaper. The continuity is carried by the sequence — 250 becomes 52+197+1,
 * one of the 197 becomes 2,368 candidates, which become 164, which become 4 —
 * and each step is drawn from the previous step's numbers.
 *
 * Deterministic: the jitter comes from a fixed seed, so the same run draws the
 * same field every time and two screenshots can be compared.
 */
function Field(host, spec) {
  const cv = document.createElement('canvas');
  host.appendChild(cv);
  const cx = cv.getContext('2d');
  let W = 0, H = 0, pts = [], raf = 0, shown = false;
  let seed = 20260821;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;

  function build() {
    seed = 20260821; pts = [];
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = host.clientWidth; H = host.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const groups = spec.groups;            // [{n, tone, r}]
    const total = groups.reduce((a, g) => a + g.n, 0) || 1;
    /* A lane per group, left to right, each sized by its own count. The gap
       between lanes shrinks with the viewport — at a fixed 46px the lone
       CONTRADICTED point was pushed off the right edge of a 390px screen, so
       the one settlement the section is partly about could not be seen. */
    const gap = Math.min(spec.lane || 34, W * .07);
    const gaps = groups.length - 1;
    const lane = (W - gaps * gap) / total;                 // width per point
    let x0 = 0;
    groups.forEach(g => {
      const cols = Math.max(1, Math.round(Math.sqrt(g.n * (g.w || 1) * 1.6)));
      const rows = Math.ceil(g.n / cols);
      const cell = Math.min((g.n * lane) / cols, H / rows, spec.cell || 13);
      const gw = cols * cell, gh = rows * cell;
      for (let i = 0; i < g.n; i++) {
        pts.push({
          x: x0 + (i % cols) * cell + cell / 2 + (rnd() - .5) * 1.4,
          y: (H - gh) / 2 + ((i / cols) | 0) * cell + cell / 2 + (rnd() - .5) * 1.4,
          r: g.r || 1.9, c: g.tone, d: rnd(),
        });
      }
      x0 += gw + gap;
    });
    // centre the whole arrangement
    const used = x0 - gap;
    const shift = Math.max(0, (W - used) / 2);
    pts.forEach(p => { p.x += shift; });
  }

  function draw(t) {
    raf = 0;
    cx.clearRect(0, 0, W, H);
    for (const p of pts) {
      const a = STILL ? 1 : Math.max(0, Math.min(1, (t - p.d * .55) / .45));
      if (a <= 0) continue;
      cx.globalAlpha = a * (p.c === 'ghost' ? .3 : 1);
      cx.fillStyle = TONE[p.c] || TONE.ink;
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.2832); cx.fill();
    }
    cx.globalAlpha = 1;
  }

  const TONE = { ink:'#12130f', paper:'#eeede4', proven:'#2f6b4f',
                 held:'#8a5f1c', mark:'#b4462a', ghost:'#12130f',
                 dim:'#a9a99f', lit:'#e8a37a' };

  let t0 = 0;
  function run(ts) {
    if (!t0) t0 = ts;
    const t = Math.min(1.15, (ts - t0) / 900);
    draw(t);
    if (t < 1.15) raf = requestAnimationFrame(run);
  }

  return {
    show() {
      if (shown) return; shown = true;
      build();
      if (STILL) { draw(1.15); return; }
      t0 = 0; raf = requestAnimationFrame(run);
    },
    resize() { if (!shown) return; build(); draw(1.15); },
  };
}
</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════ THE SEQUENCE
 * Twelve movements. Every figure fetched at load; nothing written down.
 */
const SECTIONS = [
  ['open',        'opening'],
  ['money',       'the money'],
  ['collapse',    'the collapse'],
  ['population',  'the population'],
  ['exception',   'the exception'],
  ['proof',       'the proof'],
  ['investigation','the investigation'],
  ['decision',    'the decision'],
  ['books',       'the books'],
  ['activity',    'the activity'],
  ['trust',       'trust'],
  ['boundary',    'the boundary'],
];
/* [first index, group label, how many] — the three acts. Getting these wrong
   printed a contents page that skipped 01–04 and listed trust twice. */
const GROUPS = [[0, 'the run', 5], [5, 'the case', 5], [10, 'the limits', 2]];

const rise = (cls, html, d) =>
  `<div class="rise${d ? ' d' + d : ''}${cls ? ' ' + cls : ''}">${html}</div>`;
const mk = (n, label, note) => `<div class=mk><b>${
  String(n).padStart(2, '0')}</b>${esc(label)}${
  note ? `<em>${esc(note)}</em>` : ''}</div>`;

async function build() {
  const main = document.getElementById('main');
  try {
    const run = await api('/api/run?n=250');
    const id = run.run_id;
    const [rec, spine, acts, det, inv, dec, claims, act] = await Promise.all([
      api(`/api/subject?run=${id}&type=portfolio&id=portfolio`),
      api(`/api/spine?run=${id}&type=portfolio&review=15000&exposure=10000000`),
      api(`/api/actions?run=${id}`),
      api(`/api/settlement?run=${id}&id=${CASE}`),
      api(`/api/investigation?run=${id}&type=settlement&id=${CASE}`),
      api(`/api/decision?run=${id}&type=settlement&id=${CASE}&review=15000&exposure=10000000`),
      api(`/api/claims?run=${id}`),
      api(`/api/activity?run=${id}&type=settlement&id=${CASE}`),
    ]);

    const src = rec.source || {};
    document.getElementById('prov').innerHTML =
      `${esc(src.label || '')} <i>·</i> ${esc((src.engine || {}).label || '')}
       <i>·</i> seed ${esc(String(run.seed))} <i>·</i> run ${esc(id)}`;
    document.getElementById('open-app').href =
      `/app#/settlement/${encodeURIComponent(CASE)}/evidence`;

    const st = k => spine.stages.find(s => s.key === k) || {};
    const c = run.counts || {}, space = det.space || {};
    const survivors = (det.proofs || []).length;
    const blocker = (acts.actions || [])[0] || {};
    const held = spine.stages.reduce((n, s) => n + (s.held || 0), 0);
    const iso = claims.isolation || {}, adv = claims.adversarial || {};
    const top = Math.max(...spine.stages.map(s => s.continues_paise), 1);
    const rupee = p => `₹${(p / 100).toLocaleString('en-IN',
      { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    const b = dec.boundary || {};

    main.innerHTML = `

<section id=open>
  ${rise('row tight', mk(0, 'the investigation', 'attest')
    + `<h1 class=hero-t>Financial reconciliation
       <em>that refuses to invent certainty.</em></h1>`)}
  ${rise('opening-figs', `
    <span class="fig v">${esc(rupee(run.processed_paise))}</span>
    <span class=u><b>${esc(String(run.settlements))}</b>
      <span class=lbl>settlements</span></span>
    <span class=u><b>${Number(run.orders).toLocaleString()}</b>
      <span class=lbl>orders</span></span>`, 2)}
  ${rise('', `<button class=cue data-go=money>begin <i>↓</i></button>`, 4)}
</section>

<section id=money>
  ${rise('row', mk(1, 'the money', 'what went in')
    + `<h2 class=chapter>Every credit is a claim that some set of orders was
       paid out. None of them says which set.</h2>`
    + `<div><p class=say>${cap(st('source').detail)}. The engine's job is not
         to find a match — it is to establish whether one can be
         <b>proved</b>, and to say so when it cannot.</p></div>`)}
</section>

<div class=band id=collapse>
  ${rise('row', mk(2, 'the collapse', 'stage by stage')
    + `<h2 class=chapter>Money enters at the top. Almost none of it reaches
       the bottom.</h2>`
    + `<div><p class=say>Of <b>${esc(rupee(run.processed_paise))}</b> that
         entered, <b>${esc(rupee(spine.posted_paise))}</b> reached the ledger.
         The other ${held} settlements did not fail — they stopped, and each
         one says what is holding it.</p></div>`)}
  ${rise('fall', spine.stages.map((s, i) => {
    const w = Math.max(s.continues_paise / top, s.continues_paise > 0 ? .004 : 0);
    const same = i > 0 && spine.stages[i - 1].value === s.value;
    return `<div class="fall-r${s.state === 'stopped' ? ' stop' : ''}">
      <span class=lbl>${esc(s.label)}</span>
      <span class=fall-v>${same ? '' : esc(s.value)}</span>
      <span class=fall-m style="--w:${w.toFixed(4)}"></span>
      ${s.held ? `<span class=fall-x><b>${esc(s.held_value)}</b>
        <span>held — ${esc(s.detail)}</span></span>` : ''}
    </div>`; }).join(''), 1)}
</div>

<section id=population>
  ${rise('row', mk(3, 'the population', `${run.settlements} records`)
    + `<h2 class=chapter>${esc(String(run.settlements))} settlements went in.
       The engine proved ${c.PROVEN} of them.</h2>`
    + `<div><p class=say>It did not force the remaining
         ${c.AMBIGUOUS + c.CONTRADICTED} into an answer. Every point below is
         one of these settlements, separated by what could be established
         about it.</p></div>`)}
  ${rise('stage tall', '', 1)}
  ${rise('verd', `
    <div class="verd-c p"><b>${c.PROVEN}</b><span>proven</span>
      <em>one order set satisfies the credit, re-derived by an independent
        kernel</em></div>
    <div class="verd-c a"><b>${c.AMBIGUOUS}</b><span>ambiguous</span>
      <em>more than one satisfies it exactly, and arithmetic cannot
        choose</em></div>
    <div class="verd-c c"><b>${c.CONTRADICTED}</b><span>contradicted</span>
      <em>the closest explanation leaves a residual with no matching
        record</em></div>
    <div class="verd-c i"><b>${c.INSUFFICIENT}</b><span>insufficient</span>
      <em>outside the solver's envelope — nothing was attempted</em></div>`, 2)}
</section>

<section id=exception>
  ${rise('row', mk(4, 'the exception', 'one reason')
    + `<h2 class=chapter>One missing field is holding
       ${esc(rupee(blocker.leverage_paise || blocker.value_paise || 0))}.</h2>`
    + `<div><p class=say>${cap(blocker.why)}.</p>
       <p class=say>That is <b>${blocker.settlements} settlements</b> blocked
         for the same reason, which is why it is one piece of work rather than
         ${blocker.settlements}.</p></div>`)}
</section>

<div class=band id=proof>
  ${rise('row', mk(5, 'the proof', esc(CASE))
    + `<h2 class=chapter>Inside one settlement, the search space
       collapses.</h2>`
    + `<div><p class=say>Some of these cuts are <b>conventions rather than
         facts</b>, and the chain says which. Uniqueness inside a space that
         already excluded the truth is not uniqueness.</p></div>`)}
  ${rise('stage', '', 1)}
  ${rise('', `
    <div class=red-n><b>${Number(space.universe).toLocaleString()}</b>
      <span>orders in the book</span></div>
    ${(space.reductions || []).map(x => `<div class="red-c ${
      x.deterministic ? 'det' : 'conv'}">
      <b>−${Number(x.removed).toLocaleString()}</b>
      <span class=say style="color:rgba(238,237,228,.8);max-width:none"
        >${esc(x.name)} <i>${x.deterministic ? 'deterministic' : 'convention'}</i></span>
      <p>${esc(x.justification)}</p></div>`).join('')}
    <div class=red-n><b>${Number(space.candidates).toLocaleString()}</b>
      <span>could belong to this credit</span></div>
    <div class="red-c det"><b>∑</b>
      <span class=say style="color:rgba(238,237,228,.8);max-width:none"
        >subsets whose net equals the credit <i>deterministic</i></span>
      <p>the last cut is arithmetic rather than a rule: what survives is every
        subset of the ${Number(space.candidates).toLocaleString()} candidates
        whose net equals the credit within tolerance</p></div>
    <div class=red-n><b style="color:#e8a37a">${survivors}</b>
      <span>explanations survive</span></div>`, 2)}
</div>

<div class=band id=investigation style="margin-top:0">
  ${rise('row', mk(6, 'the investigation', 'model · solver · engine')
    + `<h2 class=chapter>${esc(inv.question || 'What would separate them?')}</h2>`
    + `<div><p class=say>The model is asked for a hypothesis, never for a
         verdict. Its conclusion is recorded as evidence and discarded —
         <b>not eligible to become the verdict</b>, and nothing downstream
         reads it.</p></div>`)}
  ${rise('act', `
    <div class="act-r model"><i></i><b>Model</b>
      <span>proposed an anchor that might separate the survivors</span></div>
    <div class="act-r solver"><i></i><b>Solver</b>
      <span>tested whether the anchor discriminates —
        ${esc(String(inv.tested ?? 0))} tested,
        ${esc(String(inv.discriminative ?? 0))} discriminative</span></div>
    <div class="act-r engine"><i></i><b>Engine</b>
      <span>retained the verdict it already had</span></div>`, 1)}
  ${rise('term', `<b>Verdict unchanged</b><b>No financial action</b>`, 2)}
</div>

<section id=decision>
  ${rise('row', mk(7, 'the decision', 'what is safe')
    + `<h2 class=chapter>Automate only what is cheaper to get wrong than to
       check.</h2>`
    + `<div><p class=say>Across the run this priced <b>${c.PROVEN} proven
         settlements</b> and let ${st('action').count} post without a person,
         for <b>${esc(rupee(spine.posted_paise))}</b> and
         <b>${run.wrong} wrong</b>.</p></div>`)}
  ${rise('', (() => {
    const rev = b.review_paise, loss = b.priced ? b.expected_loss_paise : null;
    const span = Math.max(loss || 0, rev) * 2;
    const pos = v => Math.min(v / span * 100, 96);
    return `<div class=thr-h>
        <div class="${b.priced ? '' : 'none'}"><span class=lbl>expected loss</span>
          <b>${b.priced ? esc(rupee(loss)) : 'Unpriced'}</b></div>
        <div><span class=lbl>cost of a review</span><b>${esc(rupee(rev))}</b></div>
      </div>
      <div class=thr-s>
        <i class=thr-line style="left:${pos(rev)}%"></i>
        ${b.priced ? `<i class=thr-mark style="left:${pos(loss)}%"></i>` : ''}
        <span class=thr-z style="left:12px">automating is cheaper</span>
        <span class=thr-z style="right:12px">checking is cheaper</span>
      </div>
      <p class=thr-r>${b.priced
        ? `<b>${esc(rupee(Math.abs(rev - loss)))}</b> cheaper to automate than to check.`
        : `There is nothing on the scale. The proof did not establish a unique
           explanation, so there is no error probability to multiply — and a
           zero here would claim the posting was proved safe.`}</p>`;
  })(), 1)}
</section>

<section id=books>
  ${rise('row', mk(8, 'the books', 'the ledger effect')
    + `<h2 class=chapter>Nothing was written, which is not the same as writing
       nothing.</h2>`
    + `<div><p class=say>An entry that happens to net to zero and an entry that
         was never written are indistinguishable in a total. They are not the
         same event, so the books say which one this was.</p></div>`)}
  ${rise('sheet', `
    <span class=lbl>ledger effect · ${esc(CASE)}</span>
    <div class=book-t>
      <i>debit</i><b>₹0.00</b>
      <i>credit</i><b>₹0.00</b>
      <i class=net>net</i><b class=net>₹0.00</b>
    </div>
    <div class=stamp>Balanced by absence</div>
    <hr class=rule>
    <p class=say>Entry not written. ${cap(b.statement || 'Policy did not permit posting')}.</p>`, 1)}
</section>

<section id=activity>
  ${rise('row', mk(9, 'the activity', `${(act.events || []).length} events`)
    + `<h2 class=chapter>Every step is recorded, including the ones that
       changed nothing.</h2>`
    + `<div><p class=say>Each step names what caused it, so the chain from a
         bank credit arriving to a ledger that did not move can be read without
         knowing anything about the engine.</p></div>`)}
  ${rise('', (act.events || []).map(e => `
    <div class="chain-e ${esc((e.actor || '').toLowerCase())}">
      <i>${esc(e.actor || 'system')}</i>
      <span>${esc(e.what || '')}${e.value
        ? ` <b class=mono style="font-weight:400">${esc(e.value)}</b>` : ''}</span>
      ${e.caused_by ? `<span class=chain-b>${esc(e.caused_by)}</span>` : ''}
    </div>`).join(''), 1)}
</section>

<section id=trust>
  ${rise('row', mk(10, 'trust', 'what is not claimed')
    + `<h2 class=chapter>What can I believe?</h2>`
    + (adv.present ? `<div><p class=say>Each attack is an attempt to move money
         the engine should not be able to move. A refusal counts as a defence;
         an exception from the harness does not, and there
         ${adv.harness_errors === 1 ? 'was' : 'were'}
         ${adv.harness_errors} of those.</p></div>` : '<div></div>'))}
  ${adv.present ? rise('attk', `
    <div class=attk-c><b>${adv.attacks}</b><span>attacks</span></div>
    <div class="attk-c ok"><b>${adv.defended}</b><span>defended</span></div>
    <div class="attk-c ok"><b>${adv.breached}</b><span>breached</span></div>`, 1) : ''}
  ${rise('', `<hr class=rule><span class=lbl>what ATTEST does not claim</span>` +
    (claims.unknowns || []).slice(0, 6).map(u => `
    <div class=refuse-r><b>${esc(u.what)}</b><span>${esc(u.why)}</span>
      <i>not verified</i></div>`).join(''), 2)}
</section>

<div class=umber id=boundary>
  ${rise('row', mk(11, 'the boundary', 'where it stops')
    + `<h2 class=chapter>The system can take you this far.</h2>`
    + `<div><p class=say>${iso.isolated
        ? `All <b>${iso.clean} of ${iso.modules}</b> modules that produce a
           verdict were read, and none contains the string
           <span class=mono>${esc(iso.provider)}</span>. The engine does not
           know Razorpay exists — a measurement, not a claim.`
        : `${(iso.mentions || []).length} of ${iso.modules} engine modules name
           the provider. The portability claim does not currently hold.`}</p>
       <p class=say>Live account validation: <b>not verified</b>. Every figure
         on this page describes generated data, and the product says so on its
         own Trust instrument.</p></div>`)}
  ${rise('umber-figs', `
    <span class=u><b>${esc(rupee(blocker.leverage_paise || blocker.value_paise || 0))}</b>
      <span class=lbl>held here</span></span>
    <span class=u><b>${blocker.settlements}</b>
      <span class=lbl>settlements</span></span>
    <span class=u><b>0</b><span class=lbl>posted on a guess</span></span>`, 1)}
  ${rise('ask', `Supply an order-level reference.`, 2)}
</div>

<section id=end>
  ${rise('', `<p class=ghost>Only evidence moves money.</p>`)}
  ${rise('foot', `
    <p><b class=mono>${esc(String(run.settlements))}</b> settlements ·
       <b class=mono>${Number(run.orders).toLocaleString()}</b> orders ·
       <b class=mono>${esc(String(run.seed))}</b> seed ·
       ${esc(src.detail || '')}</p>
    <p>Every figure was read from the running engine when this page loaded.
       It keeps no copy of them.</p>
    <a class="enter door" style="display:inline-flex"
       href="/app#/settlement/${encodeURIComponent(CASE)}/evidence"
      >open the instrument ↗</a>`, 1)}
</section>`;

    wire({ counts: c, space, survivors, blocker });
  } catch (e) {
    main.innerHTML = `<section><p class=err>The engine did not answer, so this
      page has nothing to show. It does not keep a copy of the numbers.<br><br>
      ${esc(e.message)}</p></section>`;
  }
}
</script>
<script>
'use strict';
/* ═════════════════════════════════════════════════ REVEAL AND SEQUENCE
 * Observers only. The browser keeps the wheel.
 */
function wire(data) {
  /* the two fields, each drawn where it is being talked about */
  const stages = [...document.querySelectorAll('.stage')];
  const fields = [];
  if (stages[0]) fields.push([stages[0], Field(stages[0], {
    // the population, separated by verdict — the counts are the engine's
    cell: 15, lane: 46,
    groups: [
      { n: data.counts.PROVEN, tone: 'proven', w: 1 },
      { n: data.counts.AMBIGUOUS, tone: 'held', w: 1 },
      { n: data.counts.CONTRADICTED, tone: 'mark', r: 4, w: 1 },
      { n: data.counts.INSUFFICIENT, tone: 'dim', w: 1 },
    ].filter(g => g.n > 0),
  })]);
  if (stages[1]) fields.push([stages[1], Field(stages[1], {
    // one settlement's candidate space, and what came out of it
    cell: 6, lane: 54,
    groups: [
      { n: data.space.universe - data.space.candidates, tone: 'ghost', r: 1.3 },
      { n: data.space.candidates, tone: 'paper', r: 2 },
      { n: data.survivors, tone: 'lit', r: 7 },
    ].filter(g => g.n > 0),
  })]);

  if (!STILL) {
    const reveal = new IntersectionObserver(es => {
      for (const e of es) if (e.isIntersecting) {
        e.target.classList.add('in');
        const f = fields.find(([host]) => host === e.target
          || e.target.contains(host) || host.contains(e.target));
        if (f) f[1].show();
        reveal.unobserve(e.target);
      }
    }, { rootMargin: '0px 0px -6% 0px', threshold: .1 });
    document.querySelectorAll('.rise').forEach(n => reveal.observe(n));
  } else {
    document.querySelectorAll('.rise').forEach(n => n.classList.add('in'));
    fields.forEach(([, f]) => f.show());
  }
  addEventListener('resize', () => fields.forEach(([, f]) => f.resize()),
                   { passive: true });

  /* the contents column: grouped, quiet, and it marks where you are */
  const nav = document.getElementById('index');
  nav.innerHTML = GROUPS.map(([from, label, n]) =>
    `<div class=grp>${esc(label)}</div>` +
    SECTIONS.slice(from, from + n).map(([id, t], i) =>
      `<a href="#${id}" data-i="${id}"><span class=k>${
        String(from + i).padStart(2, '0')}</span>${esc(t)}</a>`).join('')
  ).join('');
  const links = new Map([...nav.querySelectorAll('a')].map(a => [a.dataset.i, a]));

  const ratio = new Map();
  const here = new IntersectionObserver(es => {
    for (const e of es) ratio.set(e.target.id, e.isIntersecting ? e.intersectionRatio : 0);
    let id = null, best = 0;
    for (const [k, v] of ratio) if (v > best) { best = v; id = k; }
    if (!id) return;
    links.forEach((a, k) => a.classList.toggle('on', k === id));
  }, { rootMargin: '-40% 0px -40% 0px', threshold: [0, .1, .3, .6, 1] });
  SECTIONS.forEach(([id]) => {
    const el = document.getElementById(id);
    if (el) here.observe(el);
  });

  document.querySelectorAll('[data-go]').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = document.getElementById(btn.dataset.go);
      if (t) t.scrollIntoView({ behavior: STILL ? 'auto' : 'smooth' });
    });
  });

  const at = location.hash.replace('#', '');
  if (at && document.getElementById(at))
    document.getElementById(at).scrollIntoView({ behavior: 'auto' });
}

build();
</script>
