<!doctype html><meta charset=utf-8>
<title>ATTEST · C — Minimal evidence workspace</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>
/* ============================================================ COMPOSITION C
   MINIMAL EVIDENCE WORKSPACE

   Restraint as a trust signal. An instrument that does not decorate its
   findings is easier to believe than one that does.

   Every lens is the same three beats — CLAIM, EVIDENCE, VERDICT — with a
   different instrument in the middle. State is geometry: indent, rule weight,
   hollow or filled. No cards. Almost no colour. */

:root{
  --type-display:40px; --type-title:20px; --type-data:15px;
  --type-body:14px;    --type-label:11px; --type-micro:11px;
  --w-reg:400; --w-num:400; --w-strong:600;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px;
  --s8:40px; --s9:64px;
  --r-sm:2px; --r-lg:4px;
  --micro:110ms cubic-bezier(.2,0,0,1);
  --standard:180ms cubic-bezier(.2,0,0,1);
  --spatial:280ms cubic-bezier(.16,1,.3,1);

  --bg:#fffefb; --bg2:#f6f4ef; --rule:#e2ded4; --rule2:#1c1a17;
  --ink:#14120f; --ink2:#57534b; --ink3:#8d887d;
  --stop:#9e2b16; --flow:#1f6b46; --hold:#8a5f0c; --cool:#1e5aa8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111210; --bg2:#191b18; --rule:#2b2e2a; --rule2:#e8e6e0;
  --ink:#eeece6; --ink2:#a8a49a; --ink3:#726e65;
  --stop:#e2604a; --flow:#4fb583; --hold:#d3a03c; --cool:#5e9de8;}}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font:var(--w-reg) var(--type-body)/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  overflow:hidden}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button{font:inherit;color:inherit;background:0;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:1px solid var(--cool);outline-offset:3px}
#app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}
/* Grid items default to min-width:auto, so a child that refuses to wrap sets
   the whole row's width and the page scrolls sideways however carefully the
   inner rules are written. This is the fix for that, not the inner wrapping. */
#app>*{min-width:0}
#subject,#lenses,#workspace,#w-main,#w-ctx{min-width:0}

/* -------------------------------------------------------------- masthead */
.x-subject{padding:var(--s7) var(--s9) var(--s5);border-bottom:1px solid var(--rule2)}
.c-sub{display:grid;grid-template-columns:minmax(0,1fr) auto;min-width:0;
  grid-template-areas:"l a" "m a";gap:0 var(--s7);align-items:end}
.c-sub-l{grid-area:l}
.c-sub-l h1{font:var(--w-strong) var(--type-title)/1.1 var(--sans);letter-spacing:-.015em}
.c-sub-l p{font-size:var(--type-micro);color:var(--ink3);letter-spacing:.1em;
  text-transform:uppercase;padding-top:2px}
.c-sub-amt{grid-area:a;font-size:var(--type-display);line-height:.95;
  font-weight:var(--w-num);letter-spacing:-.035em}
.c-sub-m{grid-area:m;display:flex;flex-wrap:wrap;gap:var(--s2) var(--s6);
  padding-top:var(--s3);min-width:0}
.c-sub-m span{font-size:var(--type-micro);color:var(--ink3);letter-spacing:.04em}
.c-sub-m b{color:var(--ink2)}

/* ---------------------------------------------------------------- index */
.x-lenses{padding:0 var(--s9);border-bottom:1px solid var(--rule)}
.c-idx{display:flex;gap:var(--s7)}
.c-idx button{padding:var(--s3) 0;display:flex;align-items:baseline;gap:var(--s2);
  border-bottom:1px solid transparent;margin-bottom:-1px;transition:color var(--micro)}
.c-idx .i{font-size:var(--type-micro);color:var(--ink3)}
.c-idx .n{font-size:var(--type-label);letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3)}
.c-idx button:hover .n{color:var(--ink2)}
.c-idx button.on{border-bottom-color:var(--rule2)}
.c-idx button.on .n{color:var(--ink);font-weight:var(--w-strong)}
.c-idx button.on .i{color:var(--ink2)}

/* ----------------------------------------------------------------- page */
#workspace{overflow:auto;padding:var(--s8) var(--s9) var(--s9);
  display:grid;grid-template-columns:1fr;gap:var(--s8);align-content:start}
#workspace.has-pane{grid-template-columns:minmax(0,1fr) minmax(0,340px)}
#w-ctx:empty{display:none}
/* No empty context pane. `has-pane` says this lens can show one; `has-ctx`
   says one is open. Until it is, the master owns the full width — which is
   also what makes the opening transition mean something. */
#workspace.has-pane:not(.has-ctx){grid-template-columns:minmax(0,1fr)}
#workspace.has-pane:not(.has-ctx) #w-ctx{display:none}

#w-main{max-width:104ch}

/* ------------------------------------------------------------- the ruler */
.c-ruler{display:flex;flex-direction:column;gap:var(--s1);padding-bottom:var(--s7);
  border-bottom:1px solid var(--rule);margin-bottom:var(--s7)}
.c-tick{display:grid;grid-template-columns:104px minmax(0,1fr) 84px;gap:var(--s4);
  align-items:center}
.c-tick-l{font-size:var(--type-micro);letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink3)}
.c-tick-r{border-bottom:1px solid var(--rule);position:relative;height:11px}
.c-tick-r i{position:absolute;left:0;bottom:-1px;height:3px;background:var(--rule2);
  transition:width var(--standard)}
.c-tick.stop .c-tick-r i{background:var(--stop);height:3px}
.c-tick.stop .c-tick-r::after{content:"";position:absolute;bottom:-4px;height:9px;
  width:1px;background:var(--stop);left:var(--x,0)}
.c-tick-v{text-align:right;font-size:var(--type-body);color:var(--ink2)}
.c-tick.stop .c-tick-v{color:var(--stop)}
.c-tick.stop .c-tick-l{color:var(--stop)}

/* ------------------------------------------------------------ the sheet */
.c-sheet{display:flex;flex-direction:column;gap:var(--s6)}
.c-claim{font:var(--w-reg) var(--type-title)/1.4 var(--serif);max-width:56ch;
  letter-spacing:-.005em}
.c-claim b{font-weight:var(--w-strong)}
.c-ineq{font-family:var(--mono);font-size:var(--type-data);letter-spacing:-.02em}
.c-ev{padding-left:var(--s6);border-left:1px solid var(--rule)}
.c-verdict{padding-top:var(--s5);border-top:2px solid var(--rule2);
  font-size:var(--type-body);max-width:74ch}
.c-verdict>b:first-child{font-size:var(--type-data)}
.c-v-h{font-size:var(--type-micro);letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3);padding:var(--s4) 0 var(--s2)}
.c-note{color:var(--ink2)}

.c-item{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto;
  gap:var(--s4);padding:var(--s2) 0;border-top:1px solid var(--rule);
  align-items:baseline;transition:background var(--micro)}
.c-item:first-child{border-top:0}
.c-item[data-context]{cursor:pointer;margin-left:calc(var(--s2) * -1);
  padding-left:var(--s2)}
.c-item[data-context]:hover{background:var(--bg2)}
.c-item.sel{background:var(--bg2);box-shadow:inset 2px 0 0 var(--rule2)}
.c-item em{font-style:normal;display:block;color:var(--ink3);font-size:var(--type-micro)}
.c-i-b{color:var(--ink2);font-size:var(--type-micro)}
.c-i-c{text-align:right;font-size:var(--type-data)}
.c-item .m{font-size:11px} .m.y{color:var(--ink)} .m.n{color:var(--ink3)}
.c-rule{height:1px;background:var(--rule2);margin:var(--s2) 0}
.unp{font-size:var(--type-micro);letter-spacing:.1em;color:var(--hold);
  border-bottom:1px solid var(--hold)}

/* ------------------------------------------------- evidence compression */
.c-comp{display:flex;flex-direction:column;gap:var(--s2);padding-bottom:var(--s5)}
.c-cm{display:grid;grid-template-columns:92px minmax(0,1fr);gap:var(--s4);
  align-items:center;position:relative}
.c-cm b{text-align:right;font-size:var(--type-data);color:var(--ink2)}
.c-cm i{height:1px;background:var(--rule2);display:block;transition:width var(--standard)}
.c-cm.assume i{height:1px;background:repeating-linear-gradient(90deg,
  var(--hold) 0 4px,transparent 4px 8px)}
.c-cm em{grid-column:2;font-style:normal;font-size:var(--type-micro);color:var(--ink3);
  padding-top:2px}
.c-cm.keep i{height:3px;background:var(--rule2)}
.c-cm.keep b{font-size:var(--type-title);color:var(--ink)}

.c-exps{display:flex;flex-direction:column}
.c-exp{display:grid;grid-template-columns:22px minmax(0,1fr);gap:var(--s3);
  padding:var(--s3) 0;border-top:1px solid var(--rule);cursor:pointer;
  transition:background var(--micro)}
.c-exp:hover{background:var(--bg2)}
.c-exp.sel{background:var(--bg2);box-shadow:inset 2px 0 0 var(--rule2)}
.c-exp-l{font-family:var(--serif);font-size:var(--type-data);font-weight:var(--w-strong)}
.c-exp-b{display:grid;grid-template-columns:auto auto 1fr auto;gap:var(--s4);
  align-items:baseline}
.c-exp-n{color:var(--ink2);font-size:var(--type-micro)}
.c-exp-u{color:var(--stop);font-size:var(--type-micro)}
.c-exp-n .num,.c-exp-u .num{font-size:var(--type-data)}
.c-exp-r{border-bottom:1px dotted var(--rule);align-self:center;height:1px}
.c-exp-v{font-size:var(--type-body)}

/* ---------------------------------------------------- policy threshold */
.c-thresh{padding-bottom:var(--s4)}
.c-th-bar{display:flex;height:2px;background:var(--rule)}
.c-th-bar i{display:block;transition:width var(--standard)}
.c-th-bar .a{background:var(--rule2);height:6px;margin-top:-2px}
.c-th-bar .r{background:var(--hold);height:2px}
.c-th-bar .b{background:var(--stop);height:2px}
.c-th-ends{display:flex;justify-content:space-between;padding-top:var(--s2);
  font-size:var(--type-micro);letter-spacing:.11em;color:var(--ink3)}
.c-th-ends b{color:var(--ink);font-size:var(--type-body)}
.c-unpriced{padding:var(--s4) 0 var(--s5);color:var(--ink2);max-width:60ch;
  border-left:2px solid var(--hold);padding-left:var(--s4);
  margin-left:calc(var(--s4) * -1)}
.c-unpriced b{letter-spacing:.11em;color:var(--hold)}

/* ------------------------------------------------------ trail and time */
.c-trail,.c-time{display:flex;flex-direction:column}
.c-tr{display:grid;grid-template-columns:16px 108px minmax(0,1fr);gap:var(--s3);
  padding:var(--s2) 0;border-top:1px solid var(--rule);align-items:baseline}
.c-tr:first-child{border-top:0}
.c-tr-m{color:var(--ink3)}
.ac-model .c-tr-m,.ac-model .c-te-m{color:var(--cool)}
.ac-solver .c-tr-m,.ac-solver .c-te-m{color:var(--hold)}
.ac-engine .c-tr-m,.ac-engine .c-te-m{color:var(--ink)}
.c-tr-a{font-size:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3)}
.c-tr-a em{font-style:normal;display:block;letter-spacing:0;text-transform:none;
  color:var(--ink2)}
.c-tr-d em{font-style:normal;display:block;color:var(--ink3);font-size:var(--type-micro)}
.c-te{display:grid;grid-template-columns:62px 16px minmax(0,1fr);gap:var(--s3);
  padding:var(--s2) 0;border-top:1px solid var(--rule);align-items:baseline}
.c-te:first-child{border-top:0}
.c-te-t{font-size:var(--type-micro);color:var(--ink3)}
.c-te-a{font-size:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);padding-right:var(--s2)}
.c-te-b em{font-style:normal;display:block;color:var(--ink3);font-size:var(--type-micro)}

/* --------------------------------------------------------------- claims */
.c-cl{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:var(--s4);
  padding:var(--s3) 0;border-top:1px solid var(--rule);align-items:baseline;
  cursor:pointer}
.c-cl:hover{background:var(--bg2)}
.c-cl-s{font-size:var(--type-micro);letter-spacing:.11em;color:var(--ink3)}
.st-REJECTED .c-cl-s{color:var(--stop)} .st-LIMITED .c-cl-s{color:var(--hold)}
.st-MEASURED .c-cl-s{color:var(--flow)}
.c-cl-t em{font-style:normal;display:block;color:var(--ink3);font-size:var(--type-micro)}
.c-cl-v{text-align:right;font-size:var(--type-data)}

/* --------------------------------------------------------- the object */
#w-ctx{min-width:0}
.c-obj{border-left:2px solid var(--rule2);padding-left:var(--s5);
  position:sticky;top:0}
.c-obj header{font-size:var(--type-micro);letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3);padding-bottom:var(--s3)}
.c-o-amt{font-size:var(--type-title);padding-bottom:var(--s3)}
.c-obj p{color:var(--ink2);padding-bottom:var(--s3);font-size:var(--type-micro)}
.c-empty{padding:var(--s7) 0;max-width:56ch}
.c-empty b{display:block;font:var(--w-reg) var(--type-title)/1.4 var(--serif);
  padding-bottom:var(--s2)}
.c-empty span{color:var(--ink2)}
.c-err{color:var(--stop);padding:var(--s6) 0}
.c-load{display:flex;flex-direction:column;gap:var(--s4);padding:var(--s7) var(--s9)}
.c-load i{height:1px;background:var(--rule);animation:c-p 1.2s ease-in-out infinite}
.c-load i:last-child{width:60%;animation-delay:.15s}
@keyframes c-p{50%{background:var(--rule2)}}

/* --------------------------------------------------------------- motion */
@keyframes ctx-in{from{opacity:0;transform:translateY(calc(var(--oy,0px) * .2))}}
@keyframes ctx-out{to{opacity:0;transform:translateY(calc(var(--oy,0px) * .15))}}
@keyframes turn-in{from{opacity:0;transform:translateY(4px)}}
@keyframes turn-out{to{opacity:0}}
@keyframes slide-in{from{opacity:0;transform:translateX(8px)}}
@keyframes slide-out{to{opacity:0}}
.x-in-ctx{animation:ctx-in var(--spatial)} .x-out-ctx{animation:ctx-out 100ms ease-in}
.x-in-turn{animation:turn-in var(--standard)} .x-out-turn{animation:turn-out 100ms ease-in}
.x-in-slide{animation:slide-in var(--standard)} .x-out-slide{animation:slide-out 100ms ease-in}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}
}

/* ----------------------------------------------------------- responsive */
@media (max-width:1279px){
  .x-subject,.x-lenses{padding-left:var(--s7);padding-right:var(--s7)}
  #workspace{padding:var(--s7)}
}
@media (max-width:1023px){
  #workspace.has-pane{grid-template-columns:1fr}
  .c-obj{position:static}
  .c-idx{gap:var(--s5);overflow-x:auto}
  .c-tick{grid-template-columns:88px 1fr 72px}
}
@media (max-width:767px){
  .x-subject{padding:var(--s5) var(--s4) var(--s4)}
  .c-sub{grid-template-columns:1fr;grid-template-areas:"l" "a" "m";gap:var(--s2) 0}
  .c-sub-amt{font-size:var(--type-title)}
  .x-lenses{padding:0 var(--s4)}
  #workspace{padding:var(--s5) var(--s4)}
  #workspace.has-pane #w-main{display:none}
  .c-ev{padding-left:var(--s4)}
  .c-exp-b{grid-template-columns:auto auto;gap:var(--s3)}
  .c-exp-r{display:none}
  .c-cm{grid-template-columns:72px 1fr}
  .c-item{grid-template-columns:minmax(0,1fr) auto}
  .c-i-b{display:none}
  .c-sub-l,.c-sub-l h1,.c-sub-amt{min-width:0;overflow-wrap:anywhere}
  .c-tick{grid-template-columns:66px minmax(0,1fr) 56px;gap:var(--s2)}
  .c-tr{grid-template-columns:14px minmax(0,1fr)}
  .c-tr-d{grid-column:2}
  .c-te{grid-template-columns:52px 14px minmax(0,1fr)}
  .c-cl{grid-template-columns:minmax(0,1fr) auto}
  .c-cl-s{grid-column:1/-1}
}
</style>
<div id=app>
  <header id=subject></header>
  <nav id=lenses></nav>
  <main id=workspace><div id=w-main></div><aside id=w-ctx></aside></main>
</div>
<div id=live aria-live=polite style="position:absolute;left:-9999px"></div>
<script src=../guard.js></script>
<script src=kit.js></script>
<script src=data.js></script>
<script src=comp-c.js></script>
<script src=../shell.js></script>
