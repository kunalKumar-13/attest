<!doctype html><meta charset=utf-8>
<title>ATTEST · A — Financial terminal</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>
/* ============================================================ COMPOSITION A
   FINANCIAL TERMINAL

   Read like a book: by column, by alignment, by the shape of a number against
   its neighbour. Density is the feature. The collapse is the hero and it lives
   at the top of every lens, full width, so the eye lands on where the bar stops
   before it reads a word.

   Discipline: hairlines only, no card unless it is an action or a context
   object, every figure tabular, nothing centred, two radii, one 4px scale. */

:root{
  /* type — six named roles, no one-offs */
  --type-display:34px; --type-title:19px; --type-data:15px;
  --type-body:13px;    --type-label:11px; --type-micro:10px;
  --w-reg:400; --w-num:500; --w-strong:600;

  /* space — 4px scale, eight steps */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px;
  --s6:24px; --s7:32px; --s8:40px;

  --r-sm:3px; --r-lg:6px;

  /* motion — three tiers */
  --micro:120ms cubic-bezier(.2,0,0,1);
  --standard:200ms cubic-bezier(.2,0,0,1);
  --spatial:300ms cubic-bezier(.16,1,.3,1);

  /* near-monochrome; saturation is reserved for money that stopped */
  --bg:#0b0d10; --bg2:#12151a; --line:#1e232b; --line2:#2b323d;
  --ink:#e8ecf2; --ink2:#98a3b3; --ink3:#5d6775;
  --stop:#ff5c48; --flow:#3fb37f; --hold:#e0a33a; --cool:#4a9eff;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
}
@media (prefers-color-scheme:light){:root{
  --bg:#fbfbfc; --bg2:#f2f4f7; --line:#e3e7ec; --line2:#cfd6df;
  --ink:#10141a; --ink2:#5a6472; --ink3:#8b94a2;
  --stop:#c62d1a; --flow:#1c7a52; --hold:#9a6a10; --cool:#1665c8;}}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:var(--w-reg) var(--type-body)/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;overflow:hidden}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-weight:var(--w-num);letter-spacing:-.01em}
button{font:inherit;color:inherit;background:0;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--cool);outline-offset:1px}

#app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}
/* Grid items default to min-width:auto, so a child that refuses to wrap sets
   the whole row's width and the page scrolls sideways however carefully the
   inner rules are written. This is the fix for that, not the inner wrapping. */
#app>*{min-width:0}
#subject,#lenses,#workspace,#w-main,#w-ctx{min-width:0}

/* ------------------------------------------------------------- header */
.x-subject{display:flex;align-items:baseline;gap:var(--s6);
  padding:var(--s3) var(--s5);border-bottom:1px solid var(--line)}
.a-hd{display:contents}
.a-hd-id{display:flex;align-items:baseline;gap:var(--s2);min-width:0}
.a-id{font-size:var(--type-title);font-weight:var(--w-strong);letter-spacing:-.02em}
.a-sub{font-size:var(--type-micro);color:var(--ink3);text-transform:uppercase;
  letter-spacing:.08em}
.a-hd-amt{margin-left:auto;display:flex;align-items:baseline;gap:var(--s2)}
.a-hd-amt .num{font-size:var(--type-display);font-weight:var(--w-num);line-height:1}
.a-amt-l{font-size:var(--type-micro);color:var(--ink3);text-transform:uppercase;
  letter-spacing:.08em}
.a-hd-meta{display:flex;gap:var(--s4)}
.a-mi{display:flex;gap:var(--s1);font-size:var(--type-micro)}
.a-mi i{color:var(--ink3);font-style:normal;text-transform:uppercase;letter-spacing:.06em}
.a-mi b{color:var(--ink2);font-weight:var(--w-num)}

/* -------------------------------------------------------- lens strip */
.x-lenses{display:flex;gap:0;padding:0 var(--s5);border-bottom:1px solid var(--line)}
.x-lenses button{padding:var(--s2) var(--s4) calc(var(--s2) - 1px);
  font-size:var(--type-label);text-transform:uppercase;letter-spacing:.1em;
  color:var(--ink3);border-bottom:2px solid transparent;transition:color var(--micro)}
.x-lenses button:hover{color:var(--ink2)}
.x-lenses button.on{color:var(--ink);border-bottom-color:var(--stop);
  font-weight:var(--w-strong)}

/* ------------------------------------------------------------- canvas */
#workspace{overflow:auto;padding:var(--s5);display:grid;
  grid-template-columns:1fr;gap:var(--s6);align-content:start}
#workspace.has-pane{grid-template-columns:minmax(0,1fr) minmax(0,400px)}
#w-ctx:empty{display:none}
/* No empty context pane. `has-pane` says this lens can show one; `has-ctx`
   says one is open. Until it is, the master owns the full width — which is
   also what makes the opening transition mean something. */
#workspace.has-pane:not(.has-ctx){grid-template-columns:minmax(0,1fr)}
#workspace.has-pane:not(.has-ctx) #w-ctx{display:none}


/* ------------------------------------------------ THE COLLAPSE (hero) */
.a-spine{display:grid;grid-template-columns:96px 1fr 84px 1fr;
  gap:var(--s1) var(--s3);align-items:center;
  padding:var(--s3) 0 var(--s4);border-bottom:1px solid var(--line);
  grid-column:1/-1}
.a-st{display:contents}
.a-st-k{font-size:var(--type-label);text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink3)}
.a-st-bar{position:relative;height:14px;background:var(--bg2);border-radius:var(--r-sm)}
.a-st-bar i{position:absolute;inset:0 auto 0 0;background:var(--flow);
  border-radius:var(--r-sm);transition:width var(--standard)}
.a-st.stop .a-st-bar i{background:var(--stop)}
.a-st.s-blocked .a-st-bar i,.a-st.s-stopped .a-st-bar i{background:var(--stop)}
.a-cut{position:absolute;left:0;right:0;top:-3px;bottom:-3px;
  border-right:2px solid var(--stop);pointer-events:none}
.a-st-v{font-size:var(--type-data);text-align:right;color:var(--ink)}
.a-st.stop .a-st-v{color:var(--stop)}
.a-st-d{font-size:var(--type-micro);color:var(--ink3);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.a-spine-note{grid-column:1/-1;font-size:var(--type-label);color:var(--stop);
  text-transform:uppercase;letter-spacing:.09em;padding-top:var(--s1)}
.a-spine-note b{font-weight:var(--w-strong)}

/* ------------------------------------------------------------- panels */
.a-pan{min-width:0}
.a-pan h2{font-size:var(--type-label);text-transform:uppercase;letter-spacing:.1em;
  color:var(--ink3);font-weight:var(--w-strong);padding-bottom:var(--s2);
  border-bottom:1px solid var(--line);margin-bottom:var(--s2)}

/* --------------------------------------------------------- data table */
.a-tbl{width:100%;border-collapse:collapse;font-size:var(--type-body)}
.a-tbl th{font-size:var(--type-micro);text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink3);font-weight:var(--w-reg);text-align:left;padding:0 var(--s2) var(--s1)}
.a-tbl td{padding:var(--s1) var(--s2);border-top:1px solid var(--line);
  vertical-align:top}
.a-tbl tbody tr{transition:background var(--micro)}
.a-tbl tbody tr[data-context]{cursor:pointer}
.a-tbl tbody tr[data-context]:hover{background:var(--bg2)}
.a-tbl tbody tr.sel{background:var(--bg2);box-shadow:inset 2px 0 0 var(--cool)}
.a-tbl .r{text-align:right}
.a-tbl .dim{color:var(--ink2)}
.a-tbl .mark{width:18px;color:var(--ink2);font-size:var(--type-body)}
.a-tbl .hot{color:var(--stop)}
.a-tbl .ok{color:var(--flow)}
.a-tbl .bad{color:var(--stop)}
.a-tbl .ac{font-size:var(--type-micro);text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink3);width:64px}
.a-tbl .vb{font-size:var(--type-micro);color:var(--ink2);width:72px}
.a-tbl .cid{color:var(--ink3);width:52px}
.a-tbl .stt{font-size:var(--type-micro);letter-spacing:.07em;text-align:right}
tr.ac-model .mark{color:var(--cool)}
tr.ac-solver .mark{color:var(--hold)}
tr.ac-engine .mark{color:var(--ink)}
tr.st-REJECTED .stt,tr.st-REJECTED .mark{color:var(--stop)}
tr.st-LIMITED .stt,tr.st-LIMITED .mark{color:var(--hold)}
tr.st-MEASURED .stt,tr.st-MEASURED .mark{color:var(--flow)}

/* ------------------------------------------------ evidence: the band */
.a-band{display:flex;flex-direction:column;gap:var(--s1)}
.a-band-row{display:grid;grid-template-columns:96px minmax(0,1fr) minmax(0,1.1fr);
  gap:var(--s3);align-items:center}
.a-band-row>span{font-size:var(--type-data);text-align:right;color:var(--ink)}
.a-band-row i{height:10px;background:var(--ink3);border-radius:var(--r-sm);
  transition:width var(--standard)}
.a-band-row i.det{background:var(--ink2)}
.a-band-row i.heu{background:var(--hold)}
.a-band-row.red>span{color:var(--ink3)}
.a-band-row.keep i{background:var(--flow)}
.a-band-row.keep>span{color:var(--flow);font-size:var(--type-title)}
.a-band-row em{font-style:normal;font-size:var(--type-micro);color:var(--ink2)}
.a-band-row em b{font-size:9px;letter-spacing:.08em;color:var(--ink3);
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:0 3px;margin-left:var(--s1)}
.a-agree{padding-top:var(--s3);font-size:var(--type-body);color:var(--ink2)}
.a-agree .num{color:var(--ink);font-size:var(--type-data)}
.a-agree .hot{color:var(--stop)}
.a-agree .sep{padding:0 var(--s2);color:var(--ink3)}
.a-exp .mark{font-weight:var(--w-strong);color:var(--ink)}
.a-tbl .big{font-size:var(--type-data)}
.a-tbl .kind{font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);width:64px;padding-top:6px}
.k-systemic{color:var(--flow)!important} .k-rerun{color:var(--cool)!important}
.k-per_item{color:var(--hold)!important}
.a-ctx-why{font-size:var(--type-body);color:var(--ink2);padding-bottom:var(--s3)}

/* --------------------------------------------------- policy boundary */
.a-bound{display:flex;flex-direction:column;gap:var(--s1);padding-bottom:var(--s3)}
.a-bd{display:grid;grid-template-columns:88px minmax(0,1fr) 52px;gap:var(--s3);
  align-items:center}
.a-bd .l{font-size:var(--type-label);letter-spacing:.09em;color:var(--ink3)}
.a-bd i{height:12px;border-radius:var(--r-sm);background:var(--ink3);
  transition:width var(--standard)}
.a-bd b{font-size:var(--type-data);text-align:right}
.d-auto_post i{background:var(--flow)} .d-review i{background:var(--hold)}
.d-block i{background:var(--stop)}
.unp{font-style:normal;font-size:var(--type-micro);letter-spacing:.09em;
  color:var(--hold);border:1px solid var(--hold);border-radius:var(--r-sm);padding:0 4px}

/* ----------------------------------------------------------- journal */
.a-books{display:flex;gap:var(--s7);padding-bottom:var(--s3)}
.a-books div{display:flex;flex-direction:column;gap:2px}
.a-books i{font-style:normal;font-size:var(--type-label);letter-spacing:.09em;
  color:var(--ink3);text-transform:uppercase}
.a-books b{font-size:var(--type-title)}
.a-books .ok{color:var(--flow)} .a-books .bad{color:var(--stop)}

.a-out{font-size:var(--type-body);color:var(--ink2);padding-top:var(--s3);
  border-top:1px solid var(--line);margin-top:var(--s2)}

/* --------------------------------------------------- context (surface) */
#w-ctx{min-width:0}
.a-ctx{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden}
.a-ctx header{padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);
  font-size:var(--type-label);text-transform:uppercase;letter-spacing:.1em;
  color:var(--ink2)}
.a-ctx>div{padding:var(--s3)}
.a-ctx-amt{font-size:var(--type-title);padding-bottom:var(--s2)}

/* ------------------------------------------------- empty / err / load */
.a-empty,.a-decline{padding:var(--s6) 0;max-width:62ch}
.a-empty b,.a-decline b{display:block;font-size:var(--type-title);
  font-weight:var(--w-strong);padding-bottom:var(--s1)}
.a-empty span,.a-decline{color:var(--ink2)}
.a-err{color:var(--stop);padding:var(--s5) 0}
.a-load{display:flex;gap:var(--s1);padding:var(--s7) 0}
.a-load i{width:24px;height:8px;background:var(--bg2);border-radius:var(--r-sm);
  animation:a-pulse 1s ease-in-out infinite}
.a-load i:nth-child(2){animation-delay:.12s} .a-load i:nth-child(3){animation-delay:.24s}
@keyframes a-pulse{50%{background:var(--line2)}}

/* ------------------------------------------------------------- motion */
@keyframes ctx-in{from{opacity:0;transform:translateY(calc(var(--oy,0px) * .18)) scale(.985)}}
@keyframes ctx-out{to{opacity:0;transform:translateY(calc(var(--oy,0px) * .12)) scale(.99)}}
@keyframes turn-in{from{opacity:0;transform:translateY(6px)}}
@keyframes turn-out{to{opacity:0;transform:translateY(-4px)}}
@keyframes slide-in{from{opacity:0;transform:translateX(10px)}}
@keyframes slide-out{to{opacity:0;transform:translateX(-8px)}}
.x-in-ctx{animation:ctx-in var(--spatial)} .x-out-ctx{animation:ctx-out 110ms ease-in}
.x-in-turn{animation:turn-in var(--standard)} .x-out-turn{animation:turn-out 110ms ease-in}
.x-in-slide{animation:slide-in var(--standard)} .x-out-slide{animation:slide-out 110ms ease-in}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}
}

/* --------------------------------------------------------- responsive */
@media (max-width:1023px){
  .a-spine{grid-template-columns:80px 1fr 72px;}
  .a-st-d{display:none}
  #workspace.has-pane{grid-template-columns:1fr}
}
@media (max-width:767px){
  .x-subject{flex-wrap:wrap;gap:var(--s2)}
  .a-hd-amt{margin-left:0;width:100%}
  .a-hd-amt .num{font-size:var(--type-title)}
  .a-hd-meta{width:100%}
  .x-lenses{overflow-x:auto;padding:0 var(--s3)}
  #workspace{padding:var(--s3)}
  #workspace.has-pane #w-main{display:none}
  .a-band-row{grid-template-columns:64px 1fr}
  .a-band-row em{display:none}
  /* The spine's four columns cannot fit 360px. Detail drops, value shrinks,
     and the bar keeps the width it needs to still read as a collapse. */
  .a-spine{grid-template-columns:72px minmax(0,1fr) 60px}
  .a-st-v{font-size:var(--type-body)}
  .a-hd-meta{flex-wrap:wrap;gap:var(--s2)}
  #workspace,.a-pan,.a-tbl{min-width:0}
  .a-tbl{table-layout:fixed}
  .a-tbl td{overflow:hidden;text-overflow:ellipsis}
}
</style>
<div id=app>
  <header id=subject></header>
  <nav id=lenses></nav>
  <main id=workspace><div id=w-main></div><aside id=w-ctx></aside></main>
</div>
<div id=live aria-live=polite class=sr-only style="position:absolute;left:-9999px"></div>
<script src=../guard.js></script>
<script src=kit.js></script>
<script src=data.js></script>
<script src=comp-a.js></script>
<script src=../shell.js></script>
<script src=boot.js></script>
