<!doctype html><meta charset=utf-8>
<title>ATTEST · B — Spatial investigation desk</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>
/* ============================================================ COMPOSITION B
   SPATIAL INVESTIGATION DESK

   A case is a physical thing on a desk. It has a spine down the left edge that
   physically tapers where value stops, documents laid on a surface, and objects
   you can pick up. Picking one up lifts it out of the page you were reading;
   putting it down leaves you where you were.

   Motion is used more heavily here than in A, and every use models an object
   moving rather than a page changing. */

:root{
  --type-display:32px; --type-title:18px; --type-data:15px;
  --type-body:13px;    --type-label:11px; --type-micro:10px;
  --w-reg:400; --w-num:500; --w-strong:600;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px;
  --r-sm:3px; --r-lg:8px;
  --micro:130ms cubic-bezier(.2,0,0,1);
  --standard:220ms cubic-bezier(.2,0,0,1);
  --spatial:340ms cubic-bezier(.16,1,.3,1);

  /* desk surfaces: paper on a darker bench */
  --bench:#e9e6e0; --paper:#fdfcfa; --paper2:#f4f2ee;
  --edge:#d9d5cd; --edge2:#c3bdb2;
  --ink:#1c1a17; --ink2:#5f594f; --ink3:#918a7d;
  --stop:#b3341f; --flow:#2f7a55; --hold:#a97511; --cool:#2f6bb5;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bench:#16181b; --paper:#1e2126; --paper2:#242830; --edge:#2c313a; --edge2:#3a414d;
  --ink:#eceff4; --ink2:#a4adba; --ink3:#6d7683;
  --stop:#ff6a52; --flow:#4cbd8a; --hold:#e2ab45; --cool:#63a8ff;}}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bench);color:var(--ink);
  font:var(--w-reg) var(--type-body)/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  overflow:hidden}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:var(--w-num)}
button{font:inherit;color:inherit;background:0;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
#app{display:grid;grid-template-rows:auto auto 1fr;height:100vh;gap:0}
/* Grid items default to min-width:auto, so a child that refuses to wrap sets
   the whole row's width and the page scrolls sideways however carefully the
   inner rules are written. This is the fix for that, not the inner wrapping. */
#app>*{min-width:0}
#subject,#lenses,#workspace,#w-main,#w-ctx{min-width:0}

/* ------------------------------------------------------- the case file */
.x-subject{padding:var(--s4) var(--s6) 0}
.b-case{position:relative;background:var(--paper);border:1px solid var(--edge);
  border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:var(--s4) var(--s5) var(--s3);display:flex;align-items:flex-end;
  gap:var(--s6);box-shadow:0 1px 0 rgba(0,0,0,.04)}
.b-tab{position:absolute;top:-1px;left:var(--s5);transform:translateY(-100%);
  background:var(--paper);border:1px solid var(--edge);border-bottom:0;
  border-radius:var(--r-sm) var(--r-sm) 0 0;padding:2px var(--s3);
  font-size:9px;letter-spacing:.14em;color:var(--ink3)}
.b-case-body{display:flex;align-items:baseline;gap:var(--s6);flex:1;min-width:0;
  flex-wrap:wrap}
.b-case-id{font-size:var(--type-title);font-weight:var(--w-strong);letter-spacing:-.01em}
.b-case-id em,.b-case-amt em{font-style:normal;font-size:var(--type-micro);
  color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;padding-left:var(--s2)}
.b-case-amt{margin-left:auto;font-size:var(--type-display);line-height:1}
.b-case-meta{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);
  padding-bottom:3px;min-width:0}
.b-case-meta i{font-style:normal;font-size:var(--type-micro);color:var(--ink3);
  text-transform:uppercase;letter-spacing:.06em}
.b-case-meta b{font-size:var(--type-body);color:var(--ink2)}

/* -------------------------------------------------------------- keys */
.x-lenses{padding:0 var(--s6);background:var(--bench)}
.b-keys{display:flex;background:var(--paper);border:1px solid var(--edge);
  border-top:0;border-bottom:1px solid var(--edge);overflow:hidden}
.b-keys button{flex:1;padding:var(--s2) var(--s3);border-right:1px solid var(--edge);
  transition:background var(--micro),box-shadow var(--micro);min-width:0}
.b-keys button:last-child{border-right:0}
.b-keys .n{display:block;font-size:var(--type-label);letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink3);font-weight:var(--w-strong)}
.b-keys .q{display:block;font-size:var(--type-micro);color:var(--ink3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.75}
.b-keys button:hover{background:var(--paper2)}
/* the active key is seated: pushed in, with the case colour bleeding through */
.b-keys button.on{background:var(--paper2);
  box-shadow:inset 0 3px 0 var(--stop),inset 0 -1px 0 var(--edge2)}
.b-keys button.on .n{color:var(--ink)}
.b-keys button.on .q{color:var(--ink2);opacity:1}

/* ------------------------------------------------------------- desk */
#workspace{overflow:auto;padding:var(--s5) var(--s6) var(--s7);
  display:grid;grid-template-columns:1fr;gap:var(--s5);align-content:start}
#workspace.has-pane{grid-template-columns:minmax(0,1fr) minmax(0,380px)}
#w-ctx:empty{display:none}
/* No empty context pane. `has-pane` says this lens can show one; `has-ctx`
   says one is open. Until it is, the master owns the full width — which is
   also what makes the opening transition mean something. */
#workspace.has-pane:not(.has-ctx){grid-template-columns:minmax(0,1fr)}
#workspace.has-pane:not(.has-ctx) #w-ctx{display:none}

.b-desk{display:grid;grid-template-columns:186px minmax(0,1fr);gap:var(--s6)}

/* --------------------------------------------- the structural spine */
.b-spine{display:flex;flex-direction:column;gap:0;position:sticky;top:0;
  align-self:start;padding-top:var(--s1)}
.b-seg{display:grid;grid-template-columns:22px 1fr;gap:var(--s3);
  padding-bottom:var(--s4);position:relative}
.b-seg-col{display:flex;justify-content:center;align-items:stretch}
.b-seg-col i{display:block;background:var(--flow);border-radius:1px;
  min-height:34px;transition:width var(--standard)}
.b-seg.stop .b-seg-col i{background:var(--stop)}
.b-seg::after{content:"";position:absolute;left:11px;top:34px;bottom:0;
  width:1px;background:var(--edge2)}
.b-seg:last-child::after{display:none}
.b-seg-t b{display:block;font-size:var(--type-label);letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink2);font-weight:var(--w-strong)}
.b-seg-t .num{display:block;font-size:var(--type-data);color:var(--ink)}
.b-seg.stop .b-seg-t .num{color:var(--stop)}
.b-seg-t em{display:block;font-style:normal;font-size:var(--type-micro);
  color:var(--ink3);line-height:1.35}
.b-surface{min-width:0;display:flex;flex-direction:column;gap:var(--s5)}

/* -------------------------------------------------------- documents */
.b-doc{background:var(--paper);border:1px solid var(--edge);border-radius:var(--r-lg);
  padding:var(--s4) var(--s5) var(--s4);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.b-doc h2{font-size:var(--type-label);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);font-weight:var(--w-strong);padding-bottom:var(--s3)}
.b-verdict{background:var(--paper2);border-style:dashed}
.b-line{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) auto;
  gap:var(--s3);padding:var(--s2) 0;border-top:1px solid var(--edge);
  align-items:baseline;transition:background var(--micro)}
.b-line:first-of-type{border-top:0}
.b-line[data-context]{cursor:pointer;margin:0 calc(var(--s2) * -1);
  padding-left:var(--s2);padding-right:var(--s2);border-radius:var(--r-sm)}
.b-line[data-context]:hover{background:var(--paper2)}
.b-line.sel{background:var(--paper2);box-shadow:inset 2px 0 0 var(--cool)}
.b-line em{font-style:normal;color:var(--ink3);font-size:var(--type-micro);display:block}
.b-line .m{color:var(--ink2);font-weight:var(--w-reg)}
.b-l-c{text-align:right;font-size:var(--type-data)}
.b-resid{padding-top:var(--s3);font-size:var(--type-micro);color:var(--ink3)}
.b-why{color:var(--ink2);max-width:64ch}
.unp{font-size:var(--type-micro);letter-spacing:.09em;color:var(--hold);
  border:1px solid var(--hold);border-radius:var(--r-sm);padding:0 4px}

/* ------------------------------------------------------------ actions */
.b-act{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:var(--s3);
  padding:var(--s3) var(--s2);border-top:1px solid var(--edge);cursor:pointer;
  margin:0 calc(var(--s2) * -1);border-radius:var(--r-sm);
  transition:background var(--micro),transform var(--micro)}
.b-act:first-of-type{border-top:0}
.b-act:hover{background:var(--paper2)}
.b-act.sel{background:var(--paper2);box-shadow:inset 2px 0 0 var(--cool)}
.b-act-k{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.k-systemic .b-act-k{color:var(--flow)} .k-rerun .b-act-k{color:var(--cool)}
.k-per_item .b-act-k{color:var(--hold)}
.b-act-w em{display:block;font-style:normal;font-size:var(--type-micro);color:var(--ink3)}
.b-act-v{text-align:right;font-size:var(--type-data)}
.b-act-v em{display:block;font-style:normal;font-size:var(--type-micro);
  color:var(--ink3);font-family:var(--sans)}

/* ---------------------------------------------------- evidence funnel */
.b-funnel{display:flex;flex-direction:column;gap:var(--s2)}
.b-fn{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1.05fr);
  gap:var(--s3);align-items:center}
.b-fn i{height:16px;background:var(--ink3);border-radius:2px;
  transition:width var(--standard);justify-self:end;display:block;opacity:.35}
.b-fn i.det{background:var(--ink2);opacity:.5} .b-fn i.heu{background:var(--hold);opacity:.55}
.b-fn b{font-size:var(--type-data);text-align:right}
.b-fn em{font-style:normal;font-size:var(--type-micro);color:var(--ink3)}
.b-fn.keep i{background:var(--flow);opacity:1;height:22px}
.b-fn.keep b{font-size:var(--type-title);color:var(--flow)}
.b-exp{display:grid;grid-template-columns:20px minmax(0,1fr) 128px 108px;gap:var(--s3);
  align-items:center;padding:var(--s2);border-top:1px solid var(--edge);cursor:pointer;
  margin:0 calc(var(--s2) * -1);border-radius:var(--r-sm)}
.b-exp:hover{background:var(--paper2)}
.b-exp.sel{background:var(--paper2);box-shadow:inset 2px 0 0 var(--cool)}
.b-exp-l{font-weight:var(--w-strong);font-size:var(--type-data)}
.b-exp-bar{display:flex;height:14px;border-radius:2px;overflow:hidden;background:var(--paper2)}
.b-exp-bar .sh{background:var(--ink3);opacity:.45} .b-exp-bar .uq{background:var(--stop)}
.b-exp-n{font-size:var(--type-micro);color:var(--ink3)}
.b-exp-n b{color:var(--stop);font-size:var(--type-body)}
.b-exp-v{text-align:right;font-size:var(--type-body)}
.b-agree{padding-top:var(--s3);color:var(--ink2);font-size:var(--type-body)}
.b-agree .hot{color:var(--stop)}

/* --------------------------------------------------------- the gate */
.b-gate{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s4);
  align-items:center;padding-bottom:var(--s4)}
.b-gate-side{text-align:center}
.b-gate-side b{display:block;font-size:var(--type-title)}
.b-gate-side em{font-style:normal;font-size:9px;letter-spacing:.11em;color:var(--ink3)}
.b-gate-side.auto b{color:var(--flow)} .b-gate-side.rev b{color:var(--hold)}
.b-gate-bar{display:flex;height:18px;border-radius:2px;overflow:hidden;background:var(--paper2)}
.b-gate-bar .a{background:var(--flow)} .b-gate-bar .r{background:var(--hold)}
.b-gate-bar .b{background:var(--stop)}

/* ------------------------------------------------------ causal chain */
.b-chain{display:flex;flex-direction:column}
.b-ce{display:grid;grid-template-columns:18px minmax(0,1fr) 62px;gap:var(--s3);
  padding:var(--s2) var(--s2) var(--s3);position:relative;cursor:pointer;
  margin:0 calc(var(--s2) * -1);border-radius:var(--r-sm)}
.b-ce:hover{background:var(--paper2)}
.b-ce.sel{background:var(--paper2);box-shadow:inset 2px 0 0 var(--cool)}
.b-ce::after{content:"";position:absolute;left:16px;top:24px;bottom:0;width:1px;
  background:var(--edge2)}
.b-ce:last-child::after{display:none}
.b-ce-m{color:var(--ink2);text-align:center;position:relative;z-index:1;
  background:var(--paper)}
.b-ce.ac-model .b-ce-m{color:var(--cool)} .b-ce.ac-solver .b-ce-m{color:var(--hold)}
.b-ce.ac-engine .b-ce-m{color:var(--ink)}
.b-ce-a{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.b-ce-a em{font-style:normal;padding-left:var(--s2);color:var(--ink3);opacity:.7}
.b-ce-w{font-size:var(--type-body)}
.b-ce-c,.b-ce-e{font-size:var(--type-micro);color:var(--ink3)}
.b-ce-t{text-align:right;font-size:var(--type-micro);color:var(--ink3)}

/* ------------------------------------------------------------ claims */
.b-claim{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:var(--s3);
  padding:var(--s3) var(--s2);border-top:1px solid var(--edge);cursor:pointer;
  align-items:baseline;margin:0 calc(var(--s2) * -1);border-radius:var(--r-sm)}
.b-claim:hover{background:var(--paper2)}
.b-cl-s{font-size:9px;letter-spacing:.1em;color:var(--ink3)}
.st-REJECTED .b-cl-s{color:var(--stop)} .st-LIMITED .b-cl-s{color:var(--hold)}
.st-MEASURED .b-cl-s{color:var(--flow)}
.b-cl-a{font-size:var(--type-micro);color:var(--ink3)}
.b-cl-v{text-align:right;font-size:var(--type-data)}
.b-bad{border-color:var(--edge2);background:var(--paper2)}

/* ------------------------------------------------- the inspected object */
#w-ctx{min-width:0}
.b-obj{background:var(--paper);border:1px solid var(--edge2);border-radius:var(--r-lg);
  box-shadow:0 8px 24px rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.06);
  position:sticky;top:var(--s1)}
.b-obj header{padding:var(--s3) var(--s4);border-bottom:1px solid var(--edge)}
.b-obj-h{font-size:var(--type-label);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink2);font-weight:var(--w-strong)}
.b-obj-b{padding:var(--s4)}
.b-obj-amt{font-size:var(--type-title);padding-bottom:var(--s3)}

.b-empty{padding:var(--s6) 0;max-width:60ch}
.b-empty b{display:block;font-size:var(--type-title);padding-bottom:var(--s1)}
.b-empty span{color:var(--ink2)}
.b-err{color:var(--stop);padding:var(--s5)}
.b-load{display:grid;grid-template-columns:186px 1fr;gap:var(--s6);padding:var(--s5) var(--s6)}
.b-load i{height:120px;background:var(--paper2);border-radius:var(--r-lg);
  animation:b-pulse 1.1s ease-in-out infinite}
.b-load i:nth-child(n+2){grid-column:2}
.b-load i:nth-child(3){animation-delay:.12s} .b-load i:nth-child(4){animation-delay:.24s}
@keyframes b-pulse{50%{background:var(--edge)}}

/* ------------------------------------------------------------- motion */
@keyframes ctx-in{from{opacity:0;
  transform:translateY(calc(var(--oy,0px) * .32)) scale(.94);
  box-shadow:0 0 0 rgba(0,0,0,0)}}
@keyframes ctx-out{to{opacity:0;
  transform:translateY(calc(var(--oy,0px) * .26)) scale(.95)}}
@keyframes turn-in{from{opacity:0;transform:translateY(10px) scale(.995)}}
@keyframes turn-out{to{opacity:0;transform:translateY(-6px)}}
@keyframes slide-in{from{opacity:0;transform:translateX(16px)}}
@keyframes slide-out{to{opacity:0;transform:translateX(-12px)}}
.x-in-ctx{animation:ctx-in var(--spatial)} .x-out-ctx{animation:ctx-out 130ms ease-in}
.x-in-turn{animation:turn-in var(--standard)} .x-out-turn{animation:turn-out 120ms ease-in}
.x-in-slide{animation:slide-in var(--standard)} .x-out-slide{animation:slide-out 120ms ease-in}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}
}

/* --------------------------------------------------------- responsive */
@media (max-width:1199px){
  #workspace.has-pane{grid-template-columns:1fr}
  .b-obj{position:static}
}
@media (max-width:1023px){
  .b-desk{grid-template-columns:1fr;gap:var(--s4)}
  .b-spine{position:static;flex-direction:row;gap:var(--s2);overflow-x:auto}
  .b-seg{grid-template-columns:1fr;gap:var(--s1);padding-bottom:0;min-width:110px}
  .b-seg-col{height:8px} .b-seg-col i{min-height:8px;width:100%!important;height:8px}
  .b-seg::after{display:none}
  .b-seg-t em{display:none}
  .b-keys .q{display:none}
}
@media (max-width:767px){
  .x-subject{padding:var(--s3) var(--s3) 0}
  .b-case{flex-wrap:wrap;gap:var(--s2);padding:var(--s3) var(--s4)}
  .b-case-body{flex-wrap:wrap;gap:var(--s2)}
  .b-case-amt{margin-left:0;font-size:var(--type-title)}
  .x-lenses{padding:0 var(--s3)} .b-keys{overflow-x:auto}
  .b-keys button{flex:0 0 auto;min-width:92px}
  #workspace{padding:var(--s3)}
  #workspace.has-pane #w-main{display:none}
  .b-case-id,.b-case-amt{min-width:0;overflow-wrap:anywhere}
  .b-doc{padding:var(--s3) var(--s4)}
  .b-act{grid-template-columns:1fr auto;gap:var(--s2)}
  .b-act-k{grid-column:1/-1}
  .b-line{grid-template-columns:minmax(0,1fr) auto}
  .b-line .b-l-b{display:none}
  .b-exp{grid-template-columns:18px 1fr 84px}
  .b-exp-v{display:none}
  .b-fn{grid-template-columns:1fr 72px}
  .b-fn em{display:none}
}
</style>
<div id=app>
  <header id=subject></header>
  <nav id=lenses></nav>
  <main id=workspace><div id=w-main></div><aside id=w-ctx></aside></main>
</div>
<div id=live aria-live=polite style="position:absolute;left:-9999px"></div>
<script src=../guard.js></script>
<script src=kit.js></script>
<script src=data.js></script>
<script src=comp-b.js></script>
<script src=../shell.js></script>
<script src=boot.js></script>
